<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>DARTS COUNT UP</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
  touch-action:manipulation;
}

/* =========================
   START
========================= */

#startScreen{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:28px;
  background:#050505;
}

#startScreen h1{
  margin:0;
  font-family:
    "Times New Roman",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;
  font-size:48px;
  letter-spacing:6px;
}

#roomInput{
  width:min(520px,82vw);
  height:64px;
  padding:0 20px;
  border:1px solid #444;
  border-radius:8px;
  outline:none;
  background:#111;
  color:#fff;
  text-align:center;
  font-size:24px;
}

.startButtons{
  display:flex;
  gap:20px;
}

.startButtons button{
  width:230px;
  height:110px;
  border:1px solid #555;
  border-radius:10px;
  background:#151515;
  color:#fff;
  font-size:34px;
  font-weight:bold;
}

.startButtons button:active{
  transform:scale(.96);
  background:#292929;
}

/* =========================
   SCREEN
========================= */

.screen{
  display:none !important;
  width:100%;
  height:100%;
}

.screen.active{
  display:flex !important;
}

/* =========================
   INPUT
========================= */

#inputScreen{
  position:relative;
  flex-direction:column;
  align-items:center;
}

.inputTop{
  width:100%;
  height:105px;
  flex:none;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 30px;
}

.turnInfo,
.throwInfo{
  min-width:220px;
  text-align:center;
}

.smallLabel{
  color:#777;
  font-size:13px;
  letter-spacing:2px;
}

#remainingTurns,
#remainingThrows{
  margin-top:3px;
  font-family:
    "Times New Roman",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;
  font-size:52px;
  font-weight:900;
}

#dartboardArea{
  flex:1;
  min-height:0;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 5px;
}

#dartboard{
  display:block;
  width:min(94vw,calc(100vh - 190px));
  height:min(94vw,calc(100vh - 190px));
  max-width:820px;
  max-height:820px;
  touch-action:none;
  user-select:none;
}

#dartboard text{
  pointer-events:none;
  font-family:
    "Bodoni 72",
    "Times New Roman",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;
  font-weight:900;
}

.inputControls{
  width:100%;
  height:70px;
  flex:none;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  padding:8px;
}

.inputControls button{
  height:50px;
  padding:0 22px;
  border:1px solid #444;
  border-radius:7px;
  background:#151515;
  color:#fff;
  font-size:15px;
  font-weight:bold;
}

.inputControls button:active{
  transform:scale(.96);
}

#inputPlayers{
  position:absolute;
  left:10px;
  bottom:78px;
  display:flex;
  flex-direction:column;
  gap:4px;
  max-width:250px;
  z-index:30;
}

.inputPlayer{
  padding:7px 12px;
  border:1px solid #333;
  border-radius:5px;
  background:#111;
  font-size:14px;
}

/* =========================
   OUTPUT
========================= */

#outputScreen{
  position:relative;
  flex-direction:column;
  padding:18px 22px;
}

#outputHeader{
  width:100%;
  min-height:190px;
  flex:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #333;
}

#outputTitle{
  color:#777;
  font-size:25px;
  letter-spacing:5px;
}

#outputCurrentPlayer{
  margin-top:7px;
  font-family:
    "Times New Roman",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;
  font-size:64px;
  font-weight:900;
}

#outputPlayers{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:15px 0;
  overflow:hidden;
}

#outputPlayers.fourOrMore{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(4,minmax(0,1fr));
  grid-auto-flow:column;
  column-gap:12px;
  row-gap:8px;
}

.outputPlayer{
  min-height:70px;
  padding:7px 18px;
  display:flex;
  align-items:center;
  background:#101010;
  border:1px solid #222;
  border-radius:8px;
}

.outputPlayer.current{
  border-color:#d2b300;
  box-shadow:
    0 0 8px rgba(210,179,0,.7),
    inset 0 0 8px rgba(210,179,0,.08);
}

.playerName{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:29px;
  font-weight:bold;
}

.topPrayer{
  display:inline-block;
  margin-left:12px;
  color:#d2b300;
  font-size:13px;
  letter-spacing:1px;
  vertical-align:middle;
}

.turnScore{
  width:100px;
  flex:none;
  margin-right:20px;
  text-align:right;
  color:#777;
  font-family:
    "Times New Roman",
    "Yu Mincho",
    serif;
  font-size:30px;
  font-weight:bold;
}

.playerScore{
  width:145px;
  flex:none;
  text-align:right;
  font-family:
    "Times New Roman",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;
  font-size:72px;
  line-height:1;
  font-weight:900;
}

/* =========================
   EFFECT
========================= */

#scoreEffect{
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%) scale(1);
  z-index:100;
  pointer-events:none;
  opacity:0;
  white-space:nowrap;
  font-family:
    "Times New Roman",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;
  font-size:120px;
  font-weight:900;
}

/* =========================
   HISTORY
========================= */

#historyArea{
  flex:none;
  height:145px;
  border-top:1px solid #333;
  overflow:hidden;
}

.historyTitle{
  padding:5px 0;
  color:#777;
  font-size:12px;
  letter-spacing:3px;
}

#history{
  height:115px;
  display:flex;
  flex-direction:column;
  gap:2px;
  overflow:hidden;
}

.historyItem{
  display:flex;
  justify-content:space-between;
  align-items:center;
  height:20px;
  padding:0 10px;
  background:#0e0e0e;
  font-size:14px;
}

/* =========================
   AUDIO
========================= */

#audioSettings{
  position:absolute;
  right:10px;
  bottom:10px;
  width:230px;
  padding:10px;
  z-index:200;
  display:none;
  background:#111;
  border:1px solid #333;
  border-radius:7px;
}

.audioTitle{
  margin-bottom:8px;
  color:#888;
  font-size:11px;
  letter-spacing:1px;
}

#audioSettings label{
  display:flex;
  flex-direction:column;
  gap:3px;
  margin:5px 0;
  font-size:10px;
}

#audioSettings input{
  width:100%;
  color:#aaa;
  font-size:10px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  #startScreen h1{
    font-size:34px;
  }

  .startButtons{
    flex-direction:column;
  }

  .startButtons button{
    width:260px;
    height:85px;
    font-size:28px;
  }

  .inputTop{
    height:80px;
    padding:5px 12px;
  }

  .turnInfo,
  .throwInfo{
    min-width:120px;
  }

  #remainingTurns,
  #remainingThrows{
    font-size:38px;
  }

  #dartboard{
    width:min(96vw,calc(100vh - 145px));
    height:min(96vw,calc(100vh - 145px));
  }

  .inputControls{
    height:55px;
  }

  .inputControls button{
    padding:0 10px;
    font-size:11px;
  }

  #outputScreen{
    padding:8px;
  }

  #outputHeader{
    min-height:125px;
  }

  #outputCurrentPlayer{
    font-size:42px;
  }

  .playerName{
    font-size:20px;
  }

  .playerScore{
    width:90px;
    font-size:48px;
  }

  .turnScore{
    width:55px;
    margin-right:8px;
    font-size:20px;
  }

  .topPrayer{
    font-size:9px;
    margin-left:5px;
  }

  #scoreEffect{
    font-size:75px;
  }

  #audioSettings{
    display:none !important;
  }
}
</style>
</head>


<body>

<!-- =====================================================
     START SCREEN
===================================================== -->

<div id="startScreen">

  <h1>DARTS SYSTEM</h1>

  <input
    id="roomInput"
    type="text"
    placeholder="ROOM NAME"
    autocomplete="off"
  >

  <div class="startButtons">

    <button
      id="inputButton"
      type="button"
      onclick="enterInputMode()"
    >
      INPUT
    </button>

    <button
      id="outputButton"
      type="button"
      onclick="enterOutputMode()"
    >
      OUTPUT
    </button>

  </div>

</div>


<!-- =====================================================
     INPUT
===================================================== -->

<div id="inputScreen" class="screen">

  <div class="inputTop">

    <div class="turnInfo">
      <div class="smallLabel">
        REMAINING TURNS
      </div>

      <div id="remainingTurns">
        10
      </div>
    </div>


    <div class="throwInfo">
      <div class="smallLabel">
        REMAINING THROWS
      </div>

      <div id="remainingThrows">
        3
      </div>
    </div>

  </div>


  <div id="dartboardArea">

    <svg
      id="dartboard"
      viewBox="0 0 300 300"
      preserveAspectRatio="xMidYMid meet"
    >

      <g id="boardLayer"></g>
      <g id="numberLayer"></g>
      <g id="hitLayer"></g>

    </svg>

  </div>


  <div class="inputControls">

    <button
      type="button"
      onclick="addPlayer()"
    >
      ADD PLAYER
    </button>

    <button
      type="button"
      onclick="resetGame()"
    >
      RESET
    </button>

    <button
      type="button"
      onclick="deleteCurrentPlayer()"
    >
      DELETE PLAYER
    </button>

  </div>


  <div id="inputPlayers"></div>

</div>


<!-- =====================================================
     OUTPUT
===================================================== -->

<div id="outputScreen" class="screen">

  <div id="outputHeader">

    <div id="outputTitle">
      COUNT UP
    </div>

    <div id="outputCurrentPlayer">
      PLAYER 1
    </div>

  </div>


  <div id="scoreEffect"></div>


  <div id="outputPlayers"></div>


  <div id="historyArea">

    <div class="historyTitle">
      HISTORY
    </div>

    <div id="history"></div>

  </div>


  <div id="audioSettings">

    <div class="audioTitle">
      SOUND SETTINGS
    </div>

    <label>
      NORMAL
      <input
        id="normalSound"
        type="file"
        accept="audio/*"
      >
    </label>

    <label>
      BULL
      <input
        id="bullSound"
        type="file"
        accept="audio/*"
      >
    </label>

    <label>
      TRIPLE
      <input
        id="tripleSound"
        type="file"
        accept="audio/*"
      >
    </label>

    <label>
      DOUBLE
      <input
        id="doubleSound"
        type="file"
        accept="audio/*"
      >
    </label>

    <label>
      PLAYER CHANGE
      <input
        id="playerChangeSound"
        type="file"
        accept="audio/*"
      >
    </label>

  </div>

</div>


<!-- =====================================================
     BUTTON / BOARD PROGRAM
     Firebaseとは独立
===================================================== -->

<script>

/* =====================================================
   グローバル
===================================================== */

window.roomName = "";
window.selectedRole = "";

let boardBuilt = false;


/* =====================================================
   INPUT / OUTPUT BUTTON
   最優先で動作する部分
===================================================== */

window.enterInputMode = function(){

  const input =
    document.getElementById("roomInput");

  const room =
    input.value.trim();

  if(room === ""){

    alert("ROOM NAMEを入力してください");

    input.focus();

    return;
  }


  window.roomName = room;
  window.selectedRole = "input";


  const start =
    document.getElementById("startScreen");

  const inputScreen =
    document.getElementById("inputScreen");

  const outputScreen =
    document.getElementById("outputScreen");


  start.style.display = "none";

  outputScreen.classList.remove("active");

  inputScreen.classList.add("active");


  /*
   * Firebaseとは無関係に
   * ボードを即座に作る
   */

  try{

    buildDartboard();

  }catch(error){

    console.error(error);

  }


  /*
   * Firebaseがロード済みなら接続
   */

  if(
    typeof window.initializeInput ===
    "function"
  ){

    window.initializeInput();

  }

};


window.enterOutputMode = function(){

  const input =
    document.getElementById("roomInput");

  const room =
    input.value.trim();

  if(room === ""){

    alert("ROOM NAMEを入力してください");

    input.focus();

    return;
  }


  window.roomName = room;
  window.selectedRole = "output";


  const start =
    document.getElementById("startScreen");

  const inputScreen =
    document.getElementById("inputScreen");

  const outputScreen =
    document.getElementById("outputScreen");


  start.style.display = "none";

  inputScreen.classList.remove("active");

  outputScreen.classList.add("active");


  document.getElementById(
    "audioSettings"
  ).style.display = "block";


  if(
    typeof window.initializeOutput ===
    "function"
  ){

    window.initializeOutput();

  }

};


/* =====================================================
   DARTBOARD
===================================================== */

const boardNumbers = [

  20,1,18,4,13,
  6,10,15,2,17,
  3,19,7,16,8,
  11,14,9,12,5

];


function buildDartboard(){

  if(boardBuilt){
    return;
  }

  const svg =
    document.getElementById("dartboard");

  const boardLayer =
    document.getElementById("boardLayer");

  const numberLayer =
    document.getElementById("numberLayer");

  if(
    !svg ||
    !boardLayer ||
    !numberLayer
  ){

    return;

  }


  boardBuilt = true;


  const NS =
    "http://www.w3.org/2000/svg";

  const cx = 150;
  const cy = 150;


  function point(radius,angle){

    const rad =
      (angle - 90) *
      Math.PI /
      180;

    return {

      x:
        cx +
        radius *
        Math.cos(rad),

      y:
        cy +
        radius *
        Math.sin(rad)

    };

  }


  function sectorPath(
    r1,
    r2,
    a1,
    a2
  ){

    const p1 =
      point(r1,a1);

    const p2 =
      point(r2,a1);

    const p3 =
      point(r2,a2);

    const p4 =
      point(r1,a2);


    return `
      M ${p1.x} ${p1.y}
      L ${p2.x} ${p2.y}
      A ${r2} ${r2} 0 0 1
        ${p3.x} ${p3.y}
      L ${p4.x} ${p4.y}
      A ${r1} ${r1} 0 0 0
        ${p1.x} ${p1.y}
      Z
    `;

  }


  /* 外周 */

  const outer =
    document.createElementNS(
      NS,
      "circle"
    );

  outer.setAttribute(
    "cx",
    cx
  );

  outer.setAttribute(
    "cy",
    cy
  );

  outer.setAttribute(
    "r",
    "129"
  );

  outer.setAttribute(
    "fill",
    "#111"
  );

  boardLayer.appendChild(
    outer
  );


  /* セグメント */

  for(
    let i=0;
    i<20;
    i++
  ){

    const start =
      i * 18 - 9;

    const end =
      start + 18;


    const dark =
      i % 2 === 0;


    /*
     * シングル
     */

    const single =
      document.createElementNS(
        NS,
        "path"
      );

    single.setAttribute(
      "d",
      sectorPath(
        20,
        116,
        start,
        end
      )
    );

    single.setAttribute(
      "fill",
      dark
        ? "#080808"
        : "#e6e6e6"
    );

    boardLayer.appendChild(
      single
    );


    /*
     * トリプル
     */

    const triple =
      document.createElementNS(
        NS,
        "path"
      );

    triple.setAttribute(
      "d",
      sectorPath(
        68,
        79,
        start,
        end
      )
    );

    triple.setAttribute(
      "fill",
      dark
        ? "#671919"
        : "#174c37"
    );

    boardLayer.appendChild(
      triple
    );


    /*
     * ダブル
     */

    const double =
      document.createElementNS(
        NS,
        "path"
      );

    double.setAttribute(
      "d",
      sectorPath(
        116,
        129,
        start,
        end
      )
    );

    double.setAttribute(
      "fill",
      dark
        ? "#671919"
        : "#174c37"
    );

    boardLayer.appendChild(
      double
    );


    /*
     * 数字
     */

    const mid =
      (start + end) / 2;

    const p =
      point(
        144,
        mid
      );


    const text =
      document.createElementNS(
        NS,
        "text"
      );

    text.setAttribute(
      "x",
      p.x
    );

    text.setAttribute(
      "y",
      p.y
    );

    text.setAttribute(
      "fill",
      "#fff"
    );

    text.setAttribute(
      "font-size",
      "17"
    );

    text.setAttribute(
      "font-weight",
      "900"
    );

    text.setAttribute(
      "text-anchor",
      "middle"
    );

    text.setAttribute(
      "dominant-baseline",
      "middle"
    );

    text.textContent =
      boardNumbers[i];

    numberLayer.appendChild(
      text
    );

  }


  /*
   * OUTER BULL
   */

  const outerBull =
    document.createElementNS(
      NS,
      "circle"
    );

  outerBull.setAttribute(
    "cx",
    cx
  );

  outerBull.setAttribute(
    "cy",
    cy
  );

  outerBull.setAttribute(
    "r",
    "20"
  );

  outerBull.setAttribute(
    "fill",
    "#174c37"
  );

  boardLayer.appendChild(
    outerBull
  );


  /*
   * BULL
   */

  const bull =
    document.createElementNS(
      NS,
      "circle"
    );

  bull.setAttribute(
    "cx",
    cx
  );

  bull.setAttribute(
    "cy",
    cy
  );

  bull.setAttribute(
    "r",
    "10"
  );

  bull.setAttribute(
    "fill",
    "#671919"
  );

  boardLayer.appendChild(
    bull
  );


  /*
   * タップ判定
   */

  svg.addEventListener(
    "pointerdown",
    handleBoardHit,
    {
      passive:false
    }
  );

}


/* =====================================================
   BOARD HIT
===================================================== */

function handleBoardHit(event){

  event.preventDefault();


  const svg =
    document.getElementById(
      "dartboard"
    );


  const rect =
    svg.getBoundingClientRect();


  /*
   * CSS表示サイズから
   * SVG viewBox座標へ正確に変換
   */

  const scaleX =
    300 / rect.width;

  const scaleY =
    300 / rect.height;


  const x =
    (event.clientX - rect.left)
    * scaleX;

  const y =
    (event.clientY - rect.top)
    * scaleY;


  const dx =
    x - 150;

  const dy =
    y - 150;


  const radius =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  let score = 0;
  let label = "MISS";
  let type = "miss";


  /*
   * BULL
   */

  if(radius <= 10){

    score = 50;
    label = "BULL";
    type = "bull";

  }


  /*
   * OUTER BULL
   */

  else if(radius <= 20){

    score = 25;
    label = "25";
    type = "outerBull";

  }


  /*
   * BOARD
   */

  else if(radius <= 129){

    /*
     * 12時方向を0度として
     * 時計回り
     */

    let angle =
      Math.atan2(
        dx,
        -dy
      )
      * 180 /
      Math.PI;


    if(angle < 0){
      angle += 360;
    }


    const index =
      Math.floor(
        (angle + 9) / 18
      ) % 20;


    const number =
      boardNumbers[index];


    /*
     * DOUBLE
     */

    if(radius >= 116){

      score =
        number * 2;

      label =
        "D" + number;

      type =
        "double";

    }


    /*
     * TRIPLE
     */

    else if(
      radius >= 68 &&
      radius <= 79
    ){

      score =
        number * 3;

      label =
        "T" + number;

      type =
        "triple";

    }


    /*
     * SINGLE
     */

    else{

      score =
        number;

      label =
        String(number);

      type =
        "single";

    }

  }


  /*
   * ヒット位置表示
   */

  showHitMarker(
    x,
    y,
    type
  );


  /*
   * Firebase
   */

  if(
    typeof window.firebaseAddScore ===
    "function"
  ){

    window.firebaseAddScore(
      score,
      label,
      type
    );

  }

}


/* =====================================================
   HIT MARKER
===================================================== */

function showHitMarker(
  x,
  y,
  type
){

  const layer =
    document.getElementById(
      "hitLayer"
    );

  if(!layer){
    return;
  }


  /*
   * プレイヤー変更まで
   * マーカーを残す
   */

  const NS =
    "http://www.w3.org/2000/svg";


  const group =
    document.createElementNS(
      NS,
      "g"
    );


  const circle =
    document.createElementNS(
      NS,
      "circle"
    );

  circle.setAttribute(
    "cx",
    x
  );

  circle.setAttribute(
    "cy",
    y
  );

  circle.setAttribute(
    "r",
    "6"
  );

  circle.setAttribute(
    "fill",
    "none"
  );

  circle.setAttribute(
    "stroke",
    "#fff"
  );

  circle.setAttribute(
    "stroke-width",
    "2"
  );


  group.appendChild(
    circle
  );

  layer.appendChild(
    group
  );

}

/* =====================================================
   AUDIO
===================================================== */

const audioURLs = {};


function setupAudio(){

  const files = {

    normalSound:
      "normal",

    bullSound:
      "bull",

    tripleSound:
      "triple",

    doubleSound:
      "double",

    playerChangeSound:
      "playerChange"

  };


  Object.keys(files)
    .forEach(id => {

      const input =
        document.getElementById(id);

      if(!input){
        return;
      }


      input.addEventListener(
        "change",
        function(){

          const file =
            this.files[0];

          if(!file){
            return;
          }


          if(audioURLs[files[id]]){

            URL.revokeObjectURL(
              audioURLs[files[id]]
            );

          }


          audioURLs[files[id]] =
            URL.createObjectURL(
              file
            );

        }
      );

    });

}


setupAudio();


window.playSound =
function(type){

  const url =
    audioURLs[type];

  if(!url){
    return;
  }


  try{

    const audio =
      new Audio(url);

    audio.volume = 1;

    audio.play().catch(
      () => {}
    );

  }catch(error){

    console.error(error);

  }

};

/* =====================================================

/* =====================================================

===================================================== */

window.initializeInput =

  inputListenerStarted = true;

       */

      }


      updateAllUI(data);

    }
  );

};

   OUTPUT初期化
===================================================== */

window.initializeOutput =
function(){

/* =====================================================
   ROOM作成
===================================================== */

function createNewRoom(){

  const room =
    window.roomName;

  if(!room){
    return;
  }


  const roomData = {

    gameType:
      "countup",

    maxTurns:
      10,

    currentTurn:
      1,

    players:{

      p1:{

        name:
          "PLAYER 1",

        score:
          0,

        turnScore:
          0,

        order:
          0

      }

    },

    history:[],

    state:{

      currentPlayerId:
        "p1",

      throwNumber:
        0,

      lastScore:
        null,

      lastLabel:
        "",

      lastType:
        "",

      effectId:
        0,

      changeId:
        0,

      finished:
        false

    }

  };


  set(
    ref(
      db,
      "rooms/" + room
    ),
    roomData
  );

}


/* =====================================================
   SCORE
===================================================== */

window.firebaseAddScore =
function(
  score,
  label,
  type
){

  const room =
    window.roomName;

  if(!room){
    return;
  }


  const roomRef =
    ref(
      db,
      "rooms/" + room
    );


  onValue(
    roomRef,
    snapshot => {

      const data =
        snapshot.val();

      if(!data){
        return;
      }


      processScore(
        data,
        score,
        label,
        type
      );

    },
    {
      onlyOnce:true
    }
  );

};


function processScore(
  data,
  score,
  label,
  type
){

  const players =
    data.players || {};


  const state =
    data.state || {};


  const ids =
    Object.keys(players);


  if(ids.length === 0){
    return;
  }


  let currentId =
    state.currentPlayerId;


  if(
    !currentId ||
    !players[currentId]
  ){

    currentId =
      ids[0];

  }


  const player =
    players[currentId];


  const oldScore =
    Number(player.score || 0);


  const oldTurnScore =
    Number(player.turnScore || 0);


  const newScore =
    oldScore + score;


  const newTurnScore =
    oldTurnScore + score;


  const throwNumber =
    Number(state.throwNumber || 0) + 1;


  const history =
    Array.isArray(data.history)
      ? data.history.slice()
      : [];


  history.push({

    player:
      player.name,

    score:
      score,

    label:
      label,

    type:
      type,

    turn:
      Number(data.currentTurn || 1),

    throwNumber:
      throwNumber,

    time:
      Date.now()

  });


  while(history.length > 100){
    history.shift();
  }


  const effectId =
    Date.now();


  const updates = {};


  updates[
    "rooms/" +
    window.roomName +
    "/players/" +
    currentId +
    "/score"
  ] =
    newScore;


  updates[
    "rooms/" +
    window.roomName +
    "/players/" +
    currentId +
    "/turnScore"
  ] =
    newTurnScore;


  updates[
    "rooms/" +
    window.roomName +
    "/history"
  ] =
    history;


  updates[
    "rooms/" +
    window.roomName +
    "/state/throwNumber"
  ] =
    throwNumber;


  updates[
    "rooms/" +
    window.roomName +
    "/state/lastScore"
  ] =
    score;


  updates[
    "rooms/" +
    window.roomName +
    "/state/lastLabel"
  ] =
    label;


  updates[
    "rooms/" +
    window.roomName +
    "/state/lastType"
  ] =
    type;


  updates[
    "rooms/" +
    window.roomName +
    "/state/effectId"
  ] =
    effectId;


  /*
   * 3投目
   */

  if(throwNumber >= 3){

    const currentIndex =
      ids.indexOf(
        currentId
      );


    const nextIndex =
      (currentIndex + 1) %
      ids.length;


    const nextId =
      ids[nextIndex];


    /*
     * 全員を一周したら
     * ターンを1増やす
     */

    let nextTurn =
      Number(
        data.currentTurn || 1
      );


    if(nextIndex === 0){

      nextTurn++;

    }


    const maxTurns =
      Number(
        data.maxTurns || 10
      );


    /*
     * ゲーム終了
     */

    if(
      nextIndex === 0 &&
      nextTurn > maxTurns
    ){

      updates[
        "rooms/" +
        window.roomName +
        "/state/finished"
      ] =
        true;

    }else{

      /*
       * 次プレイヤー
       */

      updates[
        "rooms/" +
        window.roomName +
        "/state/currentPlayerId"
      ] =
        nextId;


      /*
       * 次プレイヤーの
       * ターン得点を0にする
       */

      updates[
        "rooms/" +
        window.roomName +
        "/players/" +
        nextId +
        "/turnScore"
      ] =
        0;


      updates[
        "rooms/" +
        window.roomName +
        "/state/throwNumber"
      ] =
        0;


      updates[
        "rooms/" +
        window.roomName +
        "/state/changeId"
      ] =
        Date.now();


      if(nextIndex === 0){

        updates[
          "rooms/" +
          window.roomName +
          "/currentTurn"
        ] =
          nextTurn;

      }

    }

  }


  update(
    ref(db),
    updates
  );

}


/* =====================================================
   ADD PLAYER
===================================================== */

window.firebaseAddPlayer =
function(){

  const room =
    window.roomName;

  if(!room){
    return;
  }


  const roomRef =
    ref(
      db,
      "rooms/" + room
    );


  onValue(
    roomRef,
    snapshot => {

      const data =
        snapshot.val();


      if(!data){
        return;
      }


      const players =
        data.players || {};


      const count =
        Object.keys(players).length;


      const id =
        "p" +
        Date.now();


      players[id] = {

        name:
          "PLAYER " +
          (count + 1),

        score:
          0,

        turnScore:
          0,

        order:
          count

      };


      update(
        roomRef,
        {
          players:
            players
        }
      );

    },
    {
      onlyOnce:true
    }
  );

};


/* =====================================================
   DELETE PLAYER
===================================================== */

window.firebaseDeleteCurrentPlayer =
function(){

  const room =
    window.roomName;

  if(!room){
    return;
  }


  const roomRef =
    ref(
      db,
      "rooms/" + room
    );


  onValue(
    roomRef,
    snapshot => {

      const data =
        snapshot.val();


      if(
        !data ||
        !data.players
      ){

        return;

      }


      const players =
        data.players;


      const state =
        data.state || {};


      const currentId =
        state.currentPlayerId;


      if(
        Object.keys(players).length <= 1
      ){

        return;

      }


      delete players[currentId];


      const ids =
        Object.keys(players);


      ids.forEach(
        (id,index) => {

          players[id].order =
            index;

        }
      );


      let newCurrent =
        ids[0];


      const oldIndex =
        ids.indexOf(currentId);


      if(oldIndex >= 0){

        newCurrent =
          ids[
            Math.min(
              oldIndex,
              ids.length - 1
            )
          ];

      }


      const updates = {};


      updates[
        "rooms/" +
        room +
        "/players"
      ] =
        players;


      updates[
        "rooms/" +
        room +
        "/state/currentPlayerId"
      ] =
        newCurrent;


      updates[
        "rooms/" +
        room +
        "/state/throwNumber"
      ] =
        0;


      updates[
        "rooms/" +
        room +
        "/state/changeId"
      ] =
        Date.now();


      update(
        ref(db),
        updates
      );

    },
    {
      onlyOnce:true
    }
  );

};


/* =====================================================
   RESET
===================================================== */

window.firebaseResetGame =
function(){

  const room =
    window.roomName;

  if(!room){
    return;
  }


  const roomRef =
    ref(
      db,
      "rooms/" + room
    );


  onValue(
    roomRef,
    snapshot => {

      const data =
        snapshot.val();


      if(
        !data ||
        !data.players
      ){

        return;

      }


      const players =
        data.players;


      Object.keys(players)
        .forEach(id => {

          players[id].score =
            0;

          players[id].turnScore =
            0;

        });


      const ids =
        Object.keys(players);


      const first =
        ids[0];


      update(
        roomRef,
        {

          players:
            players,

          history:
            [],

          currentTurn:
            1,

          state:{

            currentPlayerId:
              first,

            throwNumber:
              0,

            lastScore:
              null,

            lastLabel:
              "",

            lastType:
              "",

            effectId:
              Date.now(),

            changeId:
              Date.now(),

            finished:
              false

          }

        }
      );


      /*
       * INPUT側のヒットマーカーも消す
       */

      const hitLayer =
        document.getElementById(
          "hitLayer"
        );

      if(hitLayer){

        hitLayer.innerHTML =
          "";

      }

    },
    {
      onlyOnce:true
    }
  );

};


/* =====================================================
   UI UPDATE
===================================================== */

let lastEffectId = null;
let lastChangeId = null;


function updateAllUI(data){

  updateInputUI(data);

  updateOutputUI(data);

}


/* =====================================================
   INPUT UI
===================================================== */

function updateInputUI(data){

  const players =
    data.players || {};


  const state =
    data.state || {};


  const currentId =
    state.currentPlayerId;


  const currentTurn =
    Number(
      data.currentTurn || 1
    );


  const maxTurns =
    Number(
      data.maxTurns || 10
    );


  document.getElementById(
    "remainingTurns"
  ).textContent =
    Math.max(
      0,
      maxTurns -
      currentTurn +
      1
    );


  document.getElementById(
    "remainingThrows"
  ).textContent =
    Math.max(
      0,
      3 -
      Number(
        state.throwNumber || 0
      )
    );


  const list =
    document.getElementById(
      "inputPlayers"
    );


  list.innerHTML =
    "";


  Object.keys(players)
    .sort(
      (a,b) =>
        Number(
          players[a].order || 0
        ) -
        Number(
          players[b].order || 0
        )
    )
    .forEach(id => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "inputPlayer";


      div.textContent =
        players[id].name +
        "  " +
        Number(
          players[id].score || 0
        );


      if(id === currentId){

        div.style.borderColor =
          "#d2b300";

      }


      list.appendChild(
        div
      );

    });

}


/* =====================================================
   OUTPUT UI
===================================================== */

function updateOutputUI(data){

  const players =
    data.players || {};


  const state =
    data.state || {};


  const currentId =
    state.currentPlayerId;


  const list =
    document.getElementById(
      "outputPlayers"
    );


  /*
   * 得点順
   */

  const ids =
    Object.keys(players)
      .sort(
        (a,b) =>
          Number(
            players[b].score || 0
          ) -
          Number(
            players[a].score || 0
          )
      );


  list.classList.toggle(
    "fourOrMore",
    ids.length >= 4
  );


  list.innerHTML =
    "";


  ids.forEach(
    (id,index) => {

      const player =
        players[id];


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "outputPlayer";


      if(id === currentId){

        row.classList.add(
          "current"
        );

      }


      /*
       * 名前
       */

      const name =
        document.createElement(
          "div"
        );


      name.className =
        "playerName";


      name.textContent =
        player.name;


      /*
       * 1位
       */

      if(index === 0){

        const top =
          document.createElement(
            "span"
          );


        top.className =
          "topPrayer";


        top.textContent =
          "TOP Prayer";


        name.appendChild(
          top
        );

      }


      /*
       * 当該ターン得点
       */

      const turnScore =
        document.createElement(
          "div"
        );


      turnScore.className =
        "turnScore";


      turnScore.textContent =
        "+" +
        Number(
          player.turnScore || 0
        );


      /*
       * 総得点
       */

      const score =
        document.createElement(
          "div"
        );


      score.className =
        "playerScore";


      score.textContent =
        Number(
          player.score || 0
        );


      row.appendChild(
        name
      );

      row.appendChild(
        turnScore
      );

      row.appendChild(
        score
      );


      list.appendChild(
        row
      );

    }
  );


  /*
   * 現在プレイヤー
   */

  const currentPlayer =
    players[currentId];


  document.getElementById(
    "outputCurrentPlayer"
  ).textContent =
    currentPlayer
      ? currentPlayer.name
      : "";


  /*
   * 履歴
   */

  updateHistory(
    data.history || []
  );


  /*
   * 得点演出
   */

  const effectId =
    state.effectId;


  if(
    effectId &&
    effectId !== lastEffectId
  ){

    lastEffectId =
      effectId;


    showScoreEffect(
      Number(
        state.lastScore || 0
      ),
      state.lastLabel || "",
      state.lastType || ""
    );

  }


  /*
   * プレイヤー変更
   */

  const changeId =
    state.changeId;


  if(
    changeId &&
    changeId !== lastChangeId
  ){

    lastChangeId =
      changeId;


    /*
     * 3投目の得点演出が終わってから
     * PLAYER CHANGE
     */

    setTimeout(
      () => {

        showPlayerChange();

      },
      1000
    );

  }

}


/* =====================================================
   HISTORY
===================================================== */

function updateHistory(
  history
){

  const area =
    document.getElementById(
      "history"
    );


  area.innerHTML =
    "";


  history
    .slice()
    .reverse()
    .slice(0,20)
    .forEach(item => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "historyItem";


      const name =
        document.createElement(
          "span"
        );


      name.textContent =
        item.player;


      const score =
        document.createElement(
          "span"
        );


      score.textContent =
        item.label +
        "  +" +
        item.score;


      row.appendChild(
        name
      );

      row.appendChild(
        score
      );


      area.appendChild(
        row
      );

    });

}


/* =====================================================
   SCORE EFFECT
===================================================== */

function showScoreEffect(
  score,
  label,
  type
){

  const el =
    document.getElementById(
      "scoreEffect"
    );


  el.style.transition =
    "none";


  el.style.opacity =
    "1";


  el.style.transform =
    "translate(-50%,-50%) scale(.8)";


  el.textContent =
    label;


  if(type === "bull"){

    window.playSound("bull");

  }

  else if(
    type === "outerBull"
  ){

    window.playSound("bull");

  }

  else if(
    type === "triple"
  ){

    window.playSound("triple");

  }

  else if(
    type === "double"
  ){

    window.playSound("double");

  }

  else{

    window.playSound("normal");

  }


  requestAnimationFrame(
    () => {

      el.style.transition =
        "all .25s ease";

      el.style.transform =
        "translate(-50%,-50%) scale(1)";

    }
  );


  setTimeout(
    () => {

      el.style.transition =
        "opacity .6s ease";

      el.style.opacity =
        "0";

    },
    400
  );

}


/* =====================================================
   PLAYER CHANGE
===================================================== */

function showPlayerChange(){

  const el =
    document.getElementById(
      "scoreEffect"
    );


  el.style.transition =
    "none";


  el.style.fontSize =
    window.innerWidth < 700
      ? "42px"
      : "55px";


  el.textContent =
    "PLAYER CHANGE";


  el.style.opacity =
    "1";


  el.style.transform =
    "translate(-50%,-50%) scale(1)";


  window.playSound(
    "playerChange"
  );


  setTimeout(
    () => {

      el.style.transition =
        "opacity .5s ease";

      el.style.opacity =
        "0";

    },
    750
  );

}

</script>
