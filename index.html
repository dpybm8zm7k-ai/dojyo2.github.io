<style>

/* =====================================================

===================================================== */

html,

/* =====================================================

/* =====================================================

/* =====================================================

===================================================== */

#inputScreen{

}

.inputHeader{

  flex-shrink:0;

  justify-content:center;

}

.currentPlayer{

    clamp(21px,5vw,34px);

}

.headerButton{

  top:50%;

  transform:translateY(-50%);

  padding:9px 13px;

  border:1px solid #444;

  border-radius:9px;

  font-weight:700;
}

.headerButton:active{

}

#menuButton{
  left:12px;
}

#backButton{
  right:12px;
}


/* =====================================================
   INFORMATION
===================================================== */

.throwInfo{

  position:absolute;

  top:78px;

  z-index:40;

  pointer-events:none;
}

#turnInfo{
  left:15px;
}

#throwInfo{

  right:15px;

}

.infoLabel{

  color:#aaa;

  font-size:13px;

}

.infoNumber{

  line-height:.95;

  font-size:
    clamp(42px,11vw,80px);

  font-weight:1000;
}


/* =====================================================
   BOARD AREA
===================================================== */

.boardArea{

  position:relative;

  flex:1;

  min-height:0;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px 10px 10px;
}

#dartboard{

  width:
    min(94vw,calc(100vh - 110px));

  height:
    min(94vw,calc(100vh - 110px));

  max-width:900px;
  max-height:900px;

  touch-action:none;

  user-select:none;

  filter:
    drop-shadow(
      0 10px 25px
      rgba(0,0,0,.8)
    );
}


/* =====================================================
   SCORE EFFECT INPUT
===================================================== */

#scoreEffects{

  position:absolute;

  inset:0;

  pointer-events:none;

  overflow:hidden;
}

.scoreEffect{

  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    scale(.35);

  font-family:
    "Bodoni 72",
    "Times New Roman",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:
    clamp(55px,15vw,120px);

  font-weight:900;

  color:#fff;

  text-shadow:
    0 0 10px rgba(255,255,255,.8),
    0 0 25px rgba(255,255,255,.4);

  animation:
    scorePop .8s ease-out forwards;
}

@keyframes scorePop{

  0%{

    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.3);
  }

  18%{

    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1.2);
  }

  45%{

      scale(1);
  }

  100%{

  }
}


/* =====================================================

===================================================== */

<!-- =====================================================

<script>

"use strict";


/* =====================================================
   DOM
===================================================== */

const startScreen =
  document.getElementById("startScreen");

const inputScreen =
  document.getElementById("inputScreen");

const outputScreen =
  document.getElementById("outputScreen");

const roomInput =
  document.getElementById("roomName");

const inputButton =
  document.getElementById("inputModeButton");

const outputButton =
  document.getElementById("outputModeButton");

const currentPlayerElement =
  document.getElementById("currentPlayer");

const remainingTurnsElement =
  document.getElementById("remainingTurns");

const remainingThrowsElement =
  document.getElementById("remainingThrows");

const dartboard =
  document.getElementById("dartboard");

const boardSegments =
  document.getElementById("boardSegments");

const boardNumbers =
  document.getElementById("boardNumbers");

const hitMarkers =
  document.getElementById("hitMarkers");

const scoreEffects =
  document.getElementById("scoreEffects");

const outputEffects =
  document.getElementById("outputEffects");

const outputCurrentName =
  document.getElementById("outputCurrentName");

const outputCurrentScore =
  document.getElementById("outputCurrentScore");

const outputLastScore =
  document.getElementById("outputLastScore");

const outputPlayerList =
  document.getElementById("outputPlayerList");

const playerChange =
  document.getElementById("playerChange");


/* =====================================================
   GAME
===================================================== */

let mode="";

let roomName="";

let players=[

  {
    id:"p1",
    name:"PLAYER 1",
    score:0,
    turnScore:0
  }

];

let currentPlayerIndex=0;

let throwNumber=0;

let currentTurn=1;

let maxTurns=10;

let gameFinished=false;


/* =====================================================
   BOARD CONSTANTS
===================================================== */

const CX=110;
const CY=110;

const BULL_RADIUS=10;
const OUTER_BULL_RADIUS=20;

const TRIPLE_INNER=43;
const TRIPLE_OUTER=50;

const DOUBLE_INNER=94;
const DOUBLE_OUTER=106;


const NUMBERS=[

  20,1,18,4,13,
  6,10,15,2,17,
  3,19,7,16,8,
  11,14,9,12,5

];


/* =====================================================
   BOARD GEOMETRY
===================================================== */

function point(r,a){

  return{

    x:
      CX+
      r*Math.cos(a),

    y:
      CY+
      r*Math.sin(a)

  };

}


function arcPath(
  r1,
  r2,
  a1,
  a2
){

  const p1=point(r1,a1);
  const p2=point(r2,a1);
  const p3=point(r2,a2);
  const p4=point(r1,a2);

  const large=
    a2-a1>Math.PI
      ?1
      :0;

  return`

    M ${p1.x} ${p1.y}

    L ${p2.x} ${p2.y}

    A ${r2} ${r2}
      0 ${large} 1
      ${p3.x} ${p3.y}

    L ${p4.x} ${p4.y}

    A ${r1} ${r1}
      0 ${large} 0
      ${p1.x} ${p1.y}

    Z

  `;

}


/* =====================================================
   BUILD BOARD
===================================================== */

function buildDartboard(){

  boardSegments.innerHTML="";
  boardNumbers.innerHTML="";
  hitMarkers.innerHTML="";


  const start=
    -Math.PI/2-
    Math.PI/20;


  for(
    let i=0;
    i<20;
    i++
  ){

    const a1=
      start+
      i*Math.PI*2/20;

    const a2=
      start+
      (i+1)*Math.PI*2/20;


    /*
      SINGLE

      ダーツボードの正しい配色：
      黒 / 白
    */

    const single=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

    single.setAttribute(
      "d",
      arcPath(
        OUTER_BULL_RADIUS,
        DOUBLE_INNER,
        a1,
        a2
      )
    );

    /*
      20,18,13...側を白
      1,4,6...側を黒
    */

    single.setAttribute(
      "fill",
      i%2===0
        ? "#111111"
        : "#eeeeee"
    );

    /*
      枠線なし
    */

    single.setAttribute(
      "stroke",
      "none"
    );

    boardSegments.appendChild(
      single
    );


    /*
      TRIPLE

      渋い濃赤 / 渋い濃緑
    */

    const triple=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

    triple.setAttribute(
      "d",
      arcPath(
        TRIPLE_INNER,
        TRIPLE_OUTER,
        a1,
        a2
      )
    );

    triple.setAttribute(
      "fill",
      i%2===0
        ? "#651818"
        : "#174a32"
    );

    triple.setAttribute(
      "stroke",
      "none"
    );

    boardSegments.appendChild(
      triple
    );


    /*
      DOUBLE
    */

    const dbl=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

    dbl.setAttribute(
      "d",
      arcPath(
        DOUBLE_INNER,
        DOUBLE_OUTER,
        a1,
        a2
      )
    );

    dbl.setAttribute(
      "fill",
      i%2===0
        ? "#651818"
        : "#174a32"
    );

    dbl.setAttribute(
      "stroke",
      "none"
    );

    boardSegments.appendChild(
      dbl
    );

  }


  /*
    OUTER BULL
  */

  const outerBull=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );

  outerBull.setAttribute(
    "cx",
    CX
  );

  outerBull.setAttribute(
    "cy",
    CY
  );

  outerBull.setAttribute(
    "r",
    OUTER_BULL_RADIUS
  );

  outerBull.setAttribute(
    "fill",
    "#174a32"
  );

  outerBull.setAttribute(
    "stroke",
    "none"
  );

  boardSegments.appendChild(
    outerBull
  );


  /*
    BULL
  */

  const bull=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );

  bull.setAttribute(
    "cx",
    CX
  );

  bull.setAttribute(
    "cy",
    CY
  );

  bull.setAttribute(
    "r",
    BULL_RADIUS
  );

  bull.setAttribute(
    "fill",
    "#651818"
  );

  bull.setAttribute(
    "stroke",
    "none"
  );

  boardSegments.appendChild(
    bull
  );


  /*
    =================================================
    数字
    =================================================

    必ず最後に生成して、
    ボードの一番手前に配置する。
  */

  for(
    let i=0;
    i<20;
    i++
  ){

    const a1=
      start+
      i*Math.PI*2/20;

    const a2=
      start+
      (i+1)*Math.PI*2/20;

    const angle=
      (a1+a2)/2;

    const p=
      point(
        114,
        angle
      );


    const text=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "text"
      );


    text.setAttribute(
      "x",
      p.x
    );

    text.setAttribute(
      "y",
      p.y
    );

    text.setAttribute(
      "fill",
      "#fff"
    );

    text.setAttribute(
      "font-size",
      "9"
    );

    text.setAttribute(
      "font-family",
      "Arial, sans-serif"
    );

    text.setAttribute(
      "font-weight",
      "900"
    );

    text.setAttribute(
      "text-anchor",
      "middle"
    );

    text.setAttribute(
      "dominant-baseline",
      "middle"
    );

    /*
      数字をタップ判定よりも
      視覚的に最前面へ。
    */

    text.style.pointerEvents="none";

    text.textContent=
      NUMBERS[i];

    boardNumbers.appendChild(
      text
    );

  }

}

/* =====================================================
   BOARD TAP
===================================================== */

dartboard.addEventListener(
  "pointerdown",
  event=>{

    if(
      mode!=="input" ||
      gameFinished
    ){
      return;
    }


    const rect=
      dartboard.getBoundingClientRect();


    const x=
      (event.clientX-
       rect.left)*
      220/
      rect.width;


    const y=
      (event.clientY-
       rect.top)*
      220/
      rect.height;


    const dx=x-CX;
    const dy=y-CY;


    const radius=
      Math.sqrt(
        dx*dx+
        dy*dy
      );


    let angle=
      Math.atan2(
        dy,
        dx
      )+
      Math.PI/2;


    if(angle<0)
      angle+=Math.PI*2;


    const index=
      (
        Math.floor(
          angle/
          (Math.PI*2/20)
        )+
        20
      )%20;


    const number=
      NUMBERS[index];


    let score=0;

    let label="MISS";


    if(
      radius<=BULL_RADIUS
    ){

      score=50;

      label="BULL";

    }
    else if(
      radius<=OUTER_BULL_RADIUS
    ){

      score=25;

      label="OUTER BULL";

    }
    else if(
      radius>=TRIPLE_INNER &&
      radius<=TRIPLE_OUTER
    ){

      score=
        number*3;

      label=
        "TRIPLE "+number;

    }
    else if(
      radius>=DOUBLE_INNER &&
      radius<=DOUBLE_OUTER
    ){

      score=
        number*2;

      label=
        "DOUBLE "+number;

    }
    else if(
      radius<=DOUBLE_OUTER
    ){

      score=number;

      label=
        "SINGLE "+number;

    }


    addHitMarker(
      x,
      y
    );


    showInputScoreEffect(
      score
    );


    processThrow(
      score,
      label
    );

  }
);

function addHitMarker(

){

  const g=

  outer.setAttribute(

  );

  outer.setAttribute(

  );

  outer.setAttribute(
    "r",
    5
  );

  outer.classList.add(

  );


  const dot=

    );

  );

  dot.setAttribute(

    y
  );

  dot.setAttribute(
    "r",
    2
  );

  dot.classList.add(

  );

  );

  );

  );

/* =====================================================
   COUNT UP GAME
===================================================== */

function processThrow(
  score,
  label
){

  const player=
    players[
      currentPlayerIndex
    ];


  if(!player)
    return;


  /*
    カウントアップなので
    点数を加算
  */

  player.score+=score;

  player.turnScore+=score;


  throwNumber++;


  /*
    3投でターン終了
  */

  if(
    throwNumber>=3
  ){

    finishTurn();

  }


  updateAll();


  if(window.firebaseUpdateThrow){

    window.firebaseUpdateThrow({

      players,

      currentPlayerIndex,

      throwNumber,

      currentTurn,

      maxTurns,

      lastScore:score,

      lastLabel:label,

      gameFinished

    });

  }

}


/* =====================================================
   FINISH TURN
===================================================== */

function finishTurn(){

  /*
    最終ターン
  */

  if(
    currentTurn>=maxTurns &&
    currentPlayerIndex===
      players.length-1
  ){

    gameFinished=true;

    updateAll();

    return;

  }


  setTimeout(
    ()=>{

      /*
        現在のプレイヤーの
        ターン得点は表示したまま
        次のプレイヤーへ
      */

      currentPlayerIndex++;

      /*
        全員終了
      */

      if(
        currentPlayerIndex>=
        players.length
      ){

        currentPlayerIndex=0;

        currentTurn++;

      }


      /*
        ターン上限
      */

      if(
        currentTurn>maxTurns
      ){

        gameFinished=true;

        updateAll();

        return;

      }


      throwNumber=0;


      players[
        currentPlayerIndex
      ].turnScore=0;


      /*
        プレイヤー交代で
        着弾跡を消す
      */

      clearHitMarkers();


      updateAll();


      if(window.firebasePlayerChange){

        window.firebasePlayerChange({

          currentPlayerIndex,

          currentTurn,

          throwNumber

        });

      }

    },
    400
  );

}

   UPDATE
===================================================== */

function updateAll(){

  const player=
    players[
      currentPlayerIndex
    ];


  if(!player)
    return;


  currentPlayerElement.textContent=
    player.name;


  remainingThrowsElement.textContent=
    Math.max(
      0,
      3-throwNumber
    );


  remainingTurnsElement.textContent=
    Math.max(
      0,
      maxTurns-
      currentTurn+
      1
    );


  outputCurrentName.textContent=
    player.name;


  outputCurrentScore.textContent=
    player.score;


  renderOutputPlayers();

  renderPlayerMenu();

}

===================================================== */

window.applyFirebaseState=
  function(data){

    if(!data)
      return;


    if(
      Array.isArray(
        data.players
      )
    ){

      players=
        data.players;

    }


    if(
      typeof
      data.currentPlayerIndex===
      "number"
    ){

      currentPlayerIndex=
        data.currentPlayerIndex;

    }


    if(
      typeof
      data.throwNumber===
      "number"
    ){

      throwNumber=
        data.throwNumber;

    }


    if(
      typeof
      data.currentTurn===
      "number"
    ){

      currentTurn=
        data.currentTurn;

    }


    if(
      typeof
      data.maxTurns===
      "number"
    ){

      maxTurns=
        data.maxTurns;

      document
        .getElementById(
          "turnLimitInput"
        )
        .value=
          maxTurns;

    }


    if(
      data.lastScore!==undefined
    ){

      outputLastScore.textContent=
        data.lastLabel
          ?data.lastLabel+
           "  "+
           data.lastScore
          :"";

    }


    if(
      data.showScoreEffect
    ){

      showOutputScoreEffect(
        data.lastScore
      );

    }


    if(
      data.playerChanged
    ){

      showPlayerChange();

    }


    updateAll();

  };


buildDartboard();

updateAll();
