    justify-content: center;

    overflow: hidden;

    background: #000;

}

#dartboard {

    width: min(96vw, 96vh);

    display: block;

    touch-action: none;
}

.hitDisplay {

    position: absolute;

    left: 50%;

    text-align: center;

    pointer-events: none;

    opacity: 0;

    transition: opacity .15s;
}

.hitDisplay.show {

}

<script>

(function () {

    const inputButton =
        document.getElementById(
            "inputButton"
        );

    const outputButton =
        document.getElementById(
            "outputButton"
        );

    const roomInput =
        document.getElementById(
            "roomName"
        );

    const startScreen =
        document.getElementById(
            "startScreen"
        );

    const inputScreen =
        document.getElementById(
            "inputScreen"
        );

    const outputScreen =
        document.getElementById(
            "outputScreen"
        );

    const status =
        document.getElementById(
            "status"
        );


    /*
     * 画面切り替え
     */

    function start(mode) {

        const room =
            roomInput.value.trim();


        if (!room) {

            status.textContent =
                "ROOM NAMEを入力してください";

            roomInput.focus();

            return;

        }


        /*
         * 押したことを明確に表示
         */

        const button =
            mode === "input"
                ? inputButton
                : outputButton;


        button.classList.add(
            "pressed"
        );


        /*
         * すぐ画面を切り替える
         */

        setTimeout(
            function () {

                startScreen.style.display =
                    "none";


                if (
                    mode === "input"
                ) {

                    inputScreen.classList.add(
                        "active"
                    );

                    /*
                     * Firebaseとは無関係に
                     * ボードを生成
                     */

                    window.buildDartboard();


                } else {

                    outputScreen.classList.add(
                        "active"
                    );

                    document
                        .getElementById(
                            "outputRoom"
                        )
                        .textContent =
                        "ROOM: " + room;

                }


                /*
                 * Firebase接続開始
                 */

                window.startFirebase(
                    room,
                    mode
                );

            },
            100
        );

    }


    /*
     * INPUT
     */

    inputButton.addEventListener(
        "click",
        function () {

            start("input");

        }
    );


    /*
     * OUTPUT
     */

    outputButton.addEventListener(
        "click",
        function () {

            start("output");

        }
    );


    /*
     * iPhone / iPadでの
     * pointerdownでも視覚反応
     */

    inputButton.addEventListener(
        "pointerdown",
        function () {

            inputButton.classList.add(
                "pressed"
            );

        }
    );


    outputButton.addEventListener(
        "pointerdown",
        function () {

            outputButton.classList.add(
                "pressed"
            );

        }
    );


    /*
     * Enter
     */

    roomInput.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                inputButton.click();

            }

        }
    );

})();

</script>


<!-- =================================================

     Firebaseとは完全独立
================================================= -->

<script>

(function () {

    const numbers = [

        20, 1, 18, 4, 13,
        6, 10, 15, 2, 17,
        3, 19, 7, 16, 8,
        11, 14, 9, 12, 5

    ];


    function polar(
        radius,
        angle
    ) {

        const rad =
            angle * Math.PI / 180;

        return {

            x:
                radius *
                Math.cos(rad),

            y:
                radius *
                Math.sin(rad)

        };

    }


    function sector(
        inner,
        outer,
        start,
        end
    ) {

        const a =
            polar(inner, start);

        const b =
            polar(outer, start);

        const c =
            polar(outer, end);

        const d =
            polar(inner, end);


        return `
            M ${a.x} ${a.y}
            L ${b.x} ${b.y}
            A ${outer} ${outer}
              0 0 1
              ${c.x} ${c.y}
            L ${d.x} ${d.y}
            A ${inner} ${inner}
              0 0 0
              ${a.x} ${a.y}
            Z
        `;

    }


    function svg(
        tag,
        attributes
    ) {

        const element =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                tag
            );


        for (
            const key
            in attributes
        ) {

            element.setAttribute(
                key,
                attributes[key]
            );

        }


        return element;

    }


    /*
     * グローバルに公開
     */

    window.buildDartboard =
        function () {

            const board =
                document.getElementById(
                    "dartboard"
                );


            board.innerHTML = "";


            /*
             * 外側
             */

            board.appendChild(
                svg(
                    "circle",
                    {

                        cx: 0,

                        cy: 0,

                        r: 100,

                        fill: "#111",

                        stroke: "#555",

                        "stroke-width": 2

                    }
                )
            );


            /*
             * 20セグメント
             */

            for (
                let i = 0;
                i < 20;
                i++
            ) {

                const center =
                    -90 + i * 18;


                const inner =
                    svg(
                        "path",
                        {

                            d:
                                sector(
                                    16,
                                    43,
                                    center - 8.5,
                                    center + 8.5
                                ),

                            fill:
                                i % 2
                                    ? "#171717"
                                    : "#292929",

                            stroke: "#555",

                            "stroke-width": .6

                        }
                    );


                const triple =
                    svg(
                        "path",
                        {

                            d:
                                sector(
                                    43,
                                    50,
                                    center - 8.5,
                                    center + 8.5
                                ),

                            fill: "#777",

                            stroke: "#222",

                            "stroke-width": .7

                        }
                    );


                const outer =
                    svg(
                        "path",
                        {

                            d:
                                sector(
                                    50,
                                    94,
                                    center - 8.5,
                                    center + 8.5
                                ),

                            fill:
                                i % 2
                                    ? "#171717"
                                    : "#292929",

                            stroke: "#555",

                            "stroke-width": .6

                        }
                    );


                const double =
                    svg(
                        "path",
                        {

                            d:
                                sector(
                                    94,
                                    100,
                                    center - 8.5,
                                    center + 8.5
                                ),

                            fill: "#888",

                            stroke: "#222",

                            "stroke-width": .7

                        }
                    );


                board.appendChild(
                    inner
                );

                board.appendChild(
                    triple
                );

                board.appendChild(
                    outer
                );

                board.appendChild(
                    double
                );

            }


            /*
             * Bull
             */

            board.appendChild(
                svg(
                    "circle",
                    {

                        cx: 0,

                        cy: 0,

                        r: 16,

                        fill: "#666",

                        stroke: "#222"

                    }
                )
            );


            board.appendChild(
                svg(
                    "circle",
                    {

                        cx: 0,

                        cy: 0,

                        r: 7,

                        fill: "#aaa",

                        stroke: "#222"

                    }
                )
            );


            /*
             * 放射線
             */

            for (
                let i = 0;
                i < 20;
                i++
            ) {

                const angle =
                    (-90 + i * 18)
                    * Math.PI / 180;


                board.appendChild(
                    svg(
                        "line",
                        {

                            x1: 0,

                            y1: 0,

                            x2:
                                100 *
                                Math.cos(angle),

                            y2:
                                100 *
                                Math.sin(angle),

                            stroke: "#444",

                            "stroke-width": .5,

                            "pointer-events":
                                "none"

                        }
                    )
                );

            }


            /*
             * 数字
             */

            for (
                let i = 0;
                i < 20;
                i++
            ) {

                const angle =
                    (-90 + i * 18)
                    * Math.PI / 180;


                const text =
                    svg(
                        "text",
                        {

                            x:
                                106 *
                                Math.cos(angle),

                            y:
                                106 *
                                Math.sin(angle)
                                + 3,

                            "text-anchor":
                                "middle",

                            fill: "#fff",

                            "font-size": 8,

                            "font-weight":
                                "bold",

                            "pointer-events":
                                "none"

                        }
                    );


                text.textContent =
                    numbers[i];


                board.appendChild(
                    text
                );

            }

        };

})();

</script>

<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get,
    set,
    update,
    push,
    onValue
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCh1dS522TL9HjGEkH7tCHXFWfJ0F1Qfx0",

    authDomain:
        "darts-01.firebaseapp.com",

    databaseURL:
        "https://darts-01-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "darts-01",

    storageBucket:
        "darts-01.firebasestorage.app",

    messagingSenderId:
        "936099490830",

    appId:
        "1:936099490830:web:bc3b39184138acbd1aa05f",

    measurementId:
        "G-JTX22B0QZQ"

};


let db = null;

let currentRoom = "";

let currentMode = "";

let players = {};

let state = {};

let roomRef = null;


/*
 * Firebase初期化
 *
 * 失敗しても画面には影響させない
 */

try {

    const app =
        initializeApp(
            firebaseConfig
        );

    db =
        getDatabase(app);

} catch (error) {

    console.error(
        "Firebase error:",
        error
    );

}


/*
 * HTML側から呼び出す
 */

window.startFirebase =
    async function (
        room,
        mode
    ) {

        currentRoom =
            room;

        currentMode =
            mode;


        if (!db) {

            console.error(
                "Firebase unavailable"
            );

            return;

        }


        roomRef =
            ref(
                db,
                "rooms/" +
                room
            );


        try {

            const snapshot =
                await get(
                    roomRef
                );


            if (
                !snapshot.exists()
            ) {

                await createRoom();

            }


            listen();

        } catch (error) {

            console.error(
                "ROOM error:",
                error
            );

        }

    };


/*
 * 新規ROOM
 */

async function createRoom() {

    players = {

        p1: {

            name: "PLAYER 1",

            score: 501,

            order: 0

        },

        p2: {

            name: "PLAYER 2",

            score: 501,

            order: 1

        }

    };


    state = {

        currentPlayerId:
            "p1",

        throwNumber: 0,

        lastScore: null,

        lastLabel: "",

        finished: false

    };


    await set(
        roomRef,
        {

            gameType: 501,

            players,

            state

        }
    );

}


/*
 * リアルタイム監視
 */

function listen() {

    onValue(

        ref(
            db,
            "rooms/" +
            currentRoom +
            "/players"
        ),

        snapshot => {

            players =
                snapshot.val() || {};

            render();

        }

    );


    onValue(

        ref(
            db,
            "rooms/" +
            currentRoom +
            "/state"
        ),

        snapshot => {

            if (
                snapshot.exists()
            ) {

                state =
                    snapshot.val();

            }

            render();

        }

    );

}


/*
 * 描画
 */

function render() {

    if (
        currentMode ===
        "input"
    ) {

        const list =
            getPlayers();


        const current =
            list.find(
                p =>
                    p.id ===
                    state.currentPlayerId
            );


        if (current) {

            document
                .getElementById(
                    "currentPlayer"
                )
                .textContent =
                current.name;


            document
                .getElementById(
                    "throwNumber"
                )
                .textContent =
                `${Math.min(
                    (state.throwNumber || 0) + 1,
                    3
                )} / 3`;

        }


        renderMenu();

    }


    if (
        currentMode ===
        "output"
    ) {

        renderOutput();

    }

}


function getPlayers() {

    return Object.entries(
        players
    )

    .map(
        ([id, player]) => ({

            id,

            ...player

        })
    )

    .sort(
        (a, b) =>
            (a.order || 0) -
            (b.order || 0)
    );

}


/*
 * OUTPUT
 */

function renderOutput() {

    const list =
        getPlayers();


    const current =
        list.find(
            p =>
                p.id ===
                state.currentPlayerId
        );


    document
        .getElementById(
            "outputCurrent"
        )
        .textContent =
        current
            ? current.name
            : "-";


    document
        .getElementById(
            "outputLast"
        )
        .textContent =
        state.lastLabel
            ? `LAST: ${state.lastScore} / ${state.lastLabel}`
            : "-";


    const container =
        document
            .getElementById(
                "playerList"
            );


    container.innerHTML = "";


    list.forEach(
        player => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "player";


            if (
                player.id ===
                state.currentPlayerId
            ) {

                div.classList.add(
                    "current"
                );

            }


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "playerName";

            name.textContent =
                player.name;


            const score =
                document.createElement(
                    "div"
                );


            score.className =
                "playerScore";

            score.textContent =
                player.score;


            div.appendChild(
                name
            );

            div.appendChild(
                score
            );


            container.appendChild(
                div
            );

        }
    );

}


/*
 * INPUTメニュー
 */

function renderMenu() {

    const container =
        document.getElementById(
            "menuPlayers"
        );


    container.innerHTML = "";


    getPlayers()
        .forEach(
            player => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "menuPlayer";


                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "menuPlayerName";

                name.textContent =
                    player.name;


                const del =
                    document.createElement(
                        "button"
                    );


                del.className =
                    "deleteButton";

                del.textContent =
                    "×";


                del.addEventListener(
                    "click",
                    () =>
                        deletePlayer(
                            player.id
                        )
                );


                row.appendChild(
                    name
                );

                row.appendChild(
                    del
                );


                container.appendChild(
                    row
                );

            }
        );

}


/*
 * ボードタップ
 *
 * Firebaseが読み込めた場合のみ
 * 得点処理を追加する
 */

document
    .getElementById(
        "dartboard"
    )
    .addEventListener(
        "pointerdown",
        handleBoard
    );


async function handleBoard(
    event
) {

    event.preventDefault();


    if (
        !db ||
        !currentRoom
    ) {

        return;

    }


    if (
        state.finished
    ) {

        return;

    }


    const board =
        document.getElementById(
            "dartboard"
        );


    const rect =
        board.getBoundingClientRect();


    const x =
        (
            (event.clientX -
             rect.left) /
            rect.width
        ) * 220 - 110;


    const y =
        (
            (event.clientY -
             rect.top) /
            rect.height
        ) * 220 - 110;


    const radius =
        Math.sqrt(
            x*x + y*y
        );


    if (
        radius > 100
    ) {

        return;

    }


    if (
        radius <= 7
    ) {

        scoreThrow(
            50,
            "BULL"
        );

        return;

    }


    if (
        radius <= 16
    ) {

        scoreThrow(
            25,
            "OUTER BULL"
        );

        return;

    }


    let angle =
        Math.atan2(y, x)
        * 180 / Math.PI;


    angle += 90;


    if (
        angle < 0
    ) {

        angle += 360;

    }


    const index =
        Math.floor(
            (angle + 9) / 18
        ) % 20;


    const numbers = [

        20,1,18,4,13,
        6,10,15,2,17,
        3,19,7,16,8,
        11,14,9,12,5

    ];


    const number =
        numbers[index];


    let multiplier = 1;

    let type = "SINGLE";


    if (
        radius >= 43 &&
        radius < 50
    ) {

        multiplier = 3;

        type = "TRIPLE";

    }
    else if (
        radius >= 94
    ) {

        multiplier = 2;

        type = "DOUBLE";

    }


    scoreThrow(
        number * multiplier,
        type + " " + number
    );

}


async function scoreThrow(
    points,
    label
) {

    const list =
        getPlayers();


    const current =
        list.find(
            p =>
                p.id ===
                state.currentPlayerId
        );


    if (!current) {

        return;

    }


    const before =
        Number(
            current.score
        );


    const after =
        before - points;


    let bust = false;

    let win = false;


    if (
        after < 0 ||
        after === 1
    ) {

        bust = true;

    }


    if (
        after === 0
    ) {

        if (
            label.startsWith(
                "DOUBLE "
            ) ||
            label === "BULL"
        ) {

            win = true;

        } else {

            bust = true;

        }

    }


    const actual =
        bust
            ? before
            : after;


    const nextThrow =
        (state.throwNumber || 0)
        + 1;


    let nextPlayer =
        current.id;


    if (
        !win &&
        (
            bust ||
            nextThrow >= 3
        )
    ) {

        const index =
            list.findIndex(
                p =>
                    p.id ===
                    current.id
            );


        nextPlayer =
            list[
                (index + 1) %
                list.length
            ].id;

    }


    const newState = {

        currentPlayerId:
            win
                ? current.id
                : nextPlayer,

        throwNumber:
            win
                ? nextThrow
                : (
                    bust ||
                    nextThrow >= 3
                        ? 0
                        : nextThrow
                ),

        lastScore:
            points,

        lastLabel:
            label,

        finished:
            win

    };


    const throwId =
        push(
            ref(
                db,
                "rooms/" +
                currentRoom +
                "/throws"
            )
        ).key;


    const updates = {};


    updates[
        "players/" +
        current.id +
        "/score"
    ] = actual;


    updates[
        "state"
    ] = newState;


    updates[
        "throws/" +
        throwId
    ] = {

        playerId:
            current.id,

        playerName:
            current.name,

        before,

        score:
            points,

        after:
            actual,

        label,

        bust,

        win,

        timestamp:
            Date.now()

    };


    await update(
        roomRef,
        updates
    );


    showHit(
        bust
            ? 0
            : points,

        bust
            ? "BUST"
            : label
    );

}


/*
 * 得点表示
 */

let hitTimer = null;


function showHit(
    score,
    label
) {

    const display =
        document.getElementById(
            "hitDisplay"
        );


    document.getElementById(
        "hitScore"
    ).textContent =
        score;


    document.getElementById(
        "hitLabel"
    ).textContent =
        label;


    display.classList.add(
        "show"
    );


    clearTimeout(
        hitTimer
    );


    hitTimer =
        setTimeout(
            () => {

                display.classList.remove(
                    "show"
                );

            },
            700
        );

}

 */

document
    .getElementById(

                ),

                {

                    name,

                    score: 501,

                    order:

/*
 * プレイヤー削除
 */

async function deletePlayer(id) {

    const list =
        getPlayers();


    if (
        list.length <= 1
    ) {

        alert(
            "最低1人必要です"
        );

        return;

    }


    if (
        !confirm(
            players[id].name +
            "を削除しますか？"
        )
    ) {

        return;

    }


    const updates = {};


    updates[
        "players/" + id
    ] = null;


    if (
        state.currentPlayerId === id
    ) {

        const index =
            list.findIndex(
                p => p.id === id
            );


        const next =
            list[
                (index + 1) %
                list.length
            ];


        state.currentPlayerId =
            next.id;

        state.throwNumber =
            0;


        updates.state =
            state;

    }


    await update(
        roomRef,
        updates
    );

}


/*
 * リセット
 */

document
    .getElementById(
        "resetGame"
    )
    .addEventListener(
        "click",
        async () => {

            const list =
                getPlayers();


            if (!list.length) {

                return;

            }


            if (
                !confirm(
                    "スコアをリセットしますか？"
                )
            ) {

                return;

            }


            const updates = {};


            list.forEach(
                player => {

                    updates[
                        "players/" +
                        player.id +
                        "/score"
                    ] = 501;

                }
            );


            updates.state = {

                currentPlayerId:
                    list[0].id,

                throwNumber: 0,

                lastScore: null,

                lastLabel: "",

                finished: false

            };


            await update(
                roomRef,
                updates
            );

        }
    );


/*
 * 戻る
 */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        () => {

            location.reload();

        }
    );

</script>
