<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>DARTS SCORE SYSTEM</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input {
    font-family: inherit;
}

/* =========================================================
   START SCREEN
========================================================= */

#startScreen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at center, #202020 0%, #080808 65%);
    padding: 20px;
}

.logo {
    font-size: clamp(30px, 8vw, 60px);
    font-weight: 900;
    letter-spacing: 5px;
    margin-bottom: 35px;
}

.roomInput {
    width: min(500px, 90vw);
    padding: 18px;
    background: #151515;
    border: 2px solid #444;
    border-radius: 12px;
    color: white;
    text-align: center;
    font-size: 20px;
    outline: none;
    margin-bottom: 20px;
}

.roomInput:focus {
    border-color: white;
}

.modeButtons {
    display: flex;
    gap: 15px;
    width: min(500px, 90vw);
}

.modeButton {
    flex: 1;
    min-height: 90px;
    border: 2px solid #444;
    border-radius: 15px;
    background: #181818;
    color: white;
    font-size: clamp(18px, 5vw, 28px);
    font-weight: 800;
    cursor: pointer;
    transition:
        transform 0.08s,
        background 0.08s,
        border-color 0.08s;
}

.modeButton:active,
.modeButton.pressed {
    transform: scale(0.93);
    background: #555;
    border-color: white;
}

/* =========================================================
   COMMON
========================================================= */

.screen {
    display: none;
    width: 100%;
    height: 100%;
}

.screen.active {
    display: flex;
}

/* =========================================================
   INPUT SCREEN
========================================================= */

#inputScreen {
    position: relative;
    flex-direction: column;
    background: #050505;
}

.inputHeader {
    position: relative;
    width: 100%;
    height: 74px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid #252525;
    background: #0c0c0c;
    z-index: 20;
}

.currentPlayer {
    font-size: clamp(20px, 5vw, 34px);
    font-weight: 900;
    letter-spacing: 1px;
}

.headerButton {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    border: 1px solid #444;
    background: #151515;
    color: white;
    border-radius: 10px;
    padding: 9px 13px;
    font-size: 14px;
    cursor: pointer;
}

.headerButton:active {
    transform: translateY(-50%) scale(0.9);
    background: #444;
}

#menuButton {
    left: 12px;
}

#backButton {
    right: 12px;
}

/* =========================================================
   THROW INFO
========================================================= */

.throwInfo {
    position: absolute;
    top: 86px;
    z-index: 30;
    pointer-events: none;
}

#turnInfo {
    left: 15px;
    text-align: left;
}

#throwInfo {
    right: 15px;
    text-align: right;
}

.infoLabel {
    display: block;
    color: #aaa;
    font-size: clamp(12px, 3vw, 18px);
    font-weight: 700;
    letter-spacing: 1px;
}

.infoNumber {
    display: block;
    font-size: clamp(40px, 11vw, 82px);
    line-height: 0.95;
    font-weight: 900;
    text-shadow:
        0 0 12px rgba(255,255,255,0.15);
}

/* =========================================================
   BOARD AREA
========================================================= */

.boardArea {
    position: relative;
    flex: 1;
    min-height: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    padding:
        20px
        10px
        10px;
}

/*
  上下左右に少し余裕を残しつつ、
  可能な限り大きくする
*/
#dartboard {
    width: min(94vw, calc(100vh - 115px));
    height: min(94vw, calc(100vh - 115px));

    max-width: 900px;
    max-height: 900px;

    touch-action: none;
    user-select: none;

    filter:
        drop-shadow(0 10px 25px rgba(0,0,0,0.8));
}

/* SVG */

.boardSegment {
    cursor: pointer;
}

.boardSegment:active {
    filter: brightness(1.35);
}

/* =========================================================
   DART MARKERS
========================================================= */

#hitMarkers {
    pointer-events: none;
}

.hitMarker {
    animation: markerAppear 0.18s ease-out;
}

.hitMarkerOuter {
    fill: rgba(255,255,255,0.08);
    stroke: white;
    stroke-width: 2;
}

.hitMarkerDot {
    fill: white;
    stroke: #111;
    stroke-width: 2;
}

@keyframes markerAppear {
    from {
        opacity: 0;
        transform: scale(0.4);
        transform-origin: center;
    }

    to {
        opacity: 1;
        transform: scale(1);
        transform-origin: center;
    }
}

/* =========================================================
   SCORE EFFECT
========================================================= */

#scoreEffects {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.scoreEffect {
    position: absolute;
    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(0.5);

    font-size: clamp(48px, 14vw, 110px);
    font-weight: 1000;

    color: white;

    text-shadow:
        0 0 8px rgba(255,255,255,0.8),
        0 0 20px rgba(255,255,255,0.35);

    animation: scorePop 0.75s ease-out forwards;
}

.scoreEffect.bust {
    color: #ff5555;
}

.scoreEffect.bull {
    color: #ffd84d;
}

@keyframes scorePop {

    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(0.35);
    }

    18% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1.2);
    }

    45% {
        opacity: 1;
        transform:
            translate(-50%, -58%)
            scale(1);
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%, -95%)
            scale(0.9);
    }
}

/* =========================================================
   INPUT MENU
========================================================= */

#inputMenu {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.78);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
}

#inputMenu.active {
    display: flex;
}

.menuPanel {
    width: min(500px, 90vw);
    max-height: 90vh;
    overflow-y: auto;

    background: #151515;
    border: 1px solid #444;
    border-radius: 18px;
    padding: 24px;
}

.menuTitle {
    text-align: center;
    font-size: 25px;
    font-weight: 900;
    margin-bottom: 20px;
}

.menuSection {
    margin-bottom: 25px;
}

.menuSectionTitle {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 10px;
}

.menuAction {
    width: 100%;
    padding: 15px;
    margin-bottom: 8px;

    background: #242424;
    border: 1px solid #444;
    color: white;
    border-radius: 10px;

    font-size: 16px;
    font-weight: 700;
}

.menuAction:active {
    background: #555;
    transform: scale(0.97);
}

.playerRow {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
}

.playerRow span {
    flex: 1;
    padding: 12px;
    background: #202020;
    border-radius: 8px;
}

.playerDelete {
    width: 50px;
    background: #3a1515;
    color: white;
    border: 1px solid #713333;
    border-radius: 8px;
}

.closeMenu {
    width: 100%;
    padding: 14px;
    background: white;
    color: black;
    border: none;
    border-radius: 10px;
    font-weight: 900;
}

/* =========================================================
   OUTPUT SCREEN
========================================================= */

#outputScreen {
    flex-direction: column;
    background: #080808;
}

.outputHeader {
    height: 90px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    border-bottom: 1px solid #292929;
}

.outputTitle {
    font-size: clamp(20px, 5vw, 34px);
    font-weight: 900;
}

.outputCurrent {
    text-align: right;
}

.outputCurrentName {
    font-size: 18px;
    color: #aaa;
}

.outputCurrentScore {
    font-size: clamp(36px, 8vw, 65px);
    font-weight: 1000;
}

.outputLast {
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    border-bottom: 1px solid #222;
}

.outputLastLabel {
    color: #999;
    font-size: 14px;
}

.outputLastScore {
    font-size: 42px;
    font-weight: 900;
}

.playerList {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.outputPlayer {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 20px;
    margin-bottom: 10px;

    background: #151515;
    border: 1px solid #292929;
    border-radius: 14px;
}

.outputPlayer.current {
    border-color: white;
    background: #202020;
}

.outputPlayerName {
    font-size: 20px;
    font-weight: 800;
}

.outputPlayerScore {
    font-size: 34px;
    font-weight: 1000;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (orientation: landscape) {

    .inputHeader {
        height: 60px;
    }

    .throwInfo {
        top: 70px;
    }

    #dartboard {
        width: min(75vh, 75vw);
        height: min(75vh, 75vw);
    }
}

@media (max-width: 500px) {

    .modeButtons {
        flex-direction: column;
    }

    .modeButton {
        min-height: 75px;
    }
}
</style>
</head>

<body>

<!-- ======================================================
     START
====================================================== -->

<div id="startScreen">

    <div class="logo">
        DARTS
    </div>

    <input
        id="roomName"
        class="roomInput"
        type="text"
        placeholder="ROOM NAME"
        autocomplete="off"
    >

    <div class="modeButtons">

        <button
            id="inputModeButton"
            class="modeButton"
            type="button"
        >
            INPUT
        </button>

        <button
            id="outputModeButton"
            class="modeButton"
            type="button"
        >
            OUTPUT
        </button>

    </div>

</div>


<!-- ======================================================
     INPUT
====================================================== -->

<div id="inputScreen" class="screen">

    <div class="inputHeader">

        <button
            id="menuButton"
            class="headerButton"
            type="button"
        >
            MENU
        </button>

        <div
            id="currentPlayer"
            class="currentPlayer"
        >
            PLAYER 1
        </div>

        <button
            id="backButton"
            class="headerButton"
            type="button"
        >
            BACK
        </button>

    </div>


    <!-- 左上：残りターン -->
    <div
        id="turnInfo"
        class="throwInfo"
    >
        <span class="infoLabel">
            REMAINING TURNS
        </span>

        <span
            id="remainingTurns"
            class="infoNumber"
        >
            0
        </span>
    </div>


    <!-- 右上：残り投球 -->
    <div
        id="throwInfo"
        class="throwInfo"
    >
        <span class="infoLabel">
            REMAINING THROWS
        </span>

        <span
            id="remainingThrows"
            class="infoNumber"
        >
            3
        </span>
    </div>


    <div class="boardArea">

        <svg
            id="dartboard"
            viewBox="0 0 220 220"
            xmlns="http://www.w3.org/2000/svg"
        >

            <defs>

                <radialGradient
                    id="boardGradient"
                    cx="50%"
                    cy="50%"
                    r="50%"
                >
                    <stop
                        offset="0%"
                        stop-color="#151515"
                    />

                    <stop
                        offset="100%"
                        stop-color="#050505"
                    />
                </radialGradient>

                <filter id="boardShadow">

                    <feDropShadow
                        dx="0"
                        dy="3"
                        stdDeviation="4"
                        flood-opacity="0.8"
                    />

                </filter>

            </defs>

            <circle
                cx="110"
                cy="110"
                r="106"
                fill="url(#boardGradient)"
                stroke="#777"
                stroke-width="2"
            />

            <g id="boardSegments"></g>

            <g id="boardNumbers"></g>

            <g id="hitMarkers"></g>

        </svg>

        <div id="scoreEffects"></div>

    </div>

</div>


<!-- ======================================================
     INPUT MENU
====================================================== -->

<div id="inputMenu">

    <div class="menuPanel">

        <div class="menuTitle">
            GAME MENU
        </div>

        <div class="menuSection">

            <div class="menuSectionTitle">
                PLAYERS
            </div>

            <div id="playerMenuList"></div>

            <button
                id="addPlayerButton"
                class="menuAction"
                type="button"
            >
                ＋ PLAYER
            </button>

        </div>

        <div class="menuSection">

            <button
                id="resetButton"
                class="menuAction"
                type="button"
            >
                RESET GAME
            </button>

        </div>

        <button
            id="closeMenuButton"
            class="closeMenu"
            type="button"
        >
            CLOSE
        </button>

    </div>

</div>


<!-- ======================================================
     OUTPUT
====================================================== -->

<div id="outputScreen" class="screen">

    <div class="outputHeader">

        <div class="outputTitle">
            DARTS SCORE
        </div>

        <div class="outputCurrent">

            <div
                id="outputCurrentName"
                class="outputCurrentName"
            >
                PLAYER 1
            </div>

            <div
                id="outputCurrentScore"
                class="outputCurrentScore"
            >
                501
            </div>

        </div>

    </div>


    <div class="outputLast">

        <div class="outputLastLabel">
            LAST SCORE
        </div>

        <div
            id="outputLastScore"
            class="outputLastScore"
        >
            -
        </div>

    </div>


    <div
        id="outputPlayerList"
        class="playerList"
    ></div>

</div>


<!-- ======================================================
     NORMAL JS
     Firebaseとは独立して動作
====================================================== -->

<script>
(function () {

    "use strict";


    /* =====================================================
       DOM
    ===================================================== */

    const startScreen =
        document.getElementById("startScreen");

    const inputScreen =
        document.getElementById("inputScreen");

    const outputScreen =
        document.getElementById("outputScreen");

    const roomNameInput =
        document.getElementById("roomName");

    const inputButton =
        document.getElementById("inputModeButton");

    const outputButton =
        document.getElementById("outputModeButton");

    const currentPlayerElement =
        document.getElementById("currentPlayer");

    const remainingTurnsElement =
        document.getElementById("remainingTurns");

    const remainingThrowsElement =
        document.getElementById("remainingThrows");

    const dartboard =
        document.getElementById("dartboard");

    const boardSegments =
        document.getElementById("boardSegments");

    const boardNumbers =
        document.getElementById("boardNumbers");

    const hitMarkers =
        document.getElementById("hitMarkers");

    const scoreEffects =
        document.getElementById("scoreEffects");

    const inputMenu =
        document.getElementById("inputMenu");

    const playerMenuList =
        document.getElementById("playerMenuList");

    const outputCurrentName =
        document.getElementById("outputCurrentName");

    const outputCurrentScore =
        document.getElementById("outputCurrentScore");

    const outputLastScore =
        document.getElementById("outputLastScore");

    const outputPlayerList =
        document.getElementById("outputPlayerList");


    /* =====================================================
       GAME DATA
    ===================================================== */

    let roomName = "";

    let mode = "";

    let players = [];

    let currentPlayerIndex = 0;

    let throwNumber = 0;

    let gameFinished = false;

    let localHitMarkers = [];


    const NUMBERS = [
        20, 1, 18, 4, 13,
        6, 10, 15, 2, 17,
        3, 19, 7, 16, 8,
        11, 14, 9, 12, 5
    ];


    /* =====================================================
       BUTTON FEEDBACK
    ===================================================== */

    function buttonFeedback(button) {

        button.classList.add("pressed");

        setTimeout(function () {
            button.classList.remove("pressed");
        }, 180);

    }


    /* =====================================================
       START
    ===================================================== */

    function start(modeName) {

        roomName =
            roomNameInput.value.trim();

        if (!roomName) {

            roomNameInput.focus();

            roomNameInput.style.borderColor =
                "#ff5555";

            setTimeout(function () {
                roomNameInput.style.borderColor =
                    "#444";
            }, 500);

            return;
        }

        mode = modeName;

        startScreen.style.display = "none";

        if (mode === "input") {

            inputScreen.classList.add("active");

            outputScreen.classList.remove("active");

            buildDartboard();

            updateAll();

        } else {

            outputScreen.classList.add("active");

            inputScreen.classList.remove("active");

            updateAll();

        }

        if (window.startFirebaseSync) {
            window.startFirebaseSync(
                roomName,
                modeName
            );
        }

    }


    inputButton.addEventListener(
        "pointerdown",
        function () {
            buttonFeedback(inputButton);
        }
    );

    inputButton.addEventListener(
        "click",
        function () {
            start("input");
        }
    );


    outputButton.addEventListener(
        "pointerdown",
        function () {
            buttonFeedback(outputButton);
        }
    );

    outputButton.addEventListener(
        "click",
        function () {
            start("output");
        }
    );


    /* =====================================================
       DARTBOARD GEOMETRY
    ===================================================== */

    const CX = 110;
    const CY = 110;

    /*
      以前よりもブルを大きくする。

      通常：
      Bull 7
      Outer Bull 16

      今回：
      Bull 10
      Outer Bull 21

      さらにダブル/トリプルも幅を広くする。
    */

    const BULL_RADIUS = 10;

    const OUTER_BULL_RADIUS = 21;

    const TRIPLE_INNER = 43;

    const TRIPLE_OUTER = 53;

    const DOUBLE_INNER = 91;

    const DOUBLE_OUTER = 106;


    function polarPoint(
        radius,
        angle
    ) {

        return {

            x:
                CX +
                radius *
                Math.cos(angle),

            y:
                CY +
                radius *
                Math.sin(angle)

        };

    }


    function describeArc(
        r1,
        r2,
        a1,
        a2
    ) {

        const p1 =
            polarPoint(r1, a1);

        const p2 =
            polarPoint(r2, a1);

        const p3 =
            polarPoint(r2, a2);

        const p4 =
            polarPoint(r1, a2);

        const largeArc =
            a2 - a1 > Math.PI
                ? 1
                : 0;

        return [
            "M", p1.x, p1.y,
            "L", p2.x, p2.y,
            "A", r2, r2, 0, largeArc, 1,
            p3.x, p3.y,
            "L", p4.x, p4.y,
            "A", r1, r1, 0, largeArc, 0,
            p1.x, p1.y,
            "Z"
        ].join(" ");

    }


    /* =====================================================
       CREATE DARTBOARD
    ===================================================== */

    function buildDartboard() {

        boardSegments.innerHTML = "";

        boardNumbers.innerHTML = "";

        hitMarkers.innerHTML = "";

        /*
          20を上に配置
        */

        const startAngle =
            -Math.PI / 2 -
            Math.PI / 20;


        for (
            let i = 0;
            i < 20;
            i++
        ) {

            const number =
                NUMBERS[i];

            const a1 =
                startAngle +
                i *
                (Math.PI * 2 / 20);

            const a2 =
                startAngle +
                (i + 1) *
                (Math.PI * 2 / 20);


            /*
              通常のシングル部分
            */

            const singlePath =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );

            singlePath.setAttribute(
                "d",
                describeArc(
                    OUTER_BULL_RADIUS,
                    DOUBLE_INNER,
                    a1,
                    a2
                )
            );

            singlePath.setAttribute(
                "fill",
                i % 2 === 0
                    ? "#eeeeee"
                    : "#161616"
            );

            singlePath.setAttribute(
                "stroke",
                "#777"
            );

            singlePath.setAttribute(
                "stroke-width",
                "0.8"
            );

            singlePath.classList.add(
                "boardSegment"
            );

            boardSegments.appendChild(
                singlePath
            );


            /*
              トリプル
              幅を広めに設定
            */

            const triplePath =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );

            triplePath.setAttribute(
                "d",
                describeArc(
                    TRIPLE_INNER,
                    TRIPLE_OUTER,
                    a1,
                    a2
                )
            );

            triplePath.setAttribute(
                "fill",
                i % 2 === 0
                    ? "#7d1515"
                    : "#0c4f2d"
            );

            triplePath.setAttribute(
                "stroke",
                "#111"
            );

            triplePath.setAttribute(
                "stroke-width",
                "1"
            );

            triplePath.classList.add(
                "boardSegment"
            );

            boardSegments.appendChild(
                triplePath
            );


            /*
              ダブル
            */

            const doublePath =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );

            doublePath.setAttribute(
                "d",
                describeArc(
                    DOUBLE_INNER,
                    DOUBLE_OUTER,
                    a1,
                    a2
                )
            );

            doublePath.setAttribute(
                "fill",
                i % 2 === 0
                    ? "#7d1515"
                    : "#0c4f2d"
            );

            doublePath.setAttribute(
                "stroke",
                "#111"
            );

            doublePath.setAttribute(
                "stroke-width",
                "1"
            );

            doublePath.classList.add(
                "boardSegment"
            );

            boardSegments.appendChild(
                doublePath
            );


            /*
              数字
            */

            const middleAngle =
                (a1 + a2) / 2;

            const numberPoint =
                polarPoint(
                    115,
                    middleAngle
                );

            const text =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "text"
                );

            text.setAttribute(
                "x",
                numberPoint.x
            );

            text.setAttribute(
                "y",
                numberPoint.y
            );

            text.setAttribute(
                "fill",
                "white"
            );

            text.setAttribute(
                "font-size",
                "9"
            );

            text.setAttribute(
                "font-weight",
                "900"
            );

            text.setAttribute(
                "text-anchor",
                "middle"
            );

            text.setAttribute(
                "dominant-baseline",
                "middle"
            );

            text.textContent =
                number;

            boardNumbers.appendChild(
                text
            );

        }


        /*
          Bull

          大きくしたので中心付近を
          かなりタップしやすい
        */

        const outerBull =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"
            );

        outerBull.setAttribute(
            "cx",
            CX
        );

        outerBull.setAttribute(
            "cy",
            CY
        );

        outerBull.setAttribute(
            "r",
            OUTER_BULL_RADIUS
        );

        outerBull.setAttribute(
            "fill",
            "#11683b"
        );

        outerBull.setAttribute(
            "stroke",
            "#111"
        );

        outerBull.setAttribute(
            "stroke-width",
            "1"
        );

        boardSegments.appendChild(
            outerBull
        );


        const innerBull =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"
            );

        innerBull.setAttribute(
            "cx",
            CX
        );

        innerBull.setAttribute(
            "cy",
            CY
        );

        innerBull.setAttribute(
            "r",
            BULL_RADIUS
        );

        innerBull.setAttribute(
            "fill",
            "#a51d1d"
        );

        innerBull.setAttribute(
            "stroke",
            "#111"
        );

        innerBull.setAttribute(
            "stroke-width",
            "1"
        );

        boardSegments.appendChild(
            innerBull
        );

    }


    /*
      外部から呼び出せるようにする
    */

    window.buildDartboard =
        buildDartboard;


    /* =====================================================
       BOARD TAP
    ===================================================== */

    dartboard.addEventListener(
        "pointerdown",
        function (event) {

            if (
                mode !== "input" ||
                gameFinished
            ) {
                return;
            }

            const rect =
                dartboard.getBoundingClientRect();

            const svgX =
                (
                    event.clientX -
                    rect.left
                ) *
                220 /
                rect.width;

            const svgY =
                (
                    event.clientY -
                    rect.top
                ) *
                220 /
                rect.height;


            const dx =
                svgX - CX;

            const dy =
                svgY - CY;

            const radius =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            /*
              中心から見た角度
            */

            let angle =
                Math.atan2(
                    dy,
                    dx
                );

            /*
              上を0番目にする
            */

            angle += Math.PI / 2;

            if (angle < 0) {
                angle += Math.PI * 2;
            }


            /*
              20分割
            */

            const segmentWidth =
                Math.PI * 2 / 20;

            let index =
                Math.floor(
                    angle /
                    segmentWidth
                );

            /*
              実際には境界を少し
              タップしやすくする
            */

            index =
                (
                    index +
                    20
                ) %
                20;


            let number =
                NUMBERS[index];

            let multiplier = 1;

            let label =
                "SINGLE " + number;

            let score;


            /*
              Bull
            */

            if (
                radius <=
                BULL_RADIUS
            ) {

                score = 50;

                label = "BULL";

            }

            else if (
                radius <=
                OUTER_BULL_RADIUS
            ) {

                score = 25;

                label = "OUTER BULL";

            }

            /*
              トリプル
            */

            else if (
                radius >= TRIPLE_INNER &&
                radius <= TRIPLE_OUTER
            ) {

                multiplier = 3;

                score =
                    number * 3;

                label =
                    "TRIPLE " + number;

            }

            /*
              ダブル
            */

            else if (
                radius >= DOUBLE_INNER &&
                radius <= DOUBLE_OUTER
            ) {

                multiplier = 2;

                score =
                    number * 2;

                label =
                    "DOUBLE " + number;

            }

            /*
              外側
            */

            else if (
                radius <= DOUBLE_OUTER
            ) {

                score = number;

                label =
                    "SINGLE " + number;

            }

            /*
              ボード外
            */

            else {

                score = 0;

                label = "MISS";

            }


            /*
              着弾マーク
            */

            addHitMarker(
                svgX,
                svgY
            );


            /*
              得点エフェクト
            */

            showScoreEffect(
                score,
                label
            );


            /*
              ゲームへ反映
            */

            processThrow(
                score,
                label
            );

        }
    );


    /* =====================================================
       HIT MARKER
    ===================================================== */

    function addHitMarker(
        x,
        y
    ) {

        const group =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "g"
            );

        group.classList.add(
            "hitMarker"
        );


        const outer =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"
            );

        outer.setAttribute(
            "cx",
            x
        );

        outer.setAttribute(
            "cy",
            y
        );

        outer.setAttribute(
            "r",
            "5"
        );

        outer.classList.add(
            "hitMarkerOuter"
        );


        const dot =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"
            );

        dot.setAttribute(
            "cx",
            x
        );

        dot.setAttribute(
            "cy",
            y
        );

        dot.setAttribute(
            "r",
            "2"
        );

        dot.classList.add(
            "hitMarkerDot"
        );


        group.appendChild(
            outer
        );

        group.appendChild(
            dot
        );

        hitMarkers.appendChild(
            group
        );

        localHitMarkers.push(
            group
        );

    }


    /*
      プレイヤー交代時に消す
    */

    function clearHitMarkers() {

        hitMarkers.innerHTML = "";

        localHitMarkers = [];

    }


    /* =====================================================
       SCORE EFFECT
    ===================================================== */

    function showScoreEffect(
        score,
        label
    ) {

        const element =
            document.createElement(
                "div"
            );

        element.className =
            "scoreEffect";


        if (
            label === "BULL" ||
            label === "OUTER BULL"
        ) {

            element.classList.add(
                "bull"
            );

        }


        if (
            label === "BUST"
        ) {

            element.classList.add(
                "bust"
            );

        }


        if (label === "MISS") {

            element.textContent =
                "MISS";

        } else if (
            label === "BUST"
        ) {

            element.textContent =
                "BUST";

        } else {

            element.textContent =
                "+" + score;

        }


        scoreEffects.appendChild(
            element
        );


        setTimeout(
            function () {

                element.remove();

            },
            800
        );

    }


    /* =====================================================
       GAME
    ===================================================== */

    function processThrow(
        score,
        label
    ) {

        if (
            players.length === 0
        ) {

            players.push({
                id: "p1",
                name: "PLAYER 1",
                score: 501
            });

        }


        const player =
            players[
                currentPlayerIndex
            ];


        const before =
            player.score;

        const after =
            before - score;


        /*
          501 DOUBLE OUT
        */

        let bust = false;


        if (
            after < 0 ||
            after === 1
        ) {

            bust = true;

        }


        if (
            after === 0
        ) {

            const validFinish =
                label.startsWith(
                    "DOUBLE "
                ) ||
                label === "BULL";

            if (!validFinish) {

                bust = true;

            }

        }


        if (bust) {

            showScoreEffect(
                0,
                "BUST"
            );

        } else {

            player.score =
                after;

        }


        throwNumber++;


        /*
          3投終了
        */

        if (
            throwNumber >= 3 ||
            player.score === 0 ||
            bust
        ) {

            setTimeout(
                function () {

                    nextPlayer();

                },
                350
            );

        }


        updateAll();


        if (window.firebaseUpdateThrow) {

            window.firebaseUpdateThrow({
                players: players,
                currentPlayerIndex:
                    currentPlayerIndex,
                throwNumber:
                    throwNumber,
                lastScore:
                    bust
                        ? 0
                        : score,
                lastLabel:
                    bust
                        ? "BUST"
                        : label,
                finished:
                    gameFinished
            });

        }

    }


    /* =====================================================
       NEXT PLAYER
    ===================================================== */

    function nextPlayer() {

        if (
            players.length === 0
        ) {
            return;
        }


        currentPlayerIndex =
            (
                currentPlayerIndex +
                1
            ) %
            players.length;


        throwNumber = 0;


        /*
          プレイヤー交代時に
          着弾跡を消す
        */

        clearHitMarkers();


        updateAll();


        if (window.firebaseUpdateState) {

            window.firebaseUpdateState({
                currentPlayerIndex:
                    currentPlayerIndex,
                throwNumber:
                    0
            });

        }

    }


    /* =====================================================
       TURNS
    ===================================================== */

    function calculateRemainingTurns() {

        if (
            players.length === 0
        ) {
            return 0;
        }


        /*
          現在のプレイヤーを含めて
          残りのターン数を表示。

          まだ残っているプレイヤー数
          ＋ 次ラウンド以降を考慮。
        */

        let turns = 0;

        for (
            let i = currentPlayerIndex;
            i < players.length;
            i++
        ) {

            if (
                players[i].score > 0
            ) {
                turns++;
            }

        }


        return turns;

    }


    /* =====================================================
       UPDATE ALL
    ===================================================== */

    function updateAll() {

        if (
            players.length === 0
        ) {

            players.push({
                id: "p1",
                name: "PLAYER 1",
                score: 501
            });

        }


        const player =
            players[
                currentPlayerIndex
            ];


        if (!player) {
            return;
        }


        currentPlayerElement.textContent =
            player.name;


        remainingThrowsElement.textContent =
            Math.max(
                0,
                3 - throwNumber
            );


        remainingTurnsElement.textContent =
            calculateRemainingTurns();


        outputCurrentName.textContent =
            player.name;


        outputCurrentScore.textContent =
            player.score;


        renderPlayerMenus();

        renderOutputPlayers();

    }


    /* =====================================================
       PLAYER MENU
    ===================================================== */

    function renderPlayerMenus() {

        playerMenuList.innerHTML = "";


        players.forEach(
            function (
                player,
                index
            ) {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "playerRow";


                const name =
                    document.createElement(
                        "span"
                    );

                name.textContent =
                    player.name;


                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.className =
                    "playerDelete";

                deleteButton.type =
                    "button";

                deleteButton.textContent =
                    "×";


                deleteButton.addEventListener(
                    "click",
                    function () {

                        if (
                            players.length <= 1
                        ) {
                            return;
                        }


                        players.splice(
                            index,
                            1
                        );


                        if (
                            currentPlayerIndex >=
                            players.length
                        ) {

                            currentPlayerIndex =
                                0;

                        }


                        throwNumber = 0;

                        clearHitMarkers();

                        updateAll();


                        if (
                            window.firebaseReplacePlayers
                        ) {

                            window.firebaseReplacePlayers(
                                players,
                                currentPlayerIndex
                            );

                        }

                    }
                );


                row.appendChild(
                    name
                );

                row.appendChild(
                    deleteButton
                );

                playerMenuList.appendChild(
                    row
                );

            }
        );

    }


    /* =====================================================
       ADD PLAYER
    ===================================================== */

    document
        .getElementById("addPlayerButton")
        .addEventListener(
            "click",
            function () {

                const number =
                    players.length + 1;


                players.push({

                    id:
                        "p" +
                        Date.now(),

                    name:
                        "PLAYER " +
                        number,

                    score:
                        501

                });


                updateAll();


                if (
                    window.firebaseReplacePlayers
                ) {

                    window.firebaseReplacePlayers(
                        players,
                        currentPlayerIndex
                    );

                }

            }
        );


    /* =====================================================
       RESET
    ===================================================== */

    document
        .getElementById("resetButton")
        .addEventListener(
            "click",
            function () {

                players =
                    players.map(
                        function (player) {

                            return {

                                id:
                                    player.id,

                                name:
                                    player.name,

                                score:
                                    501

                            };

                        }
                    );


                currentPlayerIndex = 0;

                throwNumber = 0;

                gameFinished = false;


                clearHitMarkers();

                updateAll();


                if (
                    window.firebaseResetGame
                ) {

                    window.firebaseResetGame(
                        players
                    );

                }

            }
        );


    /* =====================================================
       MENU
    ===================================================== */

    document
        .getElementById("menuButton")
        .addEventListener(
            "click",
            function () {

                inputMenu.classList.add(
                    "active"
                );

            }
        );


    document
        .getElementById("closeMenuButton")
        .addEventListener(
            "click",
            function () {

                inputMenu.classList.remove(
                    "active"
                );

            }
        );


    document
        .getElementById("backButton")
        .addEventListener(
            "click",
            function () {

                location.reload();

            }
        );


    /* =====================================================
       OUTPUT RENDER
    ===================================================== */

    function renderOutputPlayers() {

        outputPlayerList.innerHTML = "";


        players.forEach(
            function (
                player,
                index
            ) {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "outputPlayer";


                if (
                    index ===
                    currentPlayerIndex
                ) {

                    row.classList.add(
                        "current"
                    );

                }


                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "outputPlayerName";

                name.textContent =
                    player.name;


                const score =
                    document.createElement(
                        "div"
                    );

                score.className =
                    "outputPlayerScore";

                score.textContent =
                    player.score;


                row.appendChild(
                    name
                );

                row.appendChild(
                    score
                );


                outputPlayerList.appendChild(
                    row
                );

            }
        );

    }


    /*
      初期プレイヤー
    */

    players = [
        {
            id: "p1",
            name: "PLAYER 1",
            score: 501
        }
    ];


    buildDartboard();

    updateAll();


    /*
      Firebase側から状態を受け取るための関数
    */

    window.applyFirebaseState =
        function (data) {

            if (!data) {
                return;
            }


            if (
                Array.isArray(
                    data.players
                )
            ) {

                players =
                    data.players;

            }


            if (
                typeof
                data.currentPlayerIndex
                === "number"
            ) {

                currentPlayerIndex =
                    data.currentPlayerIndex;

            }


            if (
                typeof
                data.throwNumber
                === "number"
            ) {

                throwNumber =
                    data.throwNumber;

            }


            if (
                data.lastScore !== undefined
            ) {

                outputLastScore.textContent =
                    data.lastLabel
                        ? data.lastLabel +
                          "  " +
                          data.lastScore
                        : data.lastScore;

            }


            updateAll();

        };


})();
</script>


<!-- ======================================================
     FIREBASE

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    set,
    update
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCh1dS522TL9HjGEkH7tCHXFWfJ0F1Qfx0",

    authDomain:
        "darts-01.firebaseapp.com",

    databaseURL:
        "https://darts-01-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "darts-01",

    storageBucket:
        "darts-01.firebasestorage.app",

    messagingSenderId:
        "936099490830",

    appId:
        "1:936099490830:web:bc3b39184138acbd1aa05f",

    measurementId:
        "G-JTX22B0QZQ"

};


const app =
    initializeApp(
        firebaseConfig
    );

const db =
    getDatabase(app);


let roomRef = null;


/* =========================================================
   START SYNC
========================================================= */

window.startFirebaseSync =
    function (
        roomName,
        mode
    ) {

        roomRef =
            ref(
                db,
                "rooms/" +
                roomName
            );


        /*
          初回INPUTなら
          ルームが無ければ作成
        */

        if (mode === "input") {

            onValue(
                roomRef,
                function (snapshot) {

                    const data =
                        snapshot.val();


                    if (!data) {

                        const initial = {

                            gameType:
                                501,

                            players: {

                                p1: {

                                    name:
                                        "PLAYER 1",

                                    score:
                                        501,

                                    order:
                                        0

                                }

                            },

                            state: {

                                currentPlayerId:
                                    "p1",

                                throwNumber:
                                    0,

                                lastScore:
                                    null,

                                lastLabel:
                                    "",

                                finished:
                                    false

                            }

                        };


                        set(
                            roomRef,
                            initial
                        );

                    }

                },
                {
                    onlyOnce:
                        true
                }
            );

        }


        /*
          OUTPUTは常時監視
        */

        onValue(
            roomRef,
            function (snapshot) {

                const data =
                    snapshot.val();


                if (!data) {
                    return;
                }


                const firebasePlayers =
                    [];


                if (
                    data.players
                ) {

                    Object.entries(
                        data.players
                    )
                    .sort(
                        function (a, b) {

                            return (
                                (a[1].order || 0) -
                                (b[1].order || 0)
                            );

                        }
                    )
                    .forEach(
                        function (
                            entry
                        ) {

                            firebasePlayers.push({

                                id:
                                    entry[0],

                                name:
                                    entry[1].name,

                                score:
                                    entry[1].score

                            });

                        }
                    );

                }


                let index = 0;


                if (
                    data.state &&
                    data.state.currentPlayerId
                ) {

                    const found =
                        firebasePlayers.findIndex(
                            function (p) {

                                return (
                                    p.id ===
                                    data.state.currentPlayerId
                                );

                            }
                        );


                    if (
                        found >= 0
                    ) {

                        index = found;

                    }

                }


                if (
                    window.applyFirebaseState
                ) {

                    window.applyFirebaseState({

                        players:
                            firebasePlayers,

                        currentPlayerIndex:
                            index,

                        throwNumber:
                            data.state
                                ? (
                                    data.state.throwNumber ||
                                    0
                                )
                                : 0,

                        lastScore:
                            data.state
                                ? data.state.lastScore
                                : null,

                        lastLabel:
                            data.state
                                ? data.state.lastLabel
                                : ""

                    });

                }

            }
        );

    };


/* =========================================================
   PLAYER ID
========================================================= */

function getPlayerId(
    index
) {

    return "p" + (
        index + 1
    );

}


/* =========================================================
   UPDATE THROW
========================================================= */

window.firebaseUpdateThrow =
    async function (data) {

        if (!roomRef) {
            return;
        }


        const updates = {};


        data.players.forEach(
            function (
                player,
                index
            ) {

                updates[
                    "players/" +
                    player.id +
                    "/name"
                ] =
                    player.name;


                updates[
                    "players/" +
                    player.id +
                    "/score"
                ] =
                    player.score;


                updates[
                    "players/" +
                    player.id +
                    "/order"
                ] =
                    index;

            }
        );


        const current =
            data.players[
                data.currentPlayerIndex
            ];


        updates[
            "state/currentPlayerId"
        ] =
            current
                ? current.id
                : null;


        updates[
            "state/throwNumber"
        ] =
            data.throwNumber;


        updates[
            "state/lastScore"
        ] =
            data.lastScore;


        updates[
            "state/lastLabel"
        ] =
            data.lastLabel;


        updates[
            "state/finished"
        ] =
            data.finished;


        await update(
            roomRef,
            updates
        );

    };


/* =========================================================
   UPDATE STATE
========================================================= */

window.firebaseUpdateState =
    async function (data) {

        if (!roomRef) {
            return;
        }


        const playersSnapshot =
            await new Promise(
                function (resolve) {

                    onValue(
                        roomRef,
                        resolve,
                        {
                            onlyOnce:
                                true
                        }
                    );

                }
            );


        const currentPlayers =
            playersSnapshot.val();


        if (
            !currentPlayers ||
            !currentPlayers.players
        ) {
            return;
        }


        const playerEntries =
            Object.entries(
                currentPlayers.players
            )
            .sort(
                function (a, b) {

                    return (
                        (a[1].order || 0) -
                        (b[1].order || 0)
                    );

                }
            );


        const current =
            playerEntries[
                data.currentPlayerIndex
            ];


        if (!current) {
            return;
        }


        await update(
            roomRef,
            {

                "state/currentPlayerId":
                    current[0],

                "state/throwNumber":
                    data.throwNumber

            }
        );

    };


/* =========================================================
   REPLACE PLAYERS
========================================================= */

window.firebaseReplacePlayers =
    async function (
        players,
        currentIndex
    ) {

        if (!roomRef) {
            return;
        }


        const playerData = {};


        players.forEach(
            function (
                player,
                index
            ) {

                playerData[
                    player.id
                ] = {

                    name:
                        player.name,

                    score:
                        player.score,

                    order:
                        index

                };

            }
        );


        const current =
            players[
                currentIndex
            ];


        await update(
            roomRef,
            {

                players:
                    playerData,

                "state/currentPlayerId":
                    current
                        ? current.id
                        : null,

                "state/throwNumber":
                    0

            }
        );

    };


/* =========================================================
   RESET
========================================================= */

window.firebaseResetGame =
    async function (
        players
    ) {

        if (!roomRef) {
            return;
        }


        const playerData = {};


        players.forEach(
            function (
                player,
                index
            ) {

                playerData[
                    player.id
                ] = {

                    name:
                        player.name,

                    score:
                        501,

                    order:
                        index

                };

            }
        );


        const first =
            players[0];


        await update(
            roomRef,
            {

                players:
                    playerData,

                state: {

                    currentPlayerId:
                        first
                            ? first.id
                            : null,

                    throwNumber:
                        0,

                    lastScore:
                        null,

                    lastLabel:
                        "",

                    finished:
                        false

                }

            }
        );

    };

</script>
