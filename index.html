<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>DARTS COUNT-UP</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:Arial,"Helvetica Neue",sans-serif;
}

button,input{
  font:inherit;
}

button{
  border:0;
  color:white;
  background:#181818;
}

.screen{
  position:absolute;
  inset:0;
  display:none !important;
}

.screen.active{
  display:flex !important;
}


/* =========================
   START
========================= */

#startScreen{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:24px;
  background:#050505;
}

.title{
  font-size:clamp(38px,7vw,80px);
  font-weight:900;
  letter-spacing:5px;
}

.roomBox{
  width:min(520px,85vw);
}

.roomBox input{
  width:100%;
  padding:18px;
  border-radius:10px;
  border:1px solid #444;
  background:#111;
  color:white;
  text-align:center;
  font-size:24px;
  outline:none;
}

.roleButtons{
  display:flex;
  gap:18px;
  width:min(650px,90vw);
}

.roleButtons button{
  flex:1;
  min-height:90px;
  border:1px solid #444;
  border-radius:12px;
  font-size:25px;
  font-weight:bold;
}

.roleButtons button:active{
  transform:scale(.97);
  background:#333;
}


/* =========================
   INPUT
========================= */

#inputScreen{
  flex-direction:column;
}

.inputHeader{
  height:105px;
  flex:none;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:10px 22px;
  background:#0c0c0c;
  border-bottom:1px solid #222;
}

.turnInfo{
  text-align:left;
}

.turnInfo small{
  display:block;
  color:#888;
  font-size:15px;
}

.turnInfo strong{
  font-size:42px;
  line-height:1;
}

.currentPlayer{
  text-align:center;
}

.currentPlayer small{
  display:block;
  color:#888;
  font-size:15px;
}

.currentPlayer strong{
  font-size:32px;
}

.throwInfo{
  text-align:right;
}

.throwInfo small{
  display:block;
  color:#888;
  font-size:15px;
}

.throwInfo strong{
  font-size:42px;
  line-height:1;
}

.inputMain{
  flex:1;
  min-height:0;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:hidden;
}

.boardWrap{
  width:min(90vh,90vw);
  height:min(90vh,90vw);
  max-width:900px;
  max-height:900px;
  position:relative;
}

#dartboard{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
  user-select:none;
}

.boardSegment{
  stroke:none;
}

.boardNumber{
  font-family:
    "Bodoni 72",
    "Times New Roman",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-weight:900;
  font-size:15px;
  fill:white;
  text-anchor:middle;
  dominant-baseline:middle;
  pointer-events:none;
  paint-order:stroke;
  stroke:#000;
  stroke-width:.8px;
}

.hitMarker{
  pointer-events:none;
}


/* INPUT MENU */

.inputMenu{
  position:absolute;
  top:18px;
  right:18px;
  z-index:10;
}

.menuButton{
  width:62px;
  height:62px;
  border-radius:50%;
  background:#171717;
  border:1px solid #444;
  font-size:28px;
}

.menuPanel{
  position:absolute;
  right:0;
  top:72px;
  width:270px;
  padding:14px;
  border-radius:12px;
  background:#151515;
  border:1px solid #333;
  display:none;
  box-shadow:0 10px 40px #000;
}

.menuPanel.open{
  display:block;
}

.menuPanel button{
  width:100%;
  padding:14px;
  margin:4px 0;
  border-radius:8px;
  text-align:left;
}

.menuPanel button:active{
  background:#333;
}

.turnSetting{
  padding:12px 5px;
  color:#aaa;
}

.turnSetting input{
  width:100%;
  margin-top:8px;
}


/* =========================
   OUTPUT
========================= */

#outputScreen{
  flex-direction:column;
  background:#050505;
}

.outputHeader{
  flex:none;
  min-height:170px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#090909;
  border-bottom:1px solid #252525;
  position:relative;
}

.outputHeader .label{
  color:#888;
  font-size:20px;
  letter-spacing:3px;
}

.outputCurrentPlayer{
  font-size:clamp(42px,7vw,80px);
  font-weight:900;
  margin:5px 0;
}

.outputCurrentScore{
  font-family:
    "Bodoni 72",
    "Times New Roman",
    "Yu Mincho",
    serif;

  font-size:clamp(100px,16vw,190px);
  line-height:.85;
  font-weight:900;
  letter-spacing:-4px;
}

.outputLastScore{
  position:absolute;
  right:30px;
  bottom:20px;
  color:#777;
  font-size:22px;
}

.outputMain{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:30px;
}

.playerList{
  width:min(1200px,96vw);
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}


/*
  4人以上の場合だけ左右2列
*/

.playerList.fourOrMore{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}


.playerRow{
  min-height:90px;
  display:grid;
  grid-template-columns:70px 1fr auto auto;
  align-items:center;
  gap:20px;
  padding:12px 28px;
  border-radius:14px;
  background:#111;
  border:1px solid #242424;
  transition:.2s;
}

.playerRow.current{
  background:#191600;
  border:2px solid #d8b800;
  box-shadow:
    0 0 15px rgba(255,215,0,.18),
    inset 0 0 15px rgba(255,215,0,.06);
}

.playerNo{
  color:#777;
  font-size:25px;
  text-align:center;
}

.playerName{
  font-size:clamp(25px,3vw,42px);
  font-weight:bold;
}

.topPrayer{
  display:inline-block;
  margin-left:12px;
  color:#d8b800;
  font-size:.42em;
  font-weight:900;
  letter-spacing:1px;
  vertical-align:middle;
  white-space:nowrap;
}

.playerTurnScore{
  color:#777;
  font-size:clamp(20px,2.5vw,32px);
  min-width:100px;
  text-align:right;
}

.playerTotal{
  font-family:
    "Bodoni 72",
    "Times New Roman",
    "Yu Mincho",
    serif;

  font-size:clamp(42px,6vw,76px);
  font-weight:900;
  min-width:170px;
  text-align:right;
}


/* =========================
   HISTORY
========================= */

.history{
  width:min(1200px,96vw);
  margin:25px auto 0;
  padding-bottom:20px;
}

.historyTitle{
  color:#777;
  font-size:16px;
  letter-spacing:2px;
  margin-bottom:10px;
}

.historyList{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.historyRow{
  display:grid;
  grid-template-columns:60px 1fr auto auto;
  align-items:center;
  min-height:45px;
  padding:7px 14px;
  background:#101010;
  border:1px solid #202020;
  border-radius:7px;
}

.historyPlayer{
  color:#aaa;
  font-size:14px;
}

.historyLabel{
  font-weight:bold;
}

.historyType{
  color:#777;
  font-size:13px;
  text-align:right;
  margin-right:15px;
}

.historyScore{
  font-family:
    "Bodoni 72",
    "Times New Roman",
    "Yu Mincho",
    serif;

  font-size:25px;
  font-weight:900;
  min-width:55px;
  text-align:right;
}


/* =========================
   OUTPUT EFFECT
========================= */

#effectLayer{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
}

#effectLayer.show{
  animation:effectFade .9s ease-out;
}

.effectText{
  font-family:
    "Bodoni 72",
    "Times New Roman",
    "Yu Mincho",
    serif;

  font-size:clamp(90px,17vw,220px);
  font-weight:900;
  letter-spacing:4px;
  text-shadow:
    0 0 15px #000,
    0 0 35px #000;
  transform:scale(.5);
}

#effectLayer.show .effectText{
  animation:effectPop .9s cubic-bezier(.1,.8,.2,1);
}

@keyframes effectPop{
  0%{
    transform:scale(.3);
    opacity:0;
  }

  25%{
    transform:scale(1.15);
    opacity:1;
  }

  55%{
    transform:scale(1);
    opacity:1;
  }

  100%{
    transform:scale(1.08);
    opacity:0;
  }
}

@keyframes effectFade{
  0%{opacity:1}
  75%{opacity:1}
  100%{opacity:0}
}


/* =========================
   PLAYER CHANGE
========================= */

#playerChange{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.8);
  pointer-events:none;
}

#playerChange.show{
  display:flex;
}

.changeText{
  font-size:clamp(50px,10vw,130px);
  font-weight:900;
  letter-spacing:8px;
  animation:changeIn .8s ease-out;
}

@keyframes changeIn{
  0%{
    opacity:0;
    transform:scale(.7);
  }

  40%{
    opacity:1;
    transform:scale(1.08);
  }

  100%{
    opacity:0;
    transform:scale(1);
  }
}


/* =========================
   AUDIO SETTINGS
========================= */

.audioSettings{
  position:fixed;
  right:20px;
  top:20px;
  z-index:300;
}

.audioButton{
  width:58px;
  height:58px;
  border-radius:50%;
  border:1px solid #444;
  background:#161616;
  font-size:25px;
}

.audioPanel{
  position:absolute;
  right:0;
  top:68px;
  width:min(370px,90vw);
  padding:18px;
  background:#151515;
  border:1px solid #333;
  border-radius:12px;
  display:none;
  box-shadow:0 15px 50px #000;
}

.audioPanel.open{
  display:block;
}

.audioPanel h3{
  margin:0 0 15px;
}

.audioItem{
  padding:10px 0;
  border-bottom:1px solid #292929;
}

.audioItem label{
  display:block;
  margin-bottom:7px;
  color:#bbb;
}

.audioItem input{
  width:100%;
  font-size:13px;
}

.audioStatus{
  margin-top:12px;
  color:#777;
  font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .inputHeader{
    height:78px;
    padding:6px 10px;
  }

  .turnInfo strong,
  .throwInfo strong{
    font-size:29px;
  }

  .currentPlayer strong{
    font-size:20px;
  }

  .currentPlayer small,
  .turnInfo small,
  .throwInfo small{
    font-size:10px;
  }

  .boardWrap{
    width:96vw;
    height:96vw;
  }

  .outputHeader{
    min-height:145px;
  }

  .outputLastScore{
    right:12px;
    bottom:8px;
    font-size:14px;
  }

  .outputMain{
    padding:10px;
  }

  .playerRow{
    grid-template-columns:35px 1fr auto;
    gap:8px;
    padding:8px 12px;
    min-height:70px;
  }

  .playerTurnScore{
    display:none;
  }

  .playerTotal{
    min-width:80px;
    font-size:40px;
  }

  .playerName{
    font-size:22px;
  }

  .playerNo{
    font-size:16px;
  }

  /*
    4人以上でもスマホでは
    2列を維持
  */

  .playerList.fourOrMore{
    grid-template-columns:1fr 1fr;
    gap:7px;
  }

  .playerList.fourOrMore .playerRow{
    grid-template-columns:25px 1fr auto;
    padding:6px;
  }

  .playerList.fourOrMore .playerName{
    font-size:16px;
  }

  .playerList.fourOrMore .playerTotal{
    font-size:30px;
    min-width:55px;
  }

  .topPrayer{
    display:block;
    margin-left:0;
    margin-top:2px;
    font-size:9px;
  }

  .historyRow{
    grid-template-columns:45px 1fr auto;
  }

  .historyType{
    display:none;
  }

}


/* 3人以下では履歴を通常配置 */
@media(min-width:601px){

  .historyList{
    max-height:260px;
    overflow:auto;
  }

}

</style>
</head>

<body>


<!-- =====================================================
     START
===================================================== -->

<div id="startScreen">

  <div class="title">DARTS</div>

  <div class="roomBox">

    <input
      id="roomInput"
      type="text"
      placeholder="ROOM NAME"
      autocomplete="off">

  </div>

  <div class="roleButtons">

    <button id="inputButton">
      INPUT
    </button>

    <button id="outputButton">
      OUTPUT
    </button>

  </div>

</div>


<!-- =====================================================
     INPUT
===================================================== -->

<div id="inputScreen" class="screen">

  <div class="inputHeader">

    <div class="turnInfo">

      <small>REMAINING TURNS</small>

      <strong id="remainingTurns">
        10
      </strong>

    </div>


    <div class="currentPlayer">

      <strong id="inputPlayerName">
        PLAYER 1
      </strong>

    </div>


    <div class="throwInfo">

      <small>REMAINING THROWS</small>

      <strong id="remainingThrows">
        3
      </strong>

    </div>

  </div>


  <div class="inputMain">

    <div class="inputMenu">

      <button
        class="menuButton"
        id="menuButton">

      <div

        <button id="addPlayerButton">

        <button id="deletePlayerButton">

        <div class="turnSetting">

          <input

            type="number"

            value="10">

        <button id="applyTurnButton">

    <div class="boardWrap">

<!-- =====================================================

===================================================== -->

<div id="outputScreen" class="screen">

    </div>

    <div
      class="outputCurrentPlayer"
      id="outputCurrentPlayer">

    </div>

    <div

      id="outputCurrentScore">
      0
    </div>

  </div>


  <div class="outputMain">

    <div
      class="playerList"

    </div>


    <div class="history">

      <div class="historyTitle">

      </div>

      <div

      </div>

  </div>

</div>


<!-- =====================================================
     EFFECT
===================================================== -->

<div id="effectLayer">

  <div
    class="effectText"
    id="effectText">
  </div>

</div>


<!-- =====================================================
     PLAYER CHANGE
===================================================== -->

<div id="playerChange">

  <div class="changeText">
    PLAYER CHANGE
  </div>

</div>


<!-- =====================================================
     AUDIO
===================================================== -->

<div
  class="audioSettings"
  id="audioSettings"
  style="display:none">

  <button
    class="audioButton"
    id="audioButton">
    🔊
  </button>


  <div
    class="audioPanel"
    id="audioPanel">

    <h3>音声設定</h3>


    <div class="audioItem">

      <label>
        通常得点
      </label>

      <input
        type="file"
        id="audioNormal"

    <div class="audioItem">

      <label>
        BULL
      </label>

      <input
        type="file"
        id="audioBull"

    </div>


    <div class="audioItem">

      <label>
        TRIPLE
      </label>

      <input
        type="file"
        id="audioTriple"
        accept="audio/*">

    </div>


    <div class="audioItem">

      <label>
        DOUBLE
      </label>

      <input
        type="file"
        id="audioDouble"
        accept="audio/*">

    </div>


    <div class="audioItem">

      <label>
        PLAYER CHANGE
      </label>

      <input
        type="file"
        id="audioChange"

    <div

<script>

/* =========================================================
   BASIC
========================================================= */

const startScreen =
  document.getElementById("startScreen");

const inputScreen =
  document.getElementById("inputScreen");

const outputScreen =
  document.getElementById("outputScreen");

const roomInput =
  document.getElementById("roomInput");

let selectedRole = null;

let roomName = "";

let gameState = null;

let db = null;

let roomRef = null;

let isFirebaseReady = false;


/* =========================================================
   SCREEN
========================================================= */

function showScreen(screen){

  startScreen.style.display = "none";

  inputScreen.classList.remove("active");

  outputScreen.classList.remove("active");


  if(screen === "input"){

    inputScreen.classList.add("active");

  }


  if(screen === "output"){

    outputScreen.classList.add("active");

  }

}


document
.getElementById("inputButton")
.addEventListener(
  "click",
  ()=>{

    roomName =
      roomInput.value.trim();

    if(!roomName){

      alert(
        "ROOM NAMEを入力してください"
      );

      return;

    }

    selectedRole = "input";

    showScreen("input");

    initializeInput();

  }
);


document
.getElementById("outputButton")
.addEventListener(
  "click",
  ()=>{

    roomName =
      roomInput.value.trim();

    if(!roomName){

      alert(
        "ROOM NAMEを入力してください"
      );

      return;

    }

    selectedRole = "output";

    showScreen("output");

    document
      .getElementById("audioSettings")
      .style.display = "block";

    initializeOutput();

  }
);


/* =========================================================
   DARTBOARD
========================================================= */

const svg =
  document.getElementById("dartboard");

const segmentLayer =
  document.getElementById(
    "boardSegments"
  );

const numberLayer =
  document.getElementById(
    "boardNumbers"
  );

const hitLayer =
  document.getElementById(
    "hitMarkers"
  );


const CX = 150;

const CY = 150;

const OUTER_RADIUS = 135;

const DOUBLE_IN = 116;

const DOUBLE_OUT = 129;

const TRIPLE_IN = 68;

const TRIPLE_OUT = 79;


/*
  Bull

  ★ 前の見た目に戻す

  外側Bull = 濃い緑
  内側Bull = 濃い赤
*/

const OUTER_BULL = 20;

const INNER_BULL = 10;


const numbers = [
  20,1,18,4,13,6,10,15,2,17,
  3,19,7,16,8,11,14,9,12,5
];


function polarPoint(
  radius,
  degrees
){

  const rad =
    degrees *
    Math.PI /
    180;


  return {

    x:
      CX +
      radius *
      Math.sin(rad),

    y:
      CY -
      radius *
      Math.cos(rad)

  };

}


function wedgePath(
  r1,
  r2,
  a1,
  a2
){

  const p1 =
    polarPoint(r2,a1);

  const p2 =
    polarPoint(r2,a2);

  const p3 =
    polarPoint(r1,a2);

  const p4 =
    polarPoint(r1,a1);


  return `
    M ${p1.x} ${p1.y}
    A ${r2} ${r2} 0 0 1
      ${p2.x} ${p2.y}
    L ${p3.x} ${p3.y}
    A ${r1} ${r1} 0 0 0
      ${p4.x} ${p4.y}
    Z
  `;

}


/* =========================================================
   BUILD BOARD
========================================================= */

function buildDartboard(){

  segmentLayer.innerHTML = "";

  numberLayer.innerHTML = "";


  for(let i=0;i<20;i++){

    const centerAngle =
      i * 18;


    const a1 =
      centerAngle - 9;

    const a2 =
      centerAngle + 9;


    /*
      SINGLE
    */

    const base =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );


    base.setAttribute(
      "d",
      wedgePath(
        0,
        OUTER_RADIUS,
        a1,
        a2
      )
    );


    base.setAttribute(
      "fill",
      i % 2 === 0
        ? "#eeeeee"
        : "#111111"
    );


    base.classList.add(
      "boardSegment"
    );


    segmentLayer.appendChild(
      base
    );


    /*
      TRIPLE
    */

    const triple =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );


    triple.setAttribute(
      "d",
      wedgePath(
        TRIPLE_IN,
        TRIPLE_OUT,
        a1,
        a2
      )
    );


    triple.setAttribute(
      "fill",
      i % 2 === 0
        ? "#671919"
        : "#174c37"
    );


    triple.classList.add(
      "boardSegment"
    );


    segmentLayer.appendChild(
      triple
    );


    /*
      DOUBLE
    */

    const doubleRing =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );


    doubleRing.setAttribute(
      "d",
      wedgePath(
        DOUBLE_IN,
        DOUBLE_OUT,
        a1,
        a2
      )
    );


    doubleRing.setAttribute(
      "fill",
      i % 2 === 0
        ? "#671919"
        : "#174c37"
    );


    doubleRing.classList.add(
      "boardSegment"
    );


    segmentLayer.appendChild(
      doubleRing
    );


    /*
      NUMBERS
    */

    const p =
      polarPoint(
        143,
        centerAngle
      );


    const text =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "text"
      );


    text.setAttribute(
      "x",
      p.x
    );

    text.setAttribute(
      "y",
      p.y
    );


    text.textContent =
      numbers[i];


    text.classList.add(
      "boardNumber"
    );


    numberLayer.appendChild(
      text
    );

  }


  /*
    ★ 外側Bull
    前の見た目
  */

  const outerBull =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );


  outerBull.setAttribute(
    "cx",
    CX
  );

  outerBull.setAttribute(
    "cy",
    CY
  );

  outerBull.setAttribute(
    "r",
    OUTER_BULL
  );

  outerBull.setAttribute(
    "fill",
    "#174c37"
  );


  segmentLayer.appendChild(
    outerBull
  );


  /*
    ★ 内側Bull
  */

  const innerBull =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );


  innerBull.setAttribute(
    "cx",
    CX
  );

  innerBull.setAttribute(
    "cy",
    CY
  );

  innerBull.setAttribute(
    "r",
    INNER_BULL
  );

  innerBull.setAttribute(
    "fill",
    "#671919"
  );


  segmentLayer.appendChild(
    innerBull
  );

}


/* =========================================================
   PRECISE SVG COORDINATE
========================================================= */

function getBoardPoint(event){

  const rect =
    svg.getBoundingClientRect();


  /*
    画面座標
    ↓
    SVG viewBox座標
  */

  const x =
    (event.clientX - rect.left)
    * 300
    / rect.width;


  const y =
    (event.clientY - rect.top)
    * 300
    / rect.height;


  return {
    x,
    y
  };

}


/* =========================================================
   SCORE
========================================================= */

function calculateScore(
  x,
  y
){

  const dx =
    x - CX;

  const dy =
    y - CY;


  const radius =
    Math.sqrt(
      dx*dx +
      dy*dy
    );


  if(
    radius >
    OUTER_RADIUS
  ){

    return null;

  }


  /*
    INNER BULL
  */

  if(
    radius <=
    INNER_BULL
  ){

    return {

      score:50,
      label:"BULL",
      type:"bull"

    };

  }


  /*
    OUTER BULL
  */

  if(
    radius <=
    OUTER_BULL
  ){

    return {

      score:25,
      label:"25",
      type:"outerBull"

    };

  }


  /*
    ANGLE
  */

  let angle =
    Math.atan2(
      dx,
      -dy
    )
    * 180 /
    Math.PI;


  if(angle < 0){

    angle += 360;

  }


  const index =
    Math.floor(
      (angle + 9) / 18
    ) % 20;


  const number =
    numbers[index];


  /*
    TRIPLE
  */

  if(
    radius >= TRIPLE_IN &&
    radius <= TRIPLE_OUT
  ){

    return {

      score:number * 3,

      label:
        "T" +
        number * 3,

      type:"triple",

      number

    };

  }


  /*
    DOUBLE
  */

  if(
    radius >= DOUBLE_IN &&
    radius <= DOUBLE_OUT
  ){

    return {

      score:number * 2,

      label:
        "D" +
        number * 2,

      type:"double",

      number

    };

  }


  /*
    SINGLE
  */

  return {

    score:number,

    label:String(number),

    type:"single",

    number

  };

}

/* =========================================================
   BOARD INPUT
========================================================= */

svg.addEventListener(
  "pointerdown",
  event=>{

    event.preventDefault();


    if(!gameState){
      return;
    }


    if(
      gameState.state &&
      gameState.state.finished
    ){

      return;

    }


    const point =
      getBoardPoint(event);


    const result =
      calculateScore(
        point.x,
        point.y
      );


    if(!result){
      return;
    }


    addHitMarker(
      point.x,
      point.y
    );


    processThrow(
      result.score,
      result.label,
      result.type
    );

  }
);

/* =========================================================
   WAIT
========================================================= */

function waitForFirebase(){

  return new Promise(
    resolve=>{

      if(isFirebaseReady){

        resolve();

        return;

      }


      let count = 0;


      const timer =
        setInterval(
          ()=>{

            count++;


            if(isFirebaseReady){

              clearInterval(timer);

              resolve();

            }


            if(count > 100){

              clearInterval(timer);

              resolve();

            }

          },
          100
        );

    }
  );

}


/* =========================================================
   FIREBASE SYNC
========================================================= */

async function startFirebaseSync(){

  roomRef =
    window.firebaseRef(
      db,
      "rooms/" +
      encodeURIComponent(
        roomName
      )
    );


  window.firebaseOnValue(
    roomRef,
    snapshot=>{

      const data =
        snapshot.val();


      if(!data){

        if(
          selectedRole ===
          "input"
        ){

          window.firebaseSet(
            roomRef,
            createInitialState()
          );

        }

        return;

      }


      gameState =
        data;


      updateAllUI();

    }
  );

}


/* =========================================================
   THROW PROCESS
========================================================= */

async function processThrow(
  score,
  label,
  type
){

  if(!gameState){
    return;
  }


  const state =
    gameState.state;


  const currentId =
    state.currentPlayerId;


  const player =
    gameState.players[
      currentId
    ];


  if(!player){
    return;
  }


  const newScore =
    Number(
      player.score || 0
    ) + score;


  const newTurnScore =
    Number(
      player.turnScore || 0
    ) + score;


  const throwNumber =
    Number(
      state.throwNumber || 0
    ) + 1;


  /*
    ★ 1投ごとの履歴
  */

  const history =
    Array.isArray(
      gameState.history
    )
      ? [...gameState.history]
      : [];


  history.push({

    playerId:
      currentId,

    playerName:
      player.name,

    score,

    label,

    type,

    turn:
      Number(
        gameState.currentTurn || 1
      ),

    throwNumber,

    timestamp:
      Date.now()

  });


  /*
    履歴は新しいものを
    先頭に表示できるよう
    最大100投まで保存
  */

  while(
    history.length > 100
  ){

    history.shift();

  }


  const updates = {};


  updates[
    "players/" +
    currentId +
    "/score"
  ] =
    newScore;


  updates[
    "players/" +
    currentId +
    "/turnScore"
  ] =
    newTurnScore;


  updates[
    "state/throwNumber"
  ] =
    throwNumber;


  updates[
    "state/lastScore"
  ] =
    score;


  updates[
    "state/lastLabel"
  ] =
    label;


  updates[
    "state/lastType"
  ] =
    type;


  /*
    得点演出ID
  */

  updates[
    "state/effectId"
  ] =
    Date.now() +
    Math.floor(
      Math.random()*1000
    );


  /*
    1投ごとの履歴
  */

  updates[
    "history"
  ] =
    history;


  /*
    ★ ここではまだ
       プレイヤーチェンジしない

       3投目でも、
       まず得点だけFirebaseへ送る。
  */

  await window.firebaseUpdate(
    roomRef,
    updates
  );


  /*
    ★ 3投目の場合

    得点演出が終わるまで待つ。
  */

  if(
    throwNumber >= 3
  ){

    setTimeout(
      ()=>{
        changePlayerAfterEffect();
      },
      950
    );

  }

}


/* =========================================================
   ★ PLAYER CHANGE
   演出後に実行
========================================================= */

async function changePlayerAfterEffect(){

  if(!gameState){
    return;
  }


  if(
    gameState.state.finished
  ){
    return;
  }


  const players =
    Object.entries(
      gameState.players || {}
    )
    .sort(
      (a,b)=>
        Number(
          a[1].order || 0
        )
        -
        Number(
          b[1].order || 0
        )
    );


  if(players.length === 0){
    return;
  }


  const currentIndex =
    players.findIndex(
      ([id]) =>
        id ===
        gameState.state.currentPlayerId
    );


  let nextIndex =
    currentIndex + 1;


  let nextTurn =
    Number(
      gameState.currentTurn || 1
    );


  /*
    全員終わったら
    次のターン
  */

  if(
    nextIndex >=
    players.length
  ){

    nextIndex = 0;

    nextTurn++;

  }


  /*
    最大ターン終了
  */

  if(
    nextTurn >
    Number(
      gameState.maxTurns || 10
    )
  ){

    await window.firebaseUpdate(
      roomRef,
      {

        "state/finished":
          true,

        "state/throwNumber":
          3

      }
    );

    return;

  }


  const nextPlayerId =
    players[nextIndex][0];


  /*
    ★ ここで初めて
       PLAYER CHANGE
  */

  await window.firebaseUpdate(
    roomRef,
    {

      currentTurn:
        nextTurn,

      "state/currentPlayerId":
        nextPlayerId,

      "state/throwNumber":
        0,

      "players/" +
      nextPlayerId +
      "/turnScore":
        0,

      "state/changeId":
        Date.now()

    }
  );


  /*
    INPUT側のヒットマーカーも
    プレイヤー変更時に消す
  */

  hitLayer.innerHTML = "";

}

========================================================= */

document
.getElementById(
  "deletePlayerButton"
)
.addEventListener(
  "click",
  async ()=>{

    if(!gameState){
      return;
    }


    const players =
      Object.entries(
        gameState.players || {}
      )
      .sort(
        (a,b)=>
          a[1].order -
          b[1].order
      );


    if(
      players.length <= 1
    ){

      alert(
        "プレイヤーは1人以上必要です"
      );

      return;

    }


    const currentId =
      gameState.state
        .currentPlayerId;


    const newPlayers =
      {};


    let order = 0;


    for(
      const [id,p]
      of players
    ){

      if(id === currentId){
        continue;
      }


      newPlayers[id] = {

        ...p,

        order:order++

      };

    }


    const firstId =
      Object.keys(
        newPlayers
      )[0];


    await window.firebaseUpdate(
      roomRef,
      {

        players:
          newPlayers,

        "state/currentPlayerId":
          firstId,

        "state/throwNumber":
          0

      }
    );

);

/* =========================================================
   OUTPUT UI
========================================================= */

let lastChangeId = 0;

let lastEffectId = 0;


function updateOutputUI(){

  if(!gameState){
    return;
  }


  const state =
    gameState.state;


  const currentPlayer =
    gameState.players[
      state.currentPlayerId
    ];


  if(!currentPlayer){
    return;
  }


  /*
    現在プレイヤー
  */

  document
    .getElementById(
      "outputCurrentPlayer"
    )
    .textContent =
      currentPlayer.name;


  document
    .getElementById(
      "outputCurrentScore"
    )
    .textContent =
      currentPlayer.score || 0;


  /*
    最後の得点
  */

  if(state.lastLabel){

    document
      .getElementById(
        "outputLastScore"
      )
      .textContent =
        state.lastLabel;

  }


  /*
    プレイヤーを得点順に判定

    ★ TOP Prayer
  */

  const players =
    Object.entries(
      gameState.players || {}
    )
    .sort(
      (a,b)=>
        Number(
          b[1].score || 0
        )
        -
        Number(
          a[1].score || 0
        )
    );


  /*
    同点の場合はorder順
  */

  players.sort(
    (a,b)=>{

      const scoreDiff =
        Number(
          b[1].score || 0
        )
        -
        Number(
          a[1].score || 0
        );


      if(scoreDiff !== 0){
        return scoreDiff;
      }


      return Number(
        a[1].order || 0
      )
      -
      Number(
        b[1].order || 0
      );

    }
  );


  const list =
    document.getElementById(
      "playerList"
    );


  list.innerHTML = "";


  /*
    4人以上なら
    CSSで左右分割
  */

  if(players.length >= 4){

    list.classList.add(
      "fourOrMore"
    );

  }else{

    list.classList.remove(
      "fourOrMore"
    );

  }


  players.forEach(
    ([id,p],index)=>{

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "playerRow" +
        (
          id ===
          state.currentPlayerId
            ? " current"
            : ""
        );


      /*
        ★ 1位だけTOP Prayer
      */

      const topLabel =
        index === 0
          ? `
            <span class="topPrayer">
              TOP Prayer
            </span>
          `
          : "";


      row.innerHTML = `

        <div class="playerNo">
          ${index + 1}
        </div>

        <div class="playerName">
          ${escapeHTML(p.name)}
          ${topLabel}
        </div>

        <div class="playerTurnScore">
          +${Number(
            p.turnScore || 0
          )}
        </div>

        <div class="playerTotal">
          ${Number(
            p.score || 0
          )}
        </div>

      `;


      list.appendChild(
        row
      );

    }
  );


  /*
    ★ 1投ずつの履歴
  */

  updateHistory();


  /*
    得点演出
  */

  const effectId =
    Number(
      state.effectId || 0
    );


  if(
    effectId &&
    effectId !== lastEffectId
  ){

    lastEffectId =
      effectId;


    showScoreEffect(
      state.lastScore,
      state.lastType
    );

  }


  /*
    ★ Player Change

    effectの約950ms後に
    Firebase側でchangeIdが更新される。
  */

  const changeId =
    Number(
      state.changeId || 0
    );


  if(
    changeId &&
    changeId !== lastChangeId
  ){

    lastChangeId =
      changeId;


    showPlayerChange();

  }

}

  }

  else if(

    text.textContent =
      "TRIPLE";

  else if(
    type === "double"

    },

  );

/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(str){

  return String(str)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

/* =========================================================
   AUDIO
========================================================= */

const audioFiles = {

  normal:null,

  bull:null,

  triple:null,

  double:null,

  change:null

};


const audioElements = {

  normal:
    new Audio(),

  bull:
    new Audio(),

  triple:
    new Audio(),

  double:
    new Audio(),

  change:
    new Audio()

};


function setupAudioInput(
  id,
  key
){

  document
    .getElementById(id)
    .addEventListener(
      "change",
      event=>{

        const file =
          event.target.files[0];


        if(!file){
          return;
        }


        if(
          audioFiles[key]
        ){

          URL.revokeObjectURL(
            audioFiles[key]
          );

        }


        const url =
          URL.createObjectURL(
            file
          );


        audioFiles[key] =
          url;


        audioElements[key].src =
          url;


        audioElements[key].load();


        document
          .getElementById(
            "audioStatus"
          )
          .textContent =
            key.toUpperCase() +
            " の音声を設定しました";

      }
    );

}


setupAudioInput(
  "audioNormal",
  "normal"
);

setupAudioInput(
  "audioBull",
  "bull"
);

setupAudioInput(
  "audioTriple",
  "triple"
);

setupAudioInput(
  "audioDouble",
  "double"
);

setupAudioInput(
  "audioChange",
  "change"
);


/* =========================================================
   PLAY AUDIO
========================================================= */

function playAudio(type){

  if(
    selectedRole !==
    "output"
  ){

    return;

  }


  const audio =
    audioElements[type];


  if(
    !audio ||
    !audio.src
  ){

    return;

  }


  try{

    audio.pause();

    audio.currentTime = 0;

    const promise =
      audio.play();


    if(promise){

      promise.catch(
        ()=>{}
      );

    }

  }catch(e){}

}

   AUDIO PANEL
========================================================= */

document

)

/*
  OUTPUT初回タップで
  音声再生許可を取得
*/

document
.getElementById(
  "outputScreen"
)
.addEventListener(
  "pointerdown",
  ()=>{

    Object.values(
      audioElements
    ).forEach(
      audio=>{

        if(!audio.src){
          return;
        }


        audio.play()
          .then(
            ()=>{

              audio.pause();

              audio.currentTime =
                0;

            }
          )
          .catch(
            ()=>{}
          );

      }
    );

  },
  {
    once:true
  }
);


/* =========================================================
   AUDIO EVENT
========================================================= */

let previousEffectId = 0;


function handleAudioFromState(){

  if(
    selectedRole !==
    "output"
  ){

    return;

  }


  if(!gameState){
    return;
  }


  const state =
    gameState.state;


  const effectId =
    Number(
      state.effectId || 0
    );


  if(
    effectId &&
    effectId !==
    previousEffectId
  ){

    previousEffectId =
      effectId;


    if(
      state.lastType ===
        "bull" ||
      state.lastType ===
        "outerBull"
    ){

      playAudio(
        "bull"
      );

    }

    else if(
      state.lastType ===
      "triple"
    ){

      playAudio(
        "triple"
      );

    }

    else if(
      state.lastType ===
      "double"
    ){

      playAudio(
        "double"
      );

    }

    else{

      playAudio(
        "normal"
      );

    }

  }

}


/* =========================================================
   UPDATE ALL
========================================================= */

function updateAllUI(){

  if(
    selectedRole ===
    "input"
  ){

    updateInputUI();

  }


  if(
    selectedRole ===
    "output"
  ){

    updateOutputUI();

    handleAudioFromState();

  }

}

</script>
