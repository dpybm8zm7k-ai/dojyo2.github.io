<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>DARTS SCORE</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}

button,
input {
    font: inherit;
}

/* =========================
START
========================= */

#startScreen {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #050505;

    z-index: 1;
}

.startBox {

    width: min(460px, 90vw);

    padding: 30px;

    background: #101010;

    border: 1px solid #333;

    border-radius: 16px;
}

.logo {

    text-align: center;

    font-size: 42px;

    font-weight: 900;

    letter-spacing: 6px;

    margin-bottom: 35px;
}

label {

    display: block;

    margin-bottom: 8px;

    color: #999;

    font-size: 13px;
}

#roomName {

    width: 100%;

    height: 55px;

    padding: 0 15px;

    background: #1a1a1a;

    color: white;

    border: 1px solid #444;

    border-radius: 9px;

    outline: none;

    margin-bottom: 18px;
}

#roomName:focus {

    border-color: white;
}

.modeButtons {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;
}

.modeButton {

    height: 75px;

    border: 1px solid #444;

    border-radius: 12px;

    background: #181818;

    color: white;

    font-size: 20px;

    font-weight: bold;

    position: relative;

    z-index: 10;
}

.modeButton:active {

    transform: scale(.97);

    background: #333;
}

#status {

    text-align: center;

    margin-top: 20px;

    font-size: 12px;

    color: #777;
}


/* =========================
COMMON SCREEN
========================= */

.screen {

    position: fixed;

    inset: 0;

    display: none;

    background: #050505;
}

.screen.active {

    display: flex;
}


/* =========================
INPUT
========================= */

#inputScreen {

    flex-direction: column;
}

.inputHeader {

    height: 64px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 10px;

    background: #0d0d0d;

    border-bottom: 1px solid #292929;

    z-index: 20;
}

.headerButton {

    height: 44px;

    min-width: 44px;

    padding: 0 12px;

    background: #181818;

    color: white;

    border: 1px solid #333;

    border-radius: 8px;
}

.headerButton:active {

    background: #333;
}

.turn {

    text-align: center;
}

.turnPlayer {

    font-size: 17px;

    font-weight: bold;
}

.turnThrow {

    margin-top: 3px;

    font-size: 11px;

    color: #888;
}

.boardArea {

    flex: 1;

    min-height: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    background: #000;

    touch-action: none;

    position: relative;
}

#dartboard {

    width: min(96vw, 96vh);

    height: min(96vw, 96vh);

    display: block;

    touch-action: none;
}

.hit {

    position: absolute;

    left: 50%;

    top: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    pointer-events: none;

    opacity: 0;

    transition: opacity .15s;
}

.hit.visible {

    opacity: 1;
}

.hitScore {

    font-size: 70px;

    font-weight: 900;
}

.hitLabel {

    font-size: 14px;

    color: #aaa;
}


/* =========================
OUTPUT
========================= */

#outputScreen {

    flex-direction: column;
}

.outputHeader {

    height: 75px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 20px;

    background: #0d0d0d;

    border-bottom: 1px solid #292929;
}

.outputTitle {

    font-size: 24px;

    font-weight: 900;
}

.outputRoom {

    color: #777;

    font-size: 12px;

    margin-top: 3px;
}

.outputMain {

    flex: 1;

    overflow-y: auto;

    padding: 18px;
}

.currentBox {

    text-align: center;

    background: #111;

    border: 1px solid #333;

    border-radius: 14px;

    padding: 20px;

    margin-bottom: 18px;
}

.currentSmall {

    color: #777;

    font-size: 12px;
}

.currentName {

    font-size: 32px;

    font-weight: 900;

    margin-top: 5px;
}

.lastThrow {

    color: #aaa;

    margin-top: 8px;

    font-size: 13px;
}

.playerList {

    display: flex;

    flex-direction: column;

    gap: 9px;
}

.player {

    min-height: 72px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 10px 17px;

    background: #111;

    border: 1px solid #292929;

    border-radius: 12px;
}

.player.current {

    border-color: white;

    background: #191919;
}

.playerName {

    font-weight: bold;

    font-size: 18px;
}

.playerScore {

    font-size: 36px;

    font-weight: 900;
}


/* =========================
MENU
========================= */

#menu {

    position: fixed;

    inset: 0;

    display: none;

    z-index: 100;

    background: rgba(0,0,0,.75);
}

#menu.open {

    display: block;
}

.menuBox {

    position: absolute;

    top: 70px;

    right: 10px;

    width: min(350px, calc(100vw - 20px));

    max-height: calc(100vh - 85px);

    overflow-y: auto;

    padding: 15px;

    background: #111;

    border: 1px solid #444;

    border-radius: 13px;
}

.menuTitle {

    font-size: 19px;

    font-weight: bold;

    margin-bottom: 15px;
}

.menuButton {

    width: 100%;

    min-height: 50px;

    margin-bottom: 8px;

    border: 1px solid #333;

    border-radius: 8px;

    background: #191919;

    color: white;

    text-align: left;

    padding: 0 15px;
}

.menuButton:active {

    background: #333;
}

.menuPlayer {

    display: flex;

    gap: 7px;

    margin-bottom: 7px;
}

.menuPlayerName {

    flex: 1;

    display: flex;

    align-items: center;

    padding-left: 10px;

    background: #191919;

    border-radius: 7px;
}

.deleteButton {

    width: 48px;

    background: #191919;

    color: #ff7777;

    border: 1px solid #333;

    border-radius: 7px;
}


/* =========================
DIALOG
========================= */

#dialog {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    z-index: 200;

    background: rgba(0,0,0,.8);
}

#dialog.open {

    display: flex;
}

.dialogBox {

    width: min(380px, 100%);

    padding: 22px;

    background: #111;

    border: 1px solid #444;

    border-radius: 13px;
}

.dialogTitle {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 15px;
}

#playerName {

    width: 100%;

    height: 50px;

    background: #1b1b1b;

    border: 1px solid #444;

    color: white;

    border-radius: 8px;

    padding: 0 12px;

    outline: none;

    margin-bottom: 12px;
}

.dialogButtons {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;
}

.dialogButtons button {

    height: 48px;

    background: #191919;

    color: white;

    border: 1px solid #333;

    border-radius: 8px;
}

</style>
</head>

<!-- ==================================================
JAVASCRIPT

<script type="module">

/*
========================================================
Firebase
========================================================
*/

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get,
    set,
    update,
    push,
    onValue
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCh1dS522TL9HjGEkH7tCHXFWfJ0F1Qfx0",

    authDomain:
        "darts-01.firebaseapp.com",

    databaseURL:
        "https://darts-01-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "darts-01",

    storageBucket:
        "darts-01.firebasestorage.app",

    messagingSenderId:
        "936099490830",

    appId:
        "1:936099490830:web:bc3b39184138acbd1aa05f",

    measurementId:
        "G-JTX22B0QZQ"
};


/*
========================================================
変数
========================================================
*/

let app = null;

let db = null;

let room = "";

let mode = "";

let players = {};

let state = {

    currentPlayerId: null,

    throwNumber: 0,

    lastScore: null,

    lastLabel: "",

    finished: false

};

let roomRef = null;


/*
========================================================
Firebase初期化
========================================================
*/

try {

    app =
        initializeApp(firebaseConfig);

    db =
        getDatabase(app);

} catch (error) {

    console.error(
        "Firebase initialization error:",
        error
    );

}


/*
========================================================
画面切り替え
========================================================
*/

function showOnly(screen) {

    document
        .getElementById("startScreen")
        .style.display = "none";

    document
        .getElementById("inputScreen")
        .classList.remove("active");

    document
        .getElementById("outputScreen")
        .classList.remove("active");


    if (screen === "input") {

        document
            .getElementById("inputScreen")
            .classList.add("active");

    }

    if (screen === "output") {

        document
            .getElementById("outputScreen")
            .classList.add("active");

    }

}


/*
========================================================
INPUT BUTTON

Firebase処理を一切しない。
========================================================
*/

document
    .getElementById("inputButton")
    .addEventListener(
        "click",
        function () {

            const value =
                document
                    .getElementById("roomName")
                    .value
                    .trim();

            if (!value) {

                document
                    .getElementById("status")
                    .textContent =
                    "ROOM NAMEを入力してください";

                return;

            }

            room = cleanRoom(value);

            mode = "input";


            /*
             * ここで即座に画面切り替え
             */

            showOnly("input");


            /*
             * ボードも即生成
             */

            buildBoard();


            /*
             * Firebaseはその後
             */

            connectFirebase();

        }
    );


/*
========================================================
OUTPUT BUTTON

Firebase処理を一切しない。
========================================================
*/

document
    .getElementById("outputButton")
    .addEventListener(
        "click",
        function () {

            const value =
                document
                    .getElementById("roomName")
                    .value
                    .trim();

            if (!value) {

                document
                    .getElementById("status")
                    .textContent =
                    "ROOM NAMEを入力してください";

                return;

            }

            room = cleanRoom(value);

            mode = "output";


            /*
             * 即画面切り替え
             */

            showOnly("output");


            document
                .getElementById("outputRoom")
                .textContent =
                "ROOM: " + room;


            /*
             * Firebaseは後から接続
             */

            connectFirebase();

        }
    );


function cleanRoom(value) {

    return value
        .replace(/[.#$[\]/]/g, "_")
        .replace(/\s+/g, "_")
        .substring(0, 50);

}


/*
========================================================
Firebase接続
========================================================
*/

async function connectFirebase() {

    if (!db) {

        console.error(
            "Firebase is not initialized."
        );

        return;

    }


    roomRef =
        ref(
            db,
            "rooms/" + room
        );


    try {

        const snapshot =
            await get(roomRef);


        if (!snapshot.exists()) {

            await createRoom();

        }


        startListeners();


    } catch (error) {

        console.error(
            "Firebase connection error:",
            error
        );

    }

}


/*
========================================================
新規ROOM
========================================================
*/

async function createRoom() {

    players = {

        p1: {

            name: "PLAYER 1",

            score: 501,

            order: 0

        },

        p2: {

            name: "PLAYER 2",

            score: 501,

            order: 1

        }

    };


    state = {

        currentPlayerId: "p1",

        throwNumber: 0,

        lastScore: null,

        lastLabel: "",

        finished: false

    };


    await set(
        roomRef,
        {

            gameType: 501,

            players,

            state

        }
    );

}


/*
========================================================
Realtime Listener
========================================================
*/

function startListeners() {

    onValue(

        ref(
            db,
            "rooms/" +
            room +
            "/players"
        ),

        snapshot => {

            players =
                snapshot.val() || {};

            renderAll();

        }

    );


    onValue(

        ref(
            db,
            "rooms/" +
            room +
            "/state"
        ),

        snapshot => {

            const data =
                snapshot.val();

            if (data) {

                state = data;

            }

            renderAll();

        }

    );

}


/*
========================================================
PLAYER ARRAY
========================================================
*/

function getPlayers() {

    return Object.entries(players)

        .map(
            ([id, data]) => ({

                id,

                ...data

            })
        )

        .sort(
            (a, b) =>
                (a.order || 0) -
                (b.order || 0)
        );

}


/*
========================================================
DARTBOARD
========================================================
*/

const numbers = [

    20,1,18,4,13,
    6,10,15,2,17,
    3,19,7,16,8,
    11,14,9,12,5

];


function polar(r, angle) {

    const rad =
        angle * Math.PI / 180;

    return {

        x:
            r * Math.cos(rad),

        y:
            r * Math.sin(rad)

    };

}


function sector(
    inner,
    outer,
    start,
    end
) {

    const a =
        polar(inner, start);

    const b =
        polar(outer, start);

    const c =
        polar(outer, end);

    const d =
        polar(inner, end);

    return `
        M ${a.x} ${a.y}
        L ${b.x} ${b.y}
        A ${outer} ${outer}
          0 0 1
          ${c.x} ${c.y}
        L ${d.x} ${d.y}
        A ${inner} ${inner}
          0 0 0
          ${a.x} ${a.y}
        Z
    `;

}


function svg(tag, attrs) {

    const e =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            tag
        );

    Object.entries(attrs)
        .forEach(
            ([key, value]) => {

                e.setAttribute(
                    key,
                    value
                );

            }
        );

    return e;

}


function buildBoard() {

    const board =
        document.getElementById(
            "dartboard"
        );


    board.innerHTML = "";


    /*
     * 背景
     */

    board.appendChild(
        svg(
            "circle",
            {

                cx: 0,

                cy: 0,

                r: 100,

                fill: "#111",

                stroke: "#555",

                "stroke-width": 2,

                "pointer-events":
                    "none"

            }
        )
    );


    /*
     * セグメント
     */

    for (
        let i = 0;
        i < 20;
        i++
    ) {

        const center =
            -90 + i * 18;


        const number =
            numbers[i];


        const inner =
            svg(
                "path",
                {

                    d:
                        sector(
                            16,
                            43,
                            center - 8.5,
                            center + 8.5
                        ),

                    fill:
                        i % 2
                            ? "#171717"
                            : "#292929",

                    stroke: "#555",

                    "stroke-width": .6,

                    "pointer-events":
                        "none"

                }
            );


        const triple =
            svg(
                "path",
                {

                    d:
                        sector(
                            43,
                            50,
                            center - 8.5,
                            center + 8.5
                        ),

                    fill: "#777",

                    stroke: "#222",

                    "stroke-width": .7,

                    "pointer-events":
                        "none"

                }
            );


        const outer =
            svg(
                "path",
                {

                    d:
                        sector(
                            50,
                            94,
                            center - 8.5,
                            center + 8.5
                        ),

                    fill:
                        i % 2
                            ? "#171717"
                            : "#292929",

                    stroke: "#555",

                    "stroke-width": .6,

                    "pointer-events":
                        "none"

                }
            );


        const dbl =
            svg(
                "path",
                {

                    d:
                        sector(
                            94,
                            100,
                            center - 8.5,
                            center + 8.5
                        ),

                    fill: "#888",

                    stroke: "#222",

                    "stroke-width": .7,

                    "pointer-events":
                        "none"

                }
            );


        board.appendChild(inner);

        board.appendChild(triple);

        board.appendChild(outer);

        board.appendChild(dbl);

    }


    /*
     * Bull
     */

    board.appendChild(
        svg(
            "circle",
            {

                cx: 0,

                cy: 0,

                r: 16,

                fill: "#666",

                stroke: "#222",

                "pointer-events":
                    "none"

            }
        )
    );


    board.appendChild(
        svg(
            "circle",
            {

                cx: 0,

                cy: 0,

                r: 7,

                fill: "#aaa",

                stroke: "#222",

                "pointer-events":
                    "none"

            }
        )
    );


    /*
     * 線
     */

    for (
        let i = 0;
        i < 20;
        i++
    ) {

        const angle =
            (-90 + i * 18)
            * Math.PI / 180;


        board.appendChild(
            svg(
                "line",
                {

                    x1: 0,

                    y1: 0,

                    x2:
                        100 *
                        Math.cos(angle),

                    y2:
                        100 *
                        Math.sin(angle),

                    stroke: "#444",

                    "stroke-width": .5,

                    "pointer-events":
                        "none"

                }
            )
        );

    }


    /*
     * 数字
     */

    for (
        let i = 0;
        i < 20;
        i++
    ) {

        const angle =
            (-90 + i * 18)
            * Math.PI / 180;


        const x =
            106 *
            Math.cos(angle);

        const y =
            106 *
            Math.sin(angle);


        const text =
            svg(
                "text",
                {

                    x,

                    y: y + 3,

                    "text-anchor":
                        "middle",

                    fill: "#fff",

                    "font-size": 8,

                    "font-weight":
                        "bold",

                    "pointer-events":
                        "none"

                }
            );


        text.textContent =
            numbers[i];


        board.appendChild(text);

    }


    /*
     * ボード全体をクリック
     */

    board.addEventListener(
        "pointerdown",
        boardPointer
    );

}


/*
========================================================
BOARD POINTER
========================================================
*/

function boardPointer(event) {

    event.preventDefault();


    if (
        mode !== "input"
    ) {

        return;

    }


    if (
        state.finished
    ) {

        return;

    }


    const board =
        document.getElementById(
            "dartboard"
        );


    const rect =
        board.getBoundingClientRect();


    const x =
        (
            (event.clientX -
             rect.left) /
            rect.width
        ) * 220 - 110;


    const y =
        (
            (event.clientY -
             rect.top) /
            rect.height
        ) * 220 - 110;


    const radius =
        Math.sqrt(
            x*x + y*y
        );


    if (
        radius > 100
    ) {

        return;

    }


    /*
     * BULL
     */

    if (
        radius <= 7
    ) {

        scoreThrow(
            50,
            "BULL"
        );

        return;

    }


    if (
        radius <= 16
    ) {

        scoreThrow(
            25,
            "OUTER BULL"
        );

        return;

    }


    /*
     * 角度
     */

    let angle =
        Math.atan2(y, x)
        * 180 / Math.PI;


    angle += 90;


    if (
        angle < 0
    ) {

        angle += 360;

    }


    const index =
        Math.floor(
            (angle + 9) / 18
        ) % 20;


    const number =
        numbers[index];


    let multiplier = 1;

    let type = "SINGLE";


    if (
        radius >= 43 &&
        radius < 50
    ) {

        multiplier = 3;

        type = "TRIPLE";

    }
    else if (
        radius >= 94
    ) {

        multiplier = 2;

        type = "DOUBLE";

    }


    scoreThrow(
        number * multiplier,
        type + " " + number
    );

}


/*
========================================================
SCORE THROW
========================================================
*/

async function scoreThrow(
    points,
    label
) {

    const list =
        getPlayers();


    if (
        list.length === 0
    ) {

        return;

    }


    const current =
        list.find(
            p =>
                p.id ===
                state.currentPlayerId
        );


    if (!current) {

        return;

    }


    const before =
        Number(current.score);


    const after =
        before - points;


    let bust = false;

    let win = false;


    /*
     * BUST
     */

    if (
        after < 0
    ) {

        bust = true;

    }


    if (
        after === 1
    ) {

        bust = true;

    }


    /*
     * 0
     */

    if (
        after === 0
    ) {

        const doubleFinish =
            label.startsWith(
                "DOUBLE "
            );


        const bullFinish =
            label === "BULL";


        if (
            doubleFinish ||
            bullFinish
        ) {

            win = true;

        } else {

            bust = true;

        }

    }


    const actualScore =
        bust
            ? before
            : after;


    const nextThrow =
        state.throwNumber + 1;


    let nextPlayer =
        current.id;


    /*
     * 3投終了
     */

    if (
        !win &&
        (
            bust ||
            nextThrow >= 3
        )
    ) {

        const index =
            list.findIndex(
                p =>
                    p.id ===
                    current.id
            );


        nextPlayer =
            list[
                (index + 1) %
                list.length
            ].id;

    }


    const newState = {

        currentPlayerId:
            win
                ? current.id
                : nextPlayer,

        throwNumber:
            win
                ? nextThrow
                : (
                    bust ||
                    nextThrow >= 3
                        ? 0
                        : nextThrow
                ),

        lastScore:
            points,

        lastLabel:
            label,

        finished:
            win

    };


    const throwId =
        push(
            ref(
                db,
                "rooms/" +
                room +
                "/throws"
            )
        ).key;


    const updates = {};


    updates[
        "players/" +
        current.id +
        "/score"
    ] = actualScore;


    updates[
        "state"
    ] = newState;


    updates[
        "throws/" +
        throwId
    ] = {

        playerId:
            current.id,

        playerName:
            current.name,

        before,

        score:
            points,

        after:
            actualScore,

        label,

        bust,

        win,

        timestamp:
            Date.now()

    };


    try {

        await update(
            roomRef,
            updates
        );


        showHit(
            bust
                ? 0
                : points,

            bust
                ? "BUST"
                : label
        );


    } catch (error) {

        console.error(error);

    }

}


/*

HIT表示
========================================================
*/

let hitTimer;


function showHit(
    score,
    label
) {

    const hit =
        document.getElementById(
            "hit"
        );


    document.getElementById(
        "hitScore"
    ).textContent =
        score;


    document.getElementById(
        "hitLabel"
    ).textContent =
        label;


    hit.classList.add(
        "visible"
    );


    clearTimeout(
        hitTimer
    );


    hitTimer =
        setTimeout(
            () => {

                hit.classList.remove(
                    "visible"
                );

            },
            700
        );

}

/*

function renderOutput() {

            p =>

        );


    document.getElementById(
        "outputCurrent"

        "outputRoom"

    if (
        state.lastLabel
    ) {

        document.getElementById(
            "outputLast"
        ).textContent =
            `LAST: ${state.lastScore} / ${state.lastLabel}`;

    } else {

        document.getElementById(
            "outputLast"
        ).textContent =
            "-";

    }


    const container =
        document.getElementById(
            "playerList"
        );


    container.innerHTML = "";


    list.forEach(
        player => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "player";


            if (
                player.id ===
                state.currentPlayerId
            ) {

                div.classList.add(
                    "current"
                );

            }


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "playerName";


            name.textContent =
                player.name;


            const score =
                document.createElement(
                    "div"
                );


            score.className =
                "playerScore";


            score.textContent =
                player.score;


            div.appendChild(name);

            div.appendChild(score);

            container.appendChild(div);

        }
    );

/*
========================================================
DELETE
========================================================
*/

async function deletePlayer(id) {

    const list =
        getPlayers();


    if (
        list.length <= 1
    ) {

        alert(
            "最低1人必要です"
        );

        return;

    }


    const target =
        players[id];


    if (
        !confirm(
            target.name +
            "を削除しますか？"
        )
    ) {

        return;

    }


    const updates = {};


    updates[
        "players/" +
        id
    ] = null;


    /*
     * 現在のプレイヤーなら
     * 次の人へ
     */

    if (
        state.currentPlayerId === id
    ) {

        const index =
            list.findIndex(
                p =>
                    p.id === id
            );


        const next =
            list[
                (index + 1) %
                list.length
            ];


        state.currentPlayerId =
            next.id;


        state.throwNumber =
            0;


        updates.state =
            state;

    }


    await update(
        roomRef,
        updates
    );

}

async function resetGame() {

    const list =
        getPlayers();


    if (
        !list.length
    ) {

        return;

    }


    if (
        !confirm(
            "スコアをリセットしますか？"
        )
    ) {

        return;

    }


    const updates = {};


    list.forEach(
        player => {

            updates[
                "players/" +
                player.id +
                "/score"
            ] = 501;

        }
    );


    updates.state = {

        currentPlayerId:
            list[0].id,

        throwNumber: 0,

        lastScore: null,

        lastLabel: "",

        finished: false

    };


    await update(
        roomRef,
        updates
    );

}
