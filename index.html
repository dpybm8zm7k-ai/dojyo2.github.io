/* =========================================================
   BASIC
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100%;

/* =========================================================
   SCREEN
========================================================= */

.screen {

    height: 100%;

}

.screen.active {

========================================================= */

}

.deviceButtonSub {

.toast {

const $ = id =>

/* =========================================================
   ROOM NAME
========================================================= */

function sanitizeRoomName(name) {

    return name
        .trim()
        .replace(/[.#$/[\]]/g, "_")
        .replace(/\s+/g, "_")
        .toUpperCase();

}



/* =========================================================
   SCREEN
========================================================= */

function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(
            element =>
                element.classList.remove(
                    "active"
                )
        );

    screen.classList.add("active");

}



/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(message) {

    const toast =
        $("toast");

    toast.textContent =
        message;

    toast.classList.add("show");


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1600
        );

}



/* =========================================================
   GET PLAYERS
========================================================= */

function getPlayerArray() {

    return Object
        .entries(players)
        .map(
            ([id, player]) => ({
                id,
                ...player
            })
        )
        .sort(
            (a, b) =>
                Number(a.order) -
                Number(b.order)
        );

}



/* =========================================================
   START
========================================================= */

$("inputModeButton")
    .addEventListener(
        "click",
        () => startApplication("input")
    );


$("outputModeButton")
    .addEventListener(
        "click",
        () => startApplication("output")
    );



async function startApplication(mode) {

    const rawRoom =
        $("roomInput").value;


    roomName =
        sanitizeRoomName(
            rawRoom
        );


    if (!roomName) {

        $("startError")
            .textContent =
                "ルーム名を入力してください。";

        return;

    }


    deviceMode =
        mode;


    gameType =
        Number(
            $("gameType").value
        );


    $("startError")
        .textContent = "";


    try {

        await connectToRoom();


        if (
            deviceMode === "input"
        ) {

            showScreen(
                $("inputScreen")
            );


            $("inputRoomName")
                .textContent =
                roomName;


            /*
               Firebase接続後に
               ダーツボードを生成
            */

            buildDartboard();

            updateInputUI();


        } else {

            showScreen(
                $("outputScreen")
            );


            $("outputRoomName")
                .textContent =
                "ROOM: " + roomName;


            updateOutputUI();

        }


    } catch (error) {

        console.error(error);


        $("startError")
            .textContent =
            "Firebaseに接続できません。Firebaseの設定とDatabase Rulesを確認してください。";

    }

}



/* =========================================================
   CONNECT ROOM
========================================================= */

async function connectToRoom() {


    gameRef =
        ref(
            db,
            `rooms/${roomName}`
        );


    playersRef =
        ref(
            db,
            `rooms/${roomName}/players`
        );


    stateRef =
        ref(
            db,
            `rooms/${roomName}/state`
        );


    throwsRef =
        ref(
            db,
            `rooms/${roomName}/throws`
        );


    /*
       ルーム存在確認
    */

    const snapshot =
        await get(
            gameRef
        );


    /*
       新規ルーム
    */

    if (!snapshot.exists()) {

        await createNewRoom();

    } else {

        /*
           既存ルームでは
           Firebase側のゲーム形式を優先
        */

        const data =
            snapshot.val();

        if (
            data.gameType
        ) {

            gameType =
                Number(
                    data.gameType
                );

        }

    }


    /*
       PLAYERS監視
    */

    onValue(
        playersRef,
        snapshot => {

            players =
                snapshot.val() || {};


            if (
                deviceMode === "input"
            ) {

                renderInputPlayers();

                updateInputUI();

            }


            if (
                deviceMode === "output"
            ) {

                renderOutputPlayers();

                updateOutputUI();

            }

        }
    );


    /*
       STATE監視
    */

    onValue(
        stateRef,
        snapshot => {

            const value =
                snapshot.val();


            if (!value)
                return;


            currentState =
                value;


            if (
                deviceMode === "input"
            ) {

                updateInputUI();

                updateHitDisplay();

            }


            if (
                deviceMode === "output"
            ) {

                updateOutputUI();

            }

        }
    );


    /*
       Firebase接続状態
    */

    onValue(
        ref(
            db,
            ".info/connected"
        ),
        snapshot => {

            const connected =
                snapshot.val() === true;


            if (
                deviceMode === "output"
            ) {

                const status =
                    $("connectionStatus");


                status.textContent =
                    connected
                        ? "● CONNECTED"
                        : "○ OFFLINE";


                status.classList.toggle(
                    "connected",
                    connected
                );

            }

        }
    );

}

/* =========================================================
   DARTBOARD
========================================================= */

const BOARD_NUMBERS = [

    20,
    1,
    18,
    4,
    13,
    6,
    10,
    15,
    2,
    17,
    3,
    19,
    7,
    16,
    8,
    11,
    14,
    9,
    12,
    5

];


const SVG_NS =
    "http://www.w3.org/2000/svg";


function polar(
    radius,
    angle
) {

    const rad =
        (
            angle - 90
        ) *
        Math.PI /
        180;


    return {

        x:
            radius *
            Math.cos(rad),

        y:
            radius *
            Math.sin(rad)

    };

}



function sectorPath(
    innerRadius,
    outerRadius,
    startAngle,
    endAngle
) {

    const p1 =
        polar(
            innerRadius,
            startAngle
        );

    const p2 =
        polar(
            outerRadius,
            startAngle
        );

    const p3 =
        polar(
            outerRadius,
            endAngle
        );

    const p4 =
        polar(
            innerRadius,
            endAngle
        );


    return [

        `M ${p1.x} ${p1.y}`,

        `L ${p2.x} ${p2.y}`,

        `A ${outerRadius} ${outerRadius} 0 0 1 ${p3.x} ${p3.y}`,

        `L ${p4.x} ${p4.y}`,

        `A ${innerRadius} ${innerRadius} 0 0 0 ${p1.x} ${p1.y}`,

        "Z"

    ].join(" ");

}



/* =========================================================
   CREATE SEGMENT
========================================================= */

function addSegment(
    svg,
    innerRadius,
    outerRadius,
    startAngle,
    endAngle,
    number,
    type,
    index
) {

    const path =
        document.createElementNS(
            SVG_NS,
            "path"
        );


    path.setAttribute(
        "d",
        sectorPath(
            innerRadius,
            outerRadius,
            startAngle,
            endAngle
        )
    );


    path.classList.add(
        "boardSegment"
    );


    /*
       白黒を交互にする
    */

    const even =
        index % 2 === 0;


    let fill;


    if (
        type === "triple" ||
        type === "double"
    ) {

        fill =
            even
                ? "#b8b8b8"
                : "#292929";

    } else {

        fill =
            even
                ? "#191919"
                : "#555555";

    }


    path.setAttribute(
        "fill",
        fill
    );


    path.dataset.number =
        String(number);

    path.dataset.type =
        type;


    path.addEventListener(
        "pointerdown",
        handleBoardHit
    );


    svg.appendChild(path);

}



/* =========================================================
   BUILD BOARD
========================================================= */

function buildDartboard() {

    const svg =
        $("dartboard");


    /*
       既存ボード削除
    */

    svg.innerHTML = "";


    /*
       外周
    */

    const outer =
        document.createElementNS(
            SVG_NS,
            "circle"
        );


    outer.setAttribute(
        "cx",
        0
    );

    outer.setAttribute(
        "cy",
        0
    );

    outer.setAttribute(
        "r",
        104
    );

    outer.setAttribute(
        "fill",
        "#050505"
    );

    outer.setAttribute(
        "stroke",
        "#777"
    );

    outer.setAttribute(
        "stroke-width",
        "1"
    );


    svg.appendChild(
        outer
    );


    /*
       セグメント寸法

       Bull          0 - 7
       Single inner  7 - 38
       Triple        38 - 50
       Single outer  50 - 94
       Double        94 - 100
    */

    const angle =
        360 / 20;


    BOARD_NUMBERS.forEach(
        (number, index) => {

            const center =
                index * angle;


            const start =
                center -
                angle / 2;


            const end =
                center +
                angle / 2;


            /*
               Inner Single
            */

            addSegment(
                svg,
                7,
                38,
                start,
                end,
                number,
                "single",
                index
            );


            /*
               Triple
            */

            addSegment(
                svg,
                38,
                50,
                start,
                end,
                number,
                "triple",
                index
            );


            /*
               Outer Single
            */

            addSegment(
                svg,
                50,
                94,
                start,
                end,
                number,
                "single",
                index
            );


            /*
               Double
            */

            addSegment(
                svg,
                94,
                100,
                start,
                end,
                number,
                "double",
                index
            );

        }
    );


    /*
       リング
    */

    [
        7,
        38,
        50,
        94,
        100
    ].forEach(
        radius => {

            const ring =
                document.createElementNS(
                    SVG_NS,
                    "circle"
                );


            ring.setAttribute(
                "cx",
                0
            );

            ring.setAttribute(
                "cy",
                0
            );

            ring.setAttribute(
                "r",
                radius
            );

            ring.classList.add(
                "boardRing"
            );


            svg.appendChild(
                ring
            );

        }
    );


    /*
       Outer Bull
    */

    const outerBull =
        document.createElementNS(
            SVG_NS,
            "circle"
        );


    outerBull.setAttribute(
        "cx",
        0
    );

    outerBull.setAttribute(
        "cy",
        0
    );

    outerBull.setAttribute(
        "r",
        16
    );

    outerBull.setAttribute(
        "fill",
        "#222"
    );

    outerBull.setAttribute(
        "stroke",
        "#050505"
    );

    outerBull.setAttribute(
        "stroke-width",
        "1"
    );


    outerBull.dataset.type =
        "outerBull";

    outerBull.dataset.number =
        "25";


    outerBull.addEventListener(
        "pointerdown",
        handleBoardHit
    );


    svg.appendChild(
        outerBull
    );


    /*
       Bull
    */

    const bull =
        document.createElementNS(
            SVG_NS,
            "circle"
        );


    bull.setAttribute(
        "cx",
        0
    );

    bull.setAttribute(
        "cy",
        0
    );

    bull.setAttribute(
        "r",
        7
    );

    bull.setAttribute(
        "fill",
        "#888"
    );


    bull.dataset.type =
        "bull";

    bull.dataset.number =
        "50";


    bull.addEventListener(
        "pointerdown",
        handleBoardHit
    );


    svg.appendChild(
        bull
    );


    /*
       数字
    */

    BOARD_NUMBERS.forEach(
        (number, index) => {

            const center =
                index * angle;


            const position =
                polar(
                    108,
                    center
                );


            const text =
                document.createElementNS(
                    SVG_NS,
                    "text"
                );


            text.setAttribute(
                "x",
                position.x
            );

            text.setAttribute(
                "y",
                position.y
            );


            text.classList.add(
                "boardNumber"
            );


            text.textContent =
                number;


            svg.appendChild(
                text
            );

        }
    );

}



/* =========================================================
   BOARD HIT
========================================================= */

async function handleBoardHit(event) {

    event.preventDefault();


    const element =
        event.currentTarget;


    const type =
        element.dataset.type;


    const number =
        Number(
            element.dataset.number
        );


    let points = 0;

    let label = "";


    if (
        type === "bull"
    ) {

        points = 50;

        label = "BULL";

    }

    else if (
        type === "outerBull"
    ) {

        points = 25;

        label = "25";

    }

    else if (
        type === "double"
    ) {

        points =
            number * 2;

        label =
            `DOUBLE ${number}`;

    }

    else if (
        type === "triple"
    ) {

        points =
            number * 3;

        label =
            `TRIPLE ${number}`;

    }

    else {

        points =
            number;

        label =
            `SINGLE ${number}`;

    }


    await registerThrow(
        points,
        label
    );

}



/* =========================================================
   REGISTER THROW
========================================================= */

async function registerThrow(
    points,
    label
) {

    const playerArray =
        getPlayerArray();


    if (
        playerArray.length === 0
    ) {

        showToast(
            "プレイヤーがいません"
        );

        return;

    }


    let currentIndex =
        Number(
            currentState.currentPlayer
        );


    if (
        !Number.isInteger(
            currentIndex
        )
    ) {

        currentIndex = 0;

    }


    if (
        currentIndex >=
        playerArray.length
    ) {

        currentIndex = 0;

    }


    const player =
        playerArray[currentIndex];


    const before =
        Number(
            player.score
        );


    const throwIndex =
        Number(
            currentState.currentThrow
        ) || 0;


    let after =
        before - points;


    let bust = false;

    let finished = false;


    /*
       Double Out方式
    */

    if (
        after < 0
    ) {

        bust = true;

        after = before;

    }

    else if (
        after === 1
    ) {

        bust = true;

        after = before;

    }

    else if (
        after === 0 &&
        !isValidFinish(label)
    ) {

        bust = true;

        after = before;

    }

    else if (
        after === 0
    ) {

        finished = true;

    }


    /*
       履歴ID
    */

    const throwRef =
        push(
            throwsRef
        );


    const throwId =
        throwRef.key;


    const throwData = {

        playerId:
            player.id,

        playerIndex:
            currentIndex,

        throwNumber:
            throwIndex + 1,

        points:
            points,

        label:
            label,

        before:
            before,

        after:
            after,

        bust:
            bust,

        finished:
            finished,

        timestamp:
            Date.now()

    };


    /*
       次の状態
    */

    let nextPlayer =
        currentIndex;

    let nextThrow =
        throwIndex + 1;


    /*
       ゲーム終了
    */

    if (
        finished
    ) {

        nextPlayer =
            currentIndex;

        nextThrow =
            3;

    }

    /*
       Bustまたは3投終了
    */

    else if (
        bust ||
        throwIndex >= 2
    ) {

        nextPlayer =
            (
                currentIndex + 1
            ) %
            playerArray.length;

        nextThrow =
            0;

    }


    /*
       Firebaseを一括更新

       これが重要。
       scoreとstateを同時に更新するため、
       他端末で中途半端な状態になりにくい。
    */

    const updates = {};


    updates[
        `rooms/${roomName}/players/${player.id}/score`
    ] =
        after;


    updates[
        `rooms/${roomName}/state`
    ] = {

        currentPlayer:
            nextPlayer,

        currentThrow:
            nextThrow,

        lastHit: {

            points:
                points,

            label:
                label,

            bust:
                bust,

            finished:
                finished,

            timestamp:
                Date.now()

        },

        lastThrowId:
            throwId,

        gameStarted:
            true

    };


    updates[
        `rooms/${roomName}/throws/${throwId}`
    ] =
        throwData;


    /*
       UNDO用ローカル履歴
    */

    undoStack.push({

        throwId:
            throwId,

        playerId:
            player.id,

        before:
            before,

        stateBefore: {

            currentPlayer:
                currentState.currentPlayer,

            currentThrow:
                currentState.currentThrow,

            lastHit:
                currentState.lastHit

        }

    });


    /*
       Firebaseへ送信
    */

    await update(
        ref(db),
        updates
    );


    /*
       表示
    */

    if (bust) {

        showToast(
            "BUST"
        );

    }

    else if (finished) {

        showToast(
            "FINISH"
        );

    }

    else {

        showToast(
            `${label}  +${points}`
        );

    }

}



/* =========================================================
   VALID FINISH
========================================================= */

function isValidFinish(label) {

    if (
        label === "BULL"
    ) {

        return true;

    }


    return label.startsWith(
        "DOUBLE "
    );

}

/* =========================================================
   DELETE PLAYER
========================================================= */

async function deletePlayer(id) {

    const playerArray =
        getPlayerArray();


    if (
        playerArray.length <= 1
    ) {

        showToast(
            "最低1人必要です"
        );

        return;

    }


    const target =
        players[id];


    await remove(
        ref(
            db,
            `rooms/${roomName}/players/${id}`
        )
    );


    /*
       orderを詰める
    */

    const remaining =
        playerArray
            .filter(
                player =>
                    player.id !== id
            );


    const updates = {};


    remaining.forEach(
        (player, index) => {

            updates[
                `rooms/${roomName}/players/${player.id}/order`
            ] =
                index;

        }
    );


    /*
       現在プレイヤーを安全な値へ
    */

    let newCurrent =
        Number(
            currentState.currentPlayer
        ) || 0;


    if (
        newCurrent >=
        remaining.length
    ) {

        newCurrent = 0;

    }


    updates[
        `rooms/${roomName}/state/currentPlayer`
    ] =
        newCurrent;


    await update(
        ref(db),
        updates
    );


    showToast(
        `${target.name} を削除しました`
    );

}

async function undoLast() {

    if (
        undoStack.length === 0
    ) {

        showToast(
            "取り消せる投げがありません"
        );

        return;

    }


    const history =
        undoStack.pop();


    const player =
        players[
            history.playerId
        ];


    if (!player) {

        return;

    }


    const updates = {};


    updates[
        `rooms/${roomName}/players/${history.playerId}/score`
    ] =
        history.before;


    updates[
        `rooms/${roomName}/state`
    ] = {

        currentPlayer:
            history.stateBefore.currentPlayer,

        currentThrow:
            history.stateBefore.currentThrow,

        lastHit:
            history.stateBefore.lastHit || null,

        lastThrowId:
            null,

        gameStarted:
            true

    };


    await update(
        ref(db),
        updates
    );


    await remove(
        ref(
            db,
            `rooms/${roomName}/throws/${history.throwId}`
        )
    );


    showToast(
        "UNDO"
    );

}



/* =========================================================
   MENU
========================================================= */

function openDrawer() {

    $("drawer")
        .classList.add(
            "open"
        );


    $("drawerBackdrop")
        .classList.add(
            "open"
        );

}


function closeDrawer() {

    $("drawer")
        .classList.remove(
            "open"
        );


    $("drawerBackdrop")
        .classList.remove(
            "open"
        );

}


$("menuButton")
    .addEventListener(
        "click",
        openDrawer
    );


$("closeMenuButton")
    .addEventListener(
        "click",
        closeDrawer
    );


$("drawerBackdrop")
    .addEventListener(
        "click",
        closeDrawer
    );



/* =========================================================
   OUTPUT
========================================================= */

function updateOutputUI() {

    const playerArray =
        getPlayerArray();


    if (
        playerArray.length === 0
    ) {

        $("outputCurrentPlayer")
            .textContent =
            "NO PLAYER";

        return;

    }


    let index =
        Number(
            currentState.currentPlayer
        );


    if (
        index < 0 ||
        index >= playerArray.length
    ) {

        index = 0;

    }


    const player =
        playerArray[index];


    $("outputCurrentPlayer")
        .textContent =
        player.name;


    const throwNumber =
        Number(
            currentState.currentThrow
        ) || 0;


    if (
        Number(player.score) === 0
    ) {

        $("outputThrow")
            .textContent =
            "FINISHED";

    }

    else {

        $("outputThrow")
            .textContent =
            `${throwNumber + 1} THROW / 3`;

    }


    const hit =
        currentState.lastHit;


    if (!hit) {

        $("outputLastHit")
            .textContent =
            "READY";

        return;

    }


    if (
        hit.bust
    ) {

        $("outputLastHit")
            .textContent =
            "BUST";

    }

    else if (
        hit.finished
    ) {

        $("outputLastHit")
            .textContent =
            "FINISH";

    }

    else {

        $("outputLastHit")
            .textContent =
            `+${hit.points}`;

    }

}



/* =========================================================
   OUTPUT PLAYER LIST
========================================================= */

function renderOutputPlayers() {

    const container =
        $("outputPlayers");


    container.innerHTML = "";


    const playerArray =
        getPlayerArray();


    playerArray.forEach(
        (player, index) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "outputPlayer";


            if (
                index ===
                Number(
                    currentState.currentPlayer
                )
            ) {

                row.classList.add(
                    "current"
                );

            }


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "outputPlayerNumber";


            number.textContent =
                String(
                    index + 1
                ).padStart(
                    2,
                    "0"
                );


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "outputPlayerName";


            name.textContent =
                player.name;


            const score =
                document.createElement(
                    "div"
                );


            score.className =
                "outputPlayerScore";


            score.textContent =
                player.score;


            row.appendChild(
                number
            );

            row.appendChild(
                name
            );

            row.appendChild(
                score
            );


            container.appendChild(
                row
            );

        }
    );

}



/* =========================================================
   CONFIRM
========================================================= */

let confirmAction =
    null;


function openConfirm(
    title,
    message,
    action
) {

    $("confirmTitle")
        .textContent =
        title;


    $("confirmMessage")
        .textContent =
        message;


    confirmAction =
        action;


    $("confirmOverlay")
        .classList.add(
            "open"
        );

}


function closeConfirm() {

    $("confirmOverlay")
        .classList.remove(
            "open"
        );


    confirmAction =
        null;

}


$("confirmCancel")
    .addEventListener(
        "click",
        closeConfirm
    );


$("confirmOK")
    .addEventListener(
        "click",
        async () => {

            if (
                confirmAction
            ) {

                const action =
                    confirmAction;


                confirmAction =
                    null;


                await action();

            }

        }
    );



/* =========================================================
   PREVENT UNWANTED ZOOM
========================================================= */

document.addEventListener(
    "gesturestart",
    event => {
        event.preventDefault();
    }
);


document.addEventListener(
    "dblclick",
    event => {
        event.preventDefault();
    },
    {
        passive: false
    }
);


/* =========================================================
   KEYBOARD SHORTCUT
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeDrawer();

            closeConfirm();

        }

    }
);


</script>
