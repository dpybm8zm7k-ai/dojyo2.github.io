<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>DARTS SCORE</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   共通
========================= */

.screen {
    position: fixed;
    inset: 0;
    display: none;
}

.screen.active {
    display: flex;
}

/* =========================
   START
========================= */

#startScreen {
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.startBox {
    width: min(500px, 100%);
    padding: 35px 25px;
    border: 1px solid #333;
    background: #0d0d0d;
    border-radius: 18px;
}

.logo {
    text-align: center;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 5px;
    margin-bottom: 35px;
}

.inputLabel {
    display: block;
    margin-bottom: 8px;
    color: #aaa;
    font-size: 14px;
}

.roomInput {
    width: 100%;
    height: 55px;
    border: 1px solid #444;
    border-radius: 10px;
    background: #181818;
    color: white;
    padding: 0 15px;
    outline: none;
    margin-bottom: 25px;
}

.roomInput:focus {
    border-color: white;
}

.modeButtons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.modeButton {
    height: 70px;
    border: 1px solid #444;
    border-radius: 12px;
    background: #151515;
    color: white;
    font-size: 20px;
    font-weight: bold;
}

.modeButton:active {
    transform: scale(.97);
    background: #282828;
}

.connection {
    text-align: center;
    margin-top: 20px;
    color: #777;
    font-size: 13px;
}

/* =========================
   INPUT
========================= */

#inputScreen {
    flex-direction: column;
}

.inputHeader {
    height: 65px;
    min-height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    background: #0b0b0b;
    border-bottom: 1px solid #252525;
    z-index: 20;
}

.headerLeft,
.headerRight {
    display: flex;
    align-items: center;
    gap: 8px;
}

.headerButton {
    height: 44px;
    min-width: 44px;
    padding: 0 12px;
    border: 1px solid #333;
    border-radius: 9px;
    background: #171717;
    color: white;
}

.headerButton:active {
    background: #333;
}

.turnInfo {
    text-align: center;
    line-height: 1.1;
}

.turnPlayer {
    font-size: 17px;
    font-weight: 800;
}

.turnThrow {
    margin-top: 4px;
    color: #888;
    font-size: 12px;
}

/* =========================
   BOARD
========================= */

.boardArea {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #020202;
    touch-action: none;
}

#dartboard {
    display: block;
    width: min(96vw, 96vh);
    height: min(96vw, 96vh);
    max-width: 100%;
    max-height: 100%;
    touch-action: none;
}

.hitDisplay {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    text-align: center;
    opacity: 0;
    transition: opacity .12s;
}

.hitDisplay.show {
    opacity: 1;
}

.hitScore {
    font-size: clamp(40px, 9vw, 80px);
    font-weight: 900;
    text-shadow: 0 3px 15px #000;
}

.hitLabel {
    font-size: 15px;
    color: #ddd;
}

/* =========================
   OUTPUT
========================= */

#outputScreen {
    flex-direction: column;
}

.outputHeader {
    height: 75px;
    min-height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid #252525;
    background: #0b0b0b;
}

.outputTitle {
    font-size: 24px;
    font-weight: 900;
}

.outputRoom {
    color: #888;
    font-size: 13px;
}

.outputMain {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px;
}

.outputTurn {
    text-align: center;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid #333;
    border-radius: 15px;
    background: #101010;
}

.outputTurnSmall {
    color: #888;
    font-size: 13px;
}

.outputTurnPlayer {
    margin-top: 5px;
    font-size: 34px;
    font-weight: 900;
}

.outputLast {
    margin-top: 10px;
    color: #aaa;
}

.players {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.player {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 75px;
    padding: 12px 18px;
    border: 1px solid #2d2d2d;
    border-radius: 13px;
    background: #101010;
}

.player.current {
    border-color: white;
    background: #181818;
}

.playerName {
    font-size: 19px;
    font-weight: 700;
}

.playerNumber {
    color: #666;
    font-size: 12px;
    margin-bottom: 3px;
}

.playerScore {
    font-size: 38px;
    font-weight: 900;
}

/* =========================
   MENU
========================= */

.overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    background: rgba(0,0,0,.7);
}

.overlay.show {
    display: block;
}

.menu {
    position: absolute;
    right: 10px;
    top: 75px;
    width: min(350px, calc(100vw - 20px));
    max-height: calc(100vh - 90px);
    overflow-y: auto;
    background: #101010;
    border: 1px solid #333;
    border-radius: 14px;
    padding: 15px;
}

.menuTitle {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 15px;
}

.menuButton {
    width: 100%;
    min-height: 50px;
    margin-bottom: 8px;
    border: 1px solid #333;
    border-radius: 9px;
    background: #191919;
    color: white;
    text-align: left;
    padding: 0 15px;
}

.menuButton:active {
    background: #303030;
}

.menuButton.danger {
    color: #ff7777;
}

.menuPlayer {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
}

.menuPlayer span {
    flex: 1;
    display: flex;
    align-items: center;
    padding-left: 10px;
    background: #181818;
    border-radius: 8px;
}

.deletePlayer {
    width: 48px;
    border: 1px solid #333;
    border-radius: 8px;
    background: #181818;
    color: #ff7777;
}

/* =========================
   DIALOG
========================= */

.dialog {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.75);
}

.dialog.show {
    display: flex;
}

.dialogBox {
    width: min(400px, 100%);
    background: #111;
    border: 1px solid #444;
    border-radius: 15px;
    padding: 25px;
}

.dialogTitle {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 15px;
}

.dialogInput {
    width: 100%;
    height: 50px;
    padding: 0 12px;
    background: #1b1b1b;
    border: 1px solid #444;
    border-radius: 8px;
    color: white;
    outline: none;
    margin-bottom: 15px;
}

.dialogButtons {
    display: flex;
    gap: 8px;
}

.dialogButtons button {
    flex: 1;
    height: 48px;
    border: 1px solid #333;
    border-radius: 8px;
    background: #191919;
    color: white;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .logo {
        font-size: 32px;
    }

    .inputHeader {
        height: 58px;
        min-height: 58px;
    }

    .headerButton {
        height: 40px;
        min-width: 40px;
        padding: 0 9px;
    }

    .turnPlayer {
        font-size: 15px;
    }

    .outputTurnPlayer {
        font-size: 28px;
    }
}
</style>
</head>

<!-- ======================================

<script type="module">

/* =====================================================
   Firebase
===================================================== */

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get,
    set,
    update,
    push,
    onValue
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/*
========================================================
   ↓↓↓ ここだけ自分のFirebase設定に変更 ↓↓↓
========================================================
*/

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    databaseURL:
        "https://YOUR_PROJECT-default-rtdb.firebaseio.com",

    projectId:
        "YOUR_PROJECT",

    storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_APP_ID"
};


/* =====================================================
   Firebase初期化
===================================================== */

let db = null;

try {

    const app = initializeApp(firebaseConfig);

    db = getDatabase(app);

    document.getElementById("connectionText")
        .textContent = "Firebase準備完了";

} catch (error) {

    console.error(error);

    document.getElementById("connectionText")
        .textContent = "Firebase設定を確認してください";
}


/* =====================================================
   State
===================================================== */

let roomName = "";

let mode = "";

let gameType = 501;

let players = {};

let gameState = {

    currentPlayerId: null,

    throwNumber: 0,

    lastScore: 0,

    lastLabel: "",

    gameFinished: false
};

let roomRef = null;

let playersRef = null;

let stateRef = null;

let throwsRef = null;


/* =====================================================
   DOM
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const inputScreen =
    document.getElementById("inputScreen");

const outputScreen =
    document.getElementById("outputScreen");

const roomInput =
    document.getElementById("roomInput");

const dartboard =
    document.getElementById("dartboard");

const menuOverlay =
    document.getElementById("menuOverlay");

const playerDialog =
    document.getElementById("playerDialog");


/* =====================================================
   Utility
===================================================== */

function showScreen(screen) {

    startScreen.classList.remove("active");

    inputScreen.classList.remove("active");

    outputScreen.classList.remove("active");

    screen.classList.add("active");
}


function cleanRoomName(name) {

    return name
        .trim()
        .replace(/[.#$[\]/]/g, "_")
        .replace(/\s+/g, "_")
        .substring(0, 50);
}


function getPlayerArray() {

    return Object.entries(players)
        .map(([id, player]) => ({
            id,
            ...player
        }))
        .sort((a, b) =>
            (a.order || 0) - (b.order || 0)
        );
}


/* =====================================================
   START
===================================================== */

document
    .getElementById("inputModeButton")
    .addEventListener("click", () => {

        start("input");

    });


document
    .getElementById("outputModeButton")
    .addEventListener("click", () => {

        start("output");

    });


async function start(selectedMode) {

    roomName =
        cleanRoomName(roomInput.value);

    if (!roomName) {

        alert("ROOM NAMEを入力してください");

        return;
    }

    mode = selectedMode;

    if (!db) {

        alert(
            "Firebaseが初期化されていません。\n" +
            "コード内のfirebaseConfigを確認してください。"
        );

        return;
    }


    roomRef =
        ref(db, "rooms/" + roomName);

    playersRef =
        ref(db, "rooms/" + roomName + "/players");

    stateRef =
        ref(db, "rooms/" + roomName + "/state");

    throwsRef =
        ref(db, "rooms/" + roomName + "/throws");


    await connectRoom();

}


/* =====================================================
   ROOM接続
===================================================== */

async function connectRoom() {

    try {

        const snapshot =
            await get(roomRef);


        if (!snapshot.exists()) {

            players = {

                player_1: {

                    name: "PLAYER 1",

                    score: gameType,

                    order: 0
                },

                player_2: {

                    name: "PLAYER 2",

                    score: gameType,

                    order: 1
                }
            };


            gameState = {

                currentPlayerId: "player_1",

                throwNumber: 0,

                lastScore: 0,

                lastLabel: "",

                gameFinished: false
            };


            await set(roomRef, {

                gameType,

                players,

                state: gameState,

                throws: {}

            });

        } else {

            const data =
                snapshot.val();

            gameType =
                data.gameType || 501;

        }


        startRealtimeListeners();


        if (mode === "input") {

            showScreen(inputScreen);

            /*
             * Firebase接続とは独立して
             * ボードを先に構築
             */
            buildDartboard();

        } else {

            showScreen(outputScreen);

        }


    } catch (error) {

        console.error(error);

        alert(
            "ROOMへの接続に失敗しました。\n\n" +
            error.message
        );

    }

}


/* =====================================================
   REALTIME DATABASE LISTENER
===================================================== */

function startRealtimeListeners() {


    onValue(playersRef, snapshot => {

        players =
            snapshot.val() || {};

        renderInputHeader();

        renderOutput();

        renderMenu();

    });


    onValue(stateRef, snapshot => {

        const data =
            snapshot.val();

        if (data) {

            gameState = {

                ...gameState,

                ...data

            };

        }

        renderInputHeader();

        renderOutput();

    });

}


/* =====================================================
   DARTBOARD
===================================================== */

const BOARD_NUMBERS = [

    20, 1, 18, 4, 13,
    6, 10, 15, 2, 17,
    3, 19, 7, 16, 8,
    11, 14, 9, 12, 5

];


function polar(radius, angle) {

    const rad =
        angle * Math.PI / 180;

    return {

        x: radius * Math.cos(rad),

        y: radius * Math.sin(rad)

    };

}


function pathSector(
    r1,
    r2,
    a1,
    a2
) {

    const p1 =
        polar(r1, a1);

    const p2 =
        polar(r2, a1);

    const p3 =
        polar(r2, a2);

    const p4 =
        polar(r1, a2);

    const large =
        Math.abs(a2 - a1) > 180
            ? 1
            : 0;

    return `
        M ${p1.x} ${p1.y}
        L ${p2.x} ${p2.y}
        A ${r2} ${r2} 0 ${large} 1
          ${p3.x} ${p3.y}
        L ${p4.x} ${p4.y}
        A ${r1} ${r1} 0 ${large} 0
          ${p1.x} ${p1.y}
        Z
    `;

}


function createSvgElement(
    tag,
    attributes = {}
) {

    const element =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            tag
        );

    for (
        const [key, value]
        of Object.entries(attributes)
    ) {

        element.setAttribute(
            key,
            value
        );

    }

    return element;
}


function buildDartboard() {

    dartboard.innerHTML = "";


    /* 外側背景 */

    const background =
        createSvgElement(
            "circle",
            {
                cx: 0,
                cy: 0,
                r: 100,
                fill: "#111",
                stroke: "#555",
                "stroke-width": 2
            }
        );

    dartboard.appendChild(background);


    /*
     * セグメント
     *
     * 重要:
     * セグメントを一番上に置く。
     * 後から円を重ねてタップ領域を
     * 邪魔しない。
     */

    for (
        let i = 0;
        i < 20;
        i++
    ) {

        const center =
            -90 + i * 18;

        const number =
            BOARD_NUMBERS[i];

        const singleInner =
            createSvgElement(
                "path",
                {
                    d: pathSector(
                        16,
                        43,
                        center - 8.5,
                        center + 8.5
                    ),
                    fill:
                        i % 2 === 0
                            ? "#242424"
                            : "#090909",
                    stroke: "#555",
                    "stroke-width": .7,
                    "data-number": number,
                    "data-region": "single"
                }
            );


        const triple =
            createSvgElement(
                "path",
                {
                    d: pathSector(
                        43,
                        50,
                        center - 8.5,
                        center + 8.5
                    ),
                    fill: "#777",
                    stroke: "#222",
                    "stroke-width": .7,
                    "data-number": number,
                    "data-region": "triple"
                }
            );


        const singleOuter =
            createSvgElement(
                "path",
                {
                    d: pathSector(
                        50,
                        94,
                        center - 8.5,
                        center + 8.5
                    ),
                    fill:
                        i % 2 === 0
                            ? "#242424"
                            : "#090909",
                    stroke: "#555",
                    "stroke-width": .7,
                    "data-number": number,
                    "data-region": "single"
                }
            );


        const double =
            createSvgElement(
                "path",
                {
                    d: pathSector(
                        94,
                        100,
                        center - 8.5,
                        center + 8.5
                    ),
                    fill: "#aaa",
                    stroke: "#222",
                    "stroke-width": .7,
                    "data-number": number,
                    "data-region": "double"
                }
            );


        dartboard.appendChild(singleInner);

        dartboard.appendChild(triple);

        dartboard.appendChild(singleOuter);

        dartboard.appendChild(double);

    }


    /* Bull */

    const outerBull =
        createSvgElement(
            "circle",
            {
                cx: 0,
                cy: 0,
                r: 16,
                fill: "#666",
                stroke: "#222",
                "stroke-width": 1,
                "data-region": "outerBull"
            }
        );


    const bull =
        createSvgElement(
            "circle",
            {
                cx: 0,
                cy: 0,
                r: 7,
                fill: "#aaa",
                stroke: "#222",
                "stroke-width": 1,
                "data-region": "bull"
            }
        );


    dartboard.appendChild(outerBull);

    dartboard.appendChild(bull);


    /*
     * グリッド線
     *
     * pointer-events:none
     * にすることでタップを邪魔しない。
     */

    for (
        let i = 0;
        i < 20;
        i++
    ) {

        const angle =
            (-90 + i * 18) *
            Math.PI / 180;

        const x =
            100 * Math.cos(angle);

        const y =
            100 * Math.sin(angle);

        const line =
            createSvgElement(
                "line",
                {
                    x1: 0,
                    y1: 0,
                    x2: x,
                    y2: y,
                    stroke: "#444",
                    "stroke-width": .5,
                    "pointer-events": "none"
                }
            );

        dartboard.appendChild(line);

    }


    /* 数字 */

    for (
        let i = 0;
        i < 20;
        i++
    ) {

        const angle =
            (-90 + i * 18) *
            Math.PI / 180;

        const radius = 106;

        const x =
            radius * Math.cos(angle);

        const y =
            radius * Math.sin(angle);

        const text =
            createSvgElement(
                "text",
                {
                    x,
                    y: y + 4,
                    "text-anchor": "middle",
                    fill: "#fff",
                    "font-size": 8,
                    "font-weight": "bold",
                    "pointer-events": "none"
                }
            );

        text.textContent =
            BOARD_NUMBERS[i];

        dartboard.appendChild(text);

    }


    /*
     * ボード全体にイベントを設定
     *
     * SVGの各パーツに依存せず、
     * 「タップ座標 → 得点」
     * で判定する。
     */

    dartboard.addEventListener(
        "pointerdown",
        handleBoardPointer
    );

}


/* =====================================================
   BOARD TAP
===================================================== */

function handleBoardPointer(event) {

    event.preventDefault();

    if (
        mode !== "input" ||
        gameState.gameFinished
    ) {
        return;
    }


    const rect =
        dartboard.getBoundingClientRect();


    /*
     * SVG viewBox
     * -110 ～ +110
     */

    const x =
        ((event.clientX - rect.left) /
            rect.width) * 220 - 110;

    const y =
        ((event.clientY - rect.top) /
            rect.height) * 220 - 110;


    const radius =
        Math.sqrt(x * x + y * y);


    if (radius > 100) {

        return;

    }


    /* Bull */

    if (radius <= 7) {

        registerThrow(
            50,
            "BULL"
        );

        return;

    }


    if (radius <= 16) {

        registerThrow(
            25,
            "OUTER BULL"
        );

        return;

    }


    /*
     * 角度
     */

    let angle =
        Math.atan2(y, x) *
        180 / Math.PI;


    angle += 90;


    if (angle < 0) {

        angle += 360;

    }


    /*
     * 20を中心にして
     * 18度ずつ
     */

    const index =
        Math.floor(
            (angle + 9) / 18
        ) % 20;


    const number =
        BOARD_NUMBERS[index];


    let multiplier = 1;

    let region = "SINGLE";


    if (
        radius >= 43 &&
        radius <= 50
    ) {

        multiplier = 3;

        region = "TRIPLE";

    }
    else if (
        radius >= 94
    ) {

        multiplier = 2;

        region = "DOUBLE";

    }


    const score =
        number * multiplier;


    registerThrow(
        score,
        region + " " + number
    );

}


/* =====================================================
   SCORE
===================================================== */

async function registerThrow(
    points,
    label
) {

    const list =
        getPlayerArray();


    const current =
        list.find(
            p =>
                p.id ===
                gameState.currentPlayerId
        );


    if (!current) {

        return;

    }


    const before =
        Number(current.score);


    const after =
        before - points;


    /*
     * 501 / 301
     *
     * ダブルアウト
     */

    let bust = false;

    let finished = false;


    if (after < 0) {

        bust = true;

    }
    else if (after === 1) {

        bust = true;

    }
    else if (after === 0) {

        const validFinish =
            label.startsWith("DOUBLE ") ||
            label === "BULL";

        if (validFinish) {

            finished = true;

        } else {

            bust = true;

        }

    }


    const actualScore =
        bust
            ? before
            : after;


    const newThrowNumber =
        gameState.throwNumber + 1;


    /*
     * 3投終了
     */

    const turnFinished =
        bust ||
        finished ||
        newThrowNumber >= 3;


    let nextPlayerId =
        current.id;


    if (turnFinished && !finished) {

        const index =
            list.findIndex(
                p => p.id === current.id
            );

        const nextIndex =
            (index + 1) % list.length;

        nextPlayerId =
            list[nextIndex].id;

    }


    if (finished) {

        gameState = {

            ...gameState,

            throwNumber:
                newThrowNumber,

            lastScore:
                points,

            lastLabel:
                label,

            gameFinished:
                true,

            currentPlayerId:
                current.id

        };

    }
    else {

        gameState = {

            ...gameState,

            throwNumber:
                turnFinished
                    ? 0
                    : newThrowNumber,

            lastScore:
                points,

            lastLabel:
                label,

            gameFinished:
                false,

            currentPlayerId:
                nextPlayerId

        };

    }


    const updates = {};


    updates[
        "players/" +
        current.id +
        "/score"
    ] = actualScore;


    const throwId =
        push(throwsRef).key;


    updates[
        "throws/" +
        throwId
    ] = {

        playerId:
            current.id,

        playerName:
            current.name,

        before,

        points,

        after:
            actualScore,

        label,

        bust,

        finished,

        timestamp:
            Date.now()

    };


    updates["state"] =
        gameState;


    try {

        await update(
            roomRef,
            updates
        );


        showHit(
            bust
                ? 0
                : points,
            bust
                ? "BUST"
                : label
        );


    } catch (error) {

        console.error(error);

        alert(
            "得点の保存に失敗しました。\n" +
            error.message
        );

    }

}


/* =====================================================
   HIT DISPLAY
===================================================== */

let hitTimer = null;


function showHit(
    score,
    label
) {

    document.getElementById(
        "hitScore"
    ).textContent = score;


    document.getElementById(
        "hitLabel"
    ).textContent = label;


    const display =
        document.getElementById(
            "hitDisplay"
        );


    display.classList.add("show");


    clearTimeout(hitTimer);


    hitTimer =
        setTimeout(() => {

            display.classList.remove("show");

        }, 600);

}

        document.getElementById(
            "outputPlayers"
        );


    container.innerHTML = "";


    list.forEach(
        (player, index) => {

                gameState.currentPlayerId
            ) {

                );

            }


            div.innerHTML = `

                <div>

                    </div>

                <div class="playerScore">

async function addPlayer() {

    const input =
        document.getElementById(
            "playerNameInput"
        );


    const name =
        input.value.trim();


    if (!name) {

        return;

    }


    const id =
        "player_" +
        Date.now();


    const order =
        getPlayerArray().length;


    const newPlayer = {

        name,

        score: gameType,

        order

    };


    try {

        await set(
            ref(
                db,
                "rooms/" +
                roomName +
                "/players/" +
                id
            ),
            newPlayer
        );


        playerDialog.classList.remove(
            "show"
        );


    } catch (error) {

        console.error(error);

        alert(
            "プレイヤー追加に失敗しました"
        );

    }

}


/* =====================================================
   DELETE PLAYER
===================================================== */

async function deletePlayer(id) {

    const list =
        getPlayerArray();


    if (list.length <= 1) {

        alert(
            "プレイヤーは最低1人必要です"
        );

        return;

    }


    const player =
        players[id];


    if (
        !confirm(
            player.name +
            " を削除しますか？"
        )
    ) {

        return;

    }


    const updates = {};


    updates[
        "players/" + id
    ] = null;


    /*
     * 現在のプレイヤーを
     * 削除した場合は次のプレイヤーへ
     */

    if (
        gameState.currentPlayerId === id
    ) {

        const index =
            list.findIndex(
                p => p.id === id
            );


        const next =
            list[
                (index + 1) %
                list.length
            ];


        gameState.currentPlayerId =
            next.id;

        gameState.throwNumber =
            0;


        updates["state"] =
            gameState;

    }


    try {

        await update(
            roomRef,
            updates
        );

    } catch (error) {

        console.error(error);

        alert(
            "削除に失敗しました"
        );

    }

}


/* =====================================================

===================================================== */

document
    .getElementById("resetButton")
    .addEventListener(

        resetGame
    );


async function resetGame() {

    if (
        !confirm(
            "全員のスコアをリセットしますか？"
        )
    ) {

        return;

    }


    const list =
        getPlayerArray();


    const updates = {};


    list.forEach(
        player => {

            updates[
                "players/" +
                player.id +
                "/score"
            ] = gameType;

        }
    );


    gameState = {

        currentPlayerId:
            list[0].id,

        throwNumber: 0,

        lastScore: 0,

        lastLabel: "",

        gameFinished: false

    };


    updates["state"] =
        gameState;


    try {

        await update(
            roomRef,
            updates
        );

        menuOverlay.classList.remove(
            "show"
        );

    } catch (error) {

        console.error(error);

        alert(
            "リセットに失敗しました"
        );

    }

}

/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
